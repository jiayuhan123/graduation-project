server:
  port: ${SERVER_PORT:8007}
  shutdown: graceful

spring:
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: local
  application:
    name: teaching-service

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  internal-api:
    enabled: ${INTERNAL_API_ENABLED:false}
    token: ${INTERNAL_API_TOKEN:}
  openapi:
    title: 教学服务 API
    description: 班级、师生关系、教师作业和提交汇总接口
    version: 1.0.0
  mq:
    confirm-timeout: ${MQ_CONFIRM_TIMEOUT:5s}
    outbox:
      fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:5000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      retention-days: ${OUTBOX_RETENTION_DAYS:7}
      cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
