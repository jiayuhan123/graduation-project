server:
  port: ${SERVER_PORT:8003}
  shutdown: graceful

spring:
  application:
    name: notification-service
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

mybatis-plus:
  global-config:
    banner: false

app:
  openapi:
    title: 通用通知服务 API
    description: 站内通知查询与已读状态接口
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
