server:
  port: ${SERVER_PORT:8006}
  shutdown: graceful

spring:
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: local
  application:
    name: learning-service

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  internal-api:
    enabled: ${INTERNAL_API_ENABLED:false}
    token: ${INTERNAL_API_TOKEN:}
  openapi:
    title: 学习闭环服务 API
    description: 统一练习、作答、诊断、掌握度、推荐与拍照批改接口
    version: 1.0.0
  mq:
    confirm-timeout: ${MQ_CONFIRM_TIMEOUT:5s}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
