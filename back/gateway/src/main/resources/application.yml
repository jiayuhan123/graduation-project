server:
  port: 10000

spring:
  application:
    name: gateway
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:111111}
      database: ${REDIS_DATABASE:0}

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 鉴权白名单配置 (本地配置兜底)
security:
  whitelist:
    - /api/user/login
    - /api/user/register
    - /actuator/health
    - /actuator/info
    - /doc.html
    - /webjars/**
    - /v3/api-docs/**
    - /swagger-resources/**
    - /swagger-ui/**

# Knife4j 聚合配置
knife4j:
  gateway:
    enabled: true
    # 指定服务发现的模式为 nacos 
    strategy: discover
    discover:
      enabled: true
      # 指定不聚合网关本身
      excluded-services:
        - gateway
