server:
  port: ${SERVER_PORT:10000}

spring:
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: local
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
            - id: file-service
              uri: lb://file-service
              predicates:
                - Path=/api/files/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/api/audits/**
            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/content/**
            - id: learning-service
              uri: lb://learning-service
              predicates:
                - Path=/api/learning/**
            - id: teaching-service
              uri: lb://teaching-service
              predicates:
                - Path=/api/teaching/**
            - id: game-service
              uri: lb://game-service
              predicates:
                - Path=/api/games/**
# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 鉴权白名单配置 (本地配置兜底)
security:
  whitelist:
    - /api/user/login
    - /api/user/login/wechat
    - /api/user/login/wechat/web/**
    - /api/user/register
    - /actuator/health
    - /actuator/info
    - /doc.html
    - /webjars/**
    - /v3/api-docs/**
    - /swagger-resources/**
    - /swagger-ui/**

# Knife4j 聚合配置
knife4j:
  gateway:
    enabled: true
    # 指定服务发现的模式为 nacos 
    strategy: discover
    discover:
      enabled: true
      # 指定不聚合网关本身
      excluded-services:
        - gateway

management:
  endpoints:
    web:
      exposure:
        # Prometheus 只应从本机或可信监控网络访问。
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
