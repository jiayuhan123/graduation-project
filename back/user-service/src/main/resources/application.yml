server:
  port: ${SERVER_PORT:8001}
  shutdown: graceful

spring:
  application:
    name: user-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:111111}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:111111}
      database: ${REDIS_DATABASE:0}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:111111}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
  flyway:
    # 由 Flyway 统一维护用户与 RBAC 表结构，禁止生产环境手工改表替代迁移。
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

sa-token:
  # 与网关读取的令牌名保持一致；默认允许同一账号多端登录但每次生成独立令牌。
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:604800}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:86400}
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

security:
  password:
    # BCrypt 工作因子可按部署机器性能通过环境变量调整。
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  login-attempt:
    # 一个时间窗口内失败达到阈值后暂时拒绝继续尝试。
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_DURATION:15m}

app:
  openapi:
    title: 通用用户服务 API
    description: 认证、个人账户、用户管理与 RBAC 接口
    version: 1.0.0
  mq:
    confirm-timeout: ${MQ_CONFIRM_TIMEOUT:5s}
    outbox:
      # 每个实例使用 FOR UPDATE SKIP LOCKED 并行领取，失败按指数退避重试。
      fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:5000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      # 成功事件保留 7 天后每日清理；FAILED 事件不会被自动删除。
      retention-days: ${OUTBOX_RETENTION_DAYS:7}
      cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}
  bootstrap-admin:
    # 默认关闭；启用时密码必须由环境变量注入，不能把默认管理员密码写入仓库。
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
