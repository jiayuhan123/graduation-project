server:
  port: ${SERVER_PORT:10000}
  shutdown: graceful

spring:
  application:
    name: graduation-project-monomer
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: server
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:20MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:21MB}
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

sa-token:
  token-name: satoken
  timeout: ${SA_TOKEN_TIMEOUT:604800}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:86400}
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

security:
  whitelist:
    - /api/user/login
    - /api/user/login/wechat
    - /api/user/login/wechat/web/**
    - /api/user/register
  password:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  login-attempt:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_DURATION:15m}

app:
  user:
    wechat:
      enabled: ${WECHAT_ENABLED:false}
      app-id: ${WECHAT_APP_ID:}
      secret: ${WECHAT_APP_SECRET:}
      code-session-url: ${WECHAT_CODE_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
      web:
        enabled: ${WECHAT_WEB_ENABLED:false}
        app-id: ${WECHAT_WEB_APP_ID:}
        secret: ${WECHAT_WEB_APP_SECRET:}
        redirect-uri: ${WECHAT_WEB_REDIRECT_URI:}
        authorize-url: ${WECHAT_WEB_AUTHORIZE_URL:https://open.weixin.qq.com/connect/qrconnect}
        access-token-url: ${WECHAT_WEB_ACCESS_TOKEN_URL:https://api.weixin.qq.com/sns/oauth2/access_token}
        state-ttl: ${WECHAT_WEB_STATE_TTL:10m}
  internal-api:
    enabled: ${INTERNAL_API_ENABLED:false}
    token: ${INTERNAL_API_TOKEN:}
  openapi:
    title: 小学数学个性化学习平台 API
    description: 用户、内容、学习、教学、游戏、文件、通知、审计与 AI Agent 模块化单体接口
    version: 1.0.0
  ai:
    enabled: ${AI_ENABLED:false}
    agent-base-url: ${AI_AGENT_BASE_URL:http://localhost:8100}
    bridge-token: ${AI_AGENT_BRIDGE_TOKEN:}
    tool-signing-secret: ${AI_TOOL_SIGNING_SECRET:}
    tool-token-ttl: ${AI_TOOL_TOKEN_TTL:5m}
    action-token-ttl: ${AI_ACTION_TOKEN_TTL:15m}
    stream-timeout: ${AI_STREAM_TIMEOUT:120s}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5s}
  mq:
    confirm-timeout: ${MQ_CONFIRM_TIMEOUT:5s}
    outbox:
      fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:5000}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      retention-days: ${OUTBOX_RETENTION_DAYS:7}
      cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 3 * * *}
  assignment-sync:
    fixed-delay-ms: ${ASSIGNMENT_SYNC_FIXED_DELAY_MS:3000}
    batch-size: ${ASSIGNMENT_SYNC_BATCH_SIZE:50}
    retention-days: ${ASSIGNMENT_SYNC_RETENTION_DAYS:7}
    cleanup-cron: ${ASSIGNMENT_SYNC_CLEANUP_CRON:0 20 3 * * *}
  game:
    expiry:
      fixed-delay-ms: ${GAME_EXPIRY_FIXED_DELAY_MS:5000}
  storage:
    oss:
      region: ${OSS_REGION:}
      endpoint: ${OSS_ENDPOINT:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket: ${OSS_BUCKET:}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
