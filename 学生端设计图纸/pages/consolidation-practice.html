<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巩固练习</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full flex flex-col" style="min-height: 100vh; background: linear-gradient(180deg, #FFF7F0 0%, #FFFFFF 40%);">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation -->
      <header class="px-4 py-3 flex items-center justify-between">
        <button class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: #F0F2F5;" aria-label="关闭">
          <i data-lucide="x" class="w-5 h-5" style="color: #636E72;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">巩固练习</h1>
        <button class="text-[15px] text-muted-foreground px-2 py-1 shrink-0">跳过</button>
      </header>

      <!-- 3. Practice info card -->
      <section class="px-4 mt-2">
        <div class="bg-white rounded-[20px] p-4" style="box-shadow: 0 4px 14px rgba(255,138,61,0.08);">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="text-[20px] leading-none">💪</span>
            <h2 class="text-[16px] font-bold text-foreground">巩固练习</h2>
          </div>
          <p class="text-[13px] text-muted-foreground leading-snug mb-3">根据闯关错题生成的相似题，完成后可再次挑战</p>
          <div class="flex flex-wrap items-center gap-2">
            <span class="inline-flex items-center gap-1 text-[12px] px-2.5 py-1 rounded-full" style="background-color: #FFF0E5; color: #636E72;">
              <span>📝</span>共5题
            </span>
            <span class="inline-flex items-center gap-1 text-[12px] px-2.5 py-1 rounded-full" style="background-color: #FFF0E5; color: #636E72;">
              <span>✖️</span>乘法口诀
            </span>
            <span class="inline-flex items-center gap-1 text-[12px] px-2.5 py-1 rounded-full" style="background-color: #FFF0E5; color: #636E72;">
              <span>🟢</span>简单
            </span>
            <span class="inline-flex items-center gap-1 text-[12px] px-2.5 py-1 rounded-full" style="background-color: #FFF0E5; color: #636E72;">
              <span>⏱️</span>预计3分钟
            </span>
          </div>
        </div>
      </section>

      <!-- 4. Progress bar -->
      <section class="px-4 mt-4">
        <p class="text-[14px] text-muted-foreground text-center mb-2">第 <span class="font-semibold" style="color: #FF8A3D;">1</span>/5 题</p>
        <div class="w-full rounded-full overflow-hidden" style="height: 8px; background-color: #FFF0E5;">
          <div class="h-full rounded-full" style="width: 20%; background-color: #FF8A3D;"></div>
        </div>
      </section>

      <!-- 5. Error review card -->
      <section class="px-4 mt-4">
        <div class="rounded-[12px] p-3" style="background-color: #FFF0E5;">
          <p class="text-[13px] font-medium mb-2 flex items-center gap-1" style="color: #FF8A3D;">
            <span>💡</span>这道题和刚才的错题相似
          </p>
          <p class="text-[13px] text-muted-foreground leading-relaxed">
            原错题：<span class="text-foreground">7 × 8 = ?</span> 你的答案：<span style="color: #FF3B30;">54</span> 正确答案：<span class="font-semibold" style="color: #FF8A3D;">56</span>
          </p>
        </div>
      </section>

      <!-- 6. Question display -->
      <section class="px-4 mt-5 flex-1 flex flex-col items-center">
        <span class="inline-flex items-center gap-1 text-[12px] font-medium px-3 py-1 rounded-full mb-5" style="background-color: rgba(77,171,247,0.14); color: #4DABF7;">
          <span>🎯</span>相似题
        </span>
        <h3 class="text-[48px] font-bold text-foreground leading-none tracking-tight text-center">
          7 × 9 = ?
        </h3>
        <p class="text-[14px] text-muted-foreground mt-4 flex items-center gap-1">
          <span>💡</span>提示：7的9倍
        </p>
      </section>

      <!-- 7. Answer input -->
      <section class="px-4 mt-6">
        <input type="text" inputmode="numeric" placeholder="输入答案"
          class="w-full rounded-[16px] text-center font-semibold outline-none"
          style="height: 64px; font-size: 32px; border: 2px solid #FF8A3D; background-color: #FFFFFF; color: #2D3436;" />
      </section>

      <!-- 8. Number keypad -->
      <section class="px-4 mt-4 mb-4">
        <div class="grid grid-cols-3 gap-2.5">
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">1</button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">2</button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">3</button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">4</button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">5</button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">6</button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">7</button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">8</button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">9</button>
          <button class="h-[52px] rounded-[12px] bg-white border flex items-center justify-center active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);" aria-label="删除">
            <i data-lucide="delete" class="w-5 h-5" style="color: #636E72;"></i>
          </button>
          <button class="h-[52px] rounded-[12px] bg-white border text-[20px] font-semibold text-foreground active:scale-95 transition-transform" style="border-color: #F0F2F5; box-shadow: 0 2px 6px rgba(45,52,54,0.04);">0</button>
          <button class="h-[52px] rounded-[12px] text-[16px] font-semibold text-white active:scale-95 transition-transform flex items-center justify-center gap-1" style="background-color: #FF8A3D; box-shadow: 0 4px 12px rgba(255,138,61,0.32);">
            下一题
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>
      </section>

      <!-- 9. Bottom safe area -->
      <div style="height: env(safe-area-inset-bottom, 20px);"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F8F9FB;
  --brand-muted-foreground: #636E72;
  --brand-border: #F0F2F5;
  --brand-input: #E0E4E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 10px;
  --brand-radius-md: 16px;
  --brand-radius-lg: 20px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #F0F2F5; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
