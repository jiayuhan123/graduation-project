<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口算练习-选择页</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation bar -->
      <header class="px-4 h-14 flex items-center justify-between">
        <button class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: #F0F2F5;" aria-label="返回">
          <i data-lucide="chevron-left" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[18px] font-semibold text-foreground">口算练习</h1>
        <button class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: #F0F2F5;" aria-label="设置">
          <i data-lucide="settings" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
      </header>

      <!-- 3. Practice type selection -->
      <section class="px-4 mt-3 mb-6">
        <h2 class="text-[17px] font-semibold text-foreground mb-3 flex items-center gap-1.5">📝 选择类型</h2>
        <div class="grid grid-cols-2 gap-3" data-select-group="type">
          <!-- 加法 (default selected) -->
          <button data-select-card data-color="#4DABF7" data-selected="true" class="relative bg-white rounded-[20px] p-4 flex flex-col items-start text-left" style="height: 120px; box-shadow: 0 4px 14px rgba(45,52,54,0.06); border: 2px solid #4DABF7;">
            <span class="absolute top-2.5 right-2.5 text-[18px] leading-none" data-check>✅</span>
            <div class="w-14 h-14 rounded-[16px] flex items-center justify-center mb-2.5 shrink-0" style="background-color: rgba(77,171,247,0.14);">
              <span class="text-[28px] leading-none">➕</span>
            </div>
            <h3 class="text-[15px] font-semibold text-foreground leading-tight">加法练习</h3>
            <p class="text-[12px] text-muted-foreground mt-0.5 leading-tight">1-100以内</p>
          </button>
          <!-- 减法 -->
          <button data-select-card data-color="#FF6B9D" data-selected="false" class="relative bg-white rounded-[20px] p-4 flex flex-col items-start text-left" style="height: 120px; box-shadow: 0 4px 14px rgba(45,52,54,0.06); border: 2px solid transparent;">
            <span class="absolute top-2.5 right-2.5 text-[18px] leading-none hidden" data-check>✅</span>
            <div class="w-14 h-14 rounded-[16px] flex items-center justify-center mb-2.5 shrink-0" style="background-color: rgba(255,107,157,0.14);">
              <span class="text-[28px] leading-none">➖</span>
            </div>
            <h3 class="text-[15px] font-semibold text-foreground leading-tight">减法练习</h3>
            <p class="text-[12px] text-muted-foreground mt-0.5 leading-tight">1-100以内</p>
          </button>
          <!-- 乘法 -->
          <button data-select-card data-color="#FF8A3D" data-selected="false" class="relative bg-white rounded-[20px] p-4 flex flex-col items-start text-left" style="height: 120px; box-shadow: 0 4px 14px rgba(45,52,54,0.06); border: 2px solid transparent;">
            <span class="absolute top-2.5 right-2.5 text-[18px] leading-none hidden" data-check>✅</span>
            <div class="w-14 h-14 rounded-[16px] flex items-center justify-center mb-2.5 shrink-0" style="background-color: rgba(255,138,61,0.14);">
              <span class="text-[28px] leading-none">✖️</span>
            </div>
            <h3 class="text-[15px] font-semibold text-foreground leading-tight">乘法练习</h3>
            <p class="text-[12px] text-muted-foreground mt-0.5 leading-tight">乘法口诀表</p>
          </button>
          <!-- 除法 -->
          <button data-select-card data-color="#4CAF50" data-selected="false" class="relative bg-white rounded-[20px] p-4 flex flex-col items-start text-left" style="height: 120px; box-shadow: 0 4px 14px rgba(45,52,54,0.06); border: 2px solid transparent;">
            <span class="absolute top-2.5 right-2.5 text-[18px] leading-none hidden" data-check>✅</span>
            <div class="w-14 h-14 rounded-[16px] flex items-center justify-center mb-2.5 shrink-0" style="background-color: rgba(76,175,80,0.14);">
              <span class="text-[28px] leading-none">➗</span>
            </div>
            <h3 class="text-[15px] font-semibold text-foreground leading-tight">除法练习</h3>
            <p class="text-[12px] text-muted-foreground mt-0.5 leading-tight">表内除法</p>
          </button>
        </div>
      </section>

      <!-- 4. Difficulty selection -->
      <section class="px-4 mb-6">
        <h2 class="text-[17px] font-semibold text-foreground mb-3 flex items-center gap-1.5">🎯 选择难度</h2>
        <div class="grid grid-cols-3 gap-3" data-select-group="difficulty">
          <!-- 简单 -->
          <button data-pill data-selected="false" class="h-10 rounded-full flex items-center justify-center text-[15px] font-medium transition-colors" style="background-color: #E8F5E9; color: #4CAF50;">
            简单
          </button>
          <!-- 中等 (default selected) -->
          <button data-pill data-selected="true" class="h-10 rounded-full flex items-center justify-center text-[15px] font-medium transition-colors" style="background-color: #FF8A3D; color: #FFFFFF;">
            中等
          </button>
          <!-- 困难 -->
          <button data-pill data-selected="false" class="h-10 rounded-full flex items-center justify-center text-[15px] font-medium transition-colors" style="background-color: #FFEBEE; color: #FF5252;">
            困难
          </button>
        </div>
      </section>

      <!-- 5. Question count selection -->
      <section class="px-4 mb-8">
        <h2 class="text-[17px] font-semibold text-foreground mb-3 flex items-center gap-1.5">📊 选择题量</h2>
        <div class="grid grid-cols-3 gap-3" data-select-group="count">
          <!-- 10题 -->
          <button data-pill data-selected="false" class="h-10 rounded-full flex items-center justify-center text-[15px] font-medium transition-colors" style="background-color: #F0F2F5; color: #636E72;">
            10题
          </button>
          <!-- 20题 (default selected) -->
          <button data-pill data-selected="true" class="h-10 rounded-full flex items-center justify-center text-[15px] font-medium transition-colors" style="background-color: #FF8A3D; color: #FFFFFF;">
            20题
          </button>
          <!-- 30题 -->
          <button data-pill data-selected="false" class="h-10 rounded-full flex items-center justify-center text-[15px] font-medium transition-colors" style="background-color: #F0F2F5; color: #636E72;">
            30题
          </button>
        </div>
      </section>

      <!-- 6. Bottom start button -->
      <section class="px-4 mb-6">
        <button class="w-[80%] mx-auto block h-[52px] rounded-full flex items-center justify-center text-[17px] font-semibold" style="background-color: #FF8A3D; color: #FFFFFF; box-shadow: 0 6px 20px rgba(255,138,61,0.4);">
          开始练习 ✏️
        </button>
      </section>

      <!-- 7. Bottom safe area -->
      <div style="height: 34px;"></div>
    </main>

    <script>
      lucide.createIcons();

      // Type card selection (single choice)
      document.querySelectorAll('[data-select-group="type"] [data-select-card]').forEach(function (card) {
        card.addEventListener('click', function () {
          var group = card.closest('[data-select-group]');
          group.querySelectorAll('[data-select-card]').forEach(function (c) {
            c.setAttribute('data-selected', 'false');
            c.style.borderColor = 'transparent';
            var chk = c.querySelector('[data-check]');
            if (chk) chk.classList.add('hidden');
          });
          card.setAttribute('data-selected', 'true');
          card.style.borderColor = card.getAttribute('data-color');
          var check = card.querySelector('[data-check]');
          if (check) check.classList.remove('hidden');
        });
      });

      // Pill selection helper (single choice within group)
      function bindPillGroup(groupName, inactiveBg, inactiveColor, activeBg, activeColor) {
        document.querySelectorAll('[data-select-group="' + groupName + '"] [data-pill]').forEach(function (pill) {
          pill.addEventListener('click', function () {
            var group = pill.closest('[data-select-group]');
            group.querySelectorAll('[data-pill]').forEach(function (p) {
              p.setAttribute('data-selected', 'false');
              p.style.backgroundColor = inactiveBg;
              p.style.color = inactiveColor;
            });
            pill.setAttribute('data-selected', 'true');
            pill.style.backgroundColor = activeBg;
            pill.style.color = activeColor;
          });
        });
      }

      // Difficulty: preserve each option's own color when unselected
      document.querySelectorAll('[data-select-group="difficulty"] [data-pill]').forEach(function (pill) {
        pill.addEventListener('click', function () {
          var group = pill.closest('[data-select-group]');
          var palette = {
            '简单': { bg: '#E8F5E9', color: '#4CAF50' },
            '中等': { bg: '#FFF0E5', color: '#FF8A3D' },
            '困难': { bg: '#FFEBEE', color: '#FF5252' }
          };
          group.querySelectorAll('[data-pill]').forEach(function (p) {
            p.setAttribute('data-selected', 'false');
            var label = p.textContent.trim();
            var pc = palette[label] || { bg: '#F0F2F5', color: '#636E72' };
            p.style.backgroundColor = pc.bg;
            p.style.color = pc.color;
          });
          pill.setAttribute('data-selected', 'true');
          pill.style.backgroundColor = '#FF8A3D';
          pill.style.color = '#FFFFFF';
        });
      });

      // Question count: uniform inactive style
      bindPillGroup('count', '#F0F2F5', '#636E72', '#FF8A3D', '#FFFFFF');
    </script>
    <style id="style-override">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F8F9FB;
  --brand-muted-foreground: #636E72;
  --brand-border: #F0F2F5;
  --brand-input: #E0E4E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 10px;
  --brand-radius-md: 16px;
  --brand-radius-lg: 20px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #F0F2F5; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
