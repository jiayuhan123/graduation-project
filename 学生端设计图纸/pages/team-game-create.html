<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组队闯关</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation -->
      <header class="px-4 h-11 flex items-center justify-between">
        <button class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: #F0F2F5;" aria-label="返回">
          <i data-lucide="arrow-left" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">组队闯关</h1>
        <div class="w-9"></div>
      </header>

      <!-- 3. Mode selection cards -->
      <section class="px-4 mt-4 mb-6">
        <div class="space-y-3">
          <!-- Create team (active) -->
          <div class="rounded-[20px] p-5 flex items-center gap-4" style="background: linear-gradient(135deg, #FF8A3D 0%, #FF6B2B 100%); box-shadow: 0 8px 20px rgba(255,138,61,0.32);">
            <div class="w-14 h-14 rounded-[16px] flex items-center justify-center shrink-0" style="background-color: rgba(255,255,255,0.22);">
              <span class="text-[30px] leading-none">🚩</span>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[17px] font-bold text-white">创建队伍</h3>
              <p class="text-[13px] mt-0.5" style="color: rgba(255,255,255,0.9);">创建新队伍，邀请同学加入</p>
            </div>
            <div class="w-7 h-7 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,255,255,0.25);">
              <i data-lucide="check" class="w-4 h-4 text-white"></i>
            </div>
          </div>
          <!-- Join team -->
          <div class="rounded-[20px] p-5 flex items-center gap-4 bg-card" style="border: 2px solid #FF8A3D; box-shadow: 0 4px 14px rgba(255,138,61,0.10);">
            <div class="w-14 h-14 rounded-[16px] flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.12);">
              <span class="text-[30px] leading-none">🤝</span>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[17px] font-bold text-foreground">加入队伍</h3>
              <p class="text-[13px] text-muted-foreground mt-0.5">输入队伍码加入已有队伍</p>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #FF8A3D;"></i>
          </div>
        </div>
      </section>

      <!-- 4. My team -->
      <section class="px-4 mb-6">
        <h2 class="text-[18px] font-semibold text-foreground mb-3 flex items-center gap-1.5">👥 我的队伍</h2>
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <!-- Team name + code -->
          <div class="flex items-center justify-between mb-4 gap-2">
            <h3 class="text-[18px] font-bold text-foreground truncate">数学先锋队</h3>
            <button class="shrink-0 flex items-center gap-1.5 pl-3 pr-2.5 py-1.5 rounded-full" style="background-color: rgba(255,138,61,0.12);" aria-label="复制队伍码">
              <span class="text-[13px] font-bold tracking-wide" style="color: #FF8A3D;">ABC123</span>
              <i data-lucide="copy" class="w-3.5 h-3.5" style="color: #FF8A3D;"></i>
            </button>
          </div>
          <!-- Members -->
          <div class="grid grid-cols-4 gap-2">
            <!-- Member 1: 小明 队长 已加入 -->
            <div class="flex flex-col items-center text-center">
              <div class="relative">
                <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background-color: #FF8A3D;">
                  <span class="text-[24px] leading-none">🧒</span>
                </div>
                <span class="absolute -top-1 -right-1 text-[12px] leading-none">👑</span>
                <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full flex items-center justify-center" style="background-color: #34C759; border: 2px solid #FFFFFF;">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white"></i>
                </span>
              </div>
              <span class="text-[14px] font-medium text-foreground mt-2 truncate w-full">小明</span>
              <span class="text-[12px] mt-0.5 font-medium" style="color: #34C759;">已加入</span>
            </div>
            <!-- Member 2: 李华 已加入 -->
            <div class="flex flex-col items-center text-center">
              <div class="relative">
                <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background-color: #4DABF7;">
                  <span class="text-[24px] leading-none">👦</span>
                </div>
                <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full flex items-center justify-center" style="background-color: #34C759; border: 2px solid #FFFFFF;">
                  <i data-lucide="check" class="w-2.5 h-2.5 text-white"></i>
                </span>
              </div>
              <span class="text-[14px] font-medium text-foreground mt-2 truncate w-full">李华</span>
              <span class="text-[12px] mt-0.5 font-medium" style="color: #34C759;">已加入</span>
            </div>
            <!-- Member 3: 王小红 等待加入 -->
            <div class="flex flex-col items-center text-center">
              <div class="relative">
                <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background-color: #E0E4E8;">
                  <span class="text-[24px] leading-none opacity-70">🧑</span>
                </div>
                <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full flex items-center justify-center" style="background-color: #FF9500; border: 2px solid #FFFFFF;">
                  <i data-lucide="loader" class="w-2.5 h-2.5 text-white"></i>
                </span>
              </div>
              <span class="text-[14px] font-medium text-foreground mt-2 truncate w-full">王小红</span>
              <span class="text-[12px] mt-0.5 font-medium" style="color: #FF9500;">等待加入</span>
            </div>
            <!-- Member 4: 空位 邀请 -->
            <button class="flex flex-col items-center text-center" aria-label="邀请同学">
              <div class="w-12 h-12 rounded-full flex items-center justify-center" style="border: 2px dashed #FF8A3D; background-color: rgba(255,138,61,0.06);">
                <i data-lucide="plus" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="text-[14px] font-medium text-foreground mt-2">空位</span>
              <span class="text-[12px] mt-0.5 font-medium" style="color: #FF8A3D;">➕ 邀请</span>
            </button>
          </div>
        </div>
      </section>

      <!-- 5. Level selection -->
      <section class="px-4 mb-6">
        <h2 class="text-[18px] font-semibold text-foreground mb-3 flex items-center gap-1.5">🎯 选择关卡</h2>
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <!-- Knowledge point -->
          <div class="mb-4">
            <p class="text-[13px] text-muted-foreground mb-2.5">知识点</p>
            <div class="flex flex-wrap gap-2">
              <span class="px-4 py-2 rounded-full text-[14px] font-semibold" style="background-color: #FF8A3D; color: #FFFFFF; box-shadow: 0 4px 10px rgba(255,138,61,0.3);">乘法口诀</span>
              <span class="px-4 py-2 rounded-full text-[14px] font-medium" style="background-color: #FFF0E5; color: #636E72;">表内除法</span>
              <span class="px-4 py-2 rounded-full text-[14px] font-medium" style="background-color: #FFF0E5; color: #636E72;">混合运算</span>
            </div>
          </div>
          <!-- Divider -->
          <div class="h-px bg-border mb-4"></div>
          <!-- Difficulty -->
          <div class="mb-4">
            <p class="text-[13px] text-muted-foreground mb-2.5">难度</p>
            <div class="flex flex-wrap gap-2">
              <span class="px-4 py-2 rounded-full text-[14px] font-medium" style="background-color: #FFF0E5; color: #636E72;">简单</span>
              <span class="px-4 py-2 rounded-full text-[14px] font-semibold" style="background-color: #FF8A3D; color: #FFFFFF; box-shadow: 0 4px 10px rgba(255,138,61,0.3);">中等</span>
              <span class="px-4 py-2 rounded-full text-[14px] font-medium" style="background-color: #FFF0E5; color: #636E72;">困难</span>
            </div>
          </div>
          <!-- Divider -->
          <div class="h-px bg-border mb-4"></div>
          <!-- Question count -->
          <div class="flex items-center justify-between">
            <p class="text-[13px] text-muted-foreground">题量</p>
            <div class="flex items-center gap-1.5">
              <span class="text-[20px]">📝</span>
              <span class="text-[15px] font-bold text-foreground">共10题</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 6. Bottom action -->
      <section class="px-4 mb-4">
        <div class="flex flex-col items-center">
          <button class="w-[80%] py-3.5 rounded-full text-[16px] font-bold text-white flex items-center justify-center gap-2" style="background: linear-gradient(135deg, #FF8A3D 0%, #FF6B2B 100%); box-shadow: 0 8px 20px rgba(255,138,61,0.4);">
            <span class="text-[18px] leading-none">🎮</span>
            <span>开始团队闯关</span>
          </button>
          <button class="mt-3 text-[14px] font-medium flex items-center gap-1" style="color: #FF8A3D;" aria-label="分享队伍码邀请同学">
            <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
            <span>分享队伍码邀请同学</span>
          </button>
        </div>
      </section>

      <!-- 7. Bottom safe area -->
      <div style="height: env(safe-area-inset-bottom, 0px); min-height: 20px;"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F8F9FB;
  --brand-muted-foreground: #636E72;
  --brand-border: #F0F2F5;
  --brand-input: #E0E4E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 10px;
  --brand-radius-md: 16px;
  --brand-radius-lg: 20px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #F0F2F5; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
