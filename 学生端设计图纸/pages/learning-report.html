<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习报告</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation bar -->
      <header class="px-4 h-[52px] flex items-center justify-between">
        <button class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: #F0F2F5;" aria-label="返回">
          <i data-lucide="arrow-left" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[18px] font-semibold text-foreground">学习报告</h1>
        <button class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: #F0F2F5;" aria-label="分享">
          <i data-lucide="share-2" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
      </header>

      <!-- 3. Time selection pills -->
      <section class="px-4 mt-3 mb-4">
        <div class="flex items-center gap-2.5">
          <button class="flex-1 h-9 rounded-full text-[14px] font-semibold flex items-center justify-center" style="background-color: #FF8A3D; color: #FFFFFF; box-shadow: 0 4px 10px rgba(255,138,61,0.28);">本周</button>
          <button class="flex-1 h-9 rounded-full text-[14px] font-medium flex items-center justify-center" style="background-color: #F8F9FB; color: #636E72;">本月</button>
          <button class="flex-1 h-9 rounded-full text-[14px] font-medium flex items-center justify-center" style="background-color: #F8F9FB; color: #636E72;">本学期</button>
        </div>
      </section>

      <!-- 4. Overall performance card -->
      <section class="px-4 mb-6">
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="flex flex-col items-center text-center mb-5">
            <span class="text-[48px] leading-none">🏆</span>
            <h2 class="text-[18px] font-bold text-card-foreground mt-3">本周表现</h2>
            <p class="text-[14px] mt-1.5" style="color: #FF8A3D;">表现优秀！继续加油～</p>
          </div>
          <div class="flex items-start justify-between">
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] font-bold text-foreground leading-none">156</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">总答题</span>
            </div>
            <div class="w-px h-7 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] font-bold text-foreground leading-none">83%</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">正确率</span>
            </div>
            <div class="w-px h-7 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] font-bold text-foreground leading-none">2.5h</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">用时</span>
            </div>
            <div class="w-px h-7 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] font-bold text-foreground leading-none">+280</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">积分</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 5. Knowledge mastery -->
      <section class="px-4 mb-6">
        <h2 class="text-[18px] font-semibold text-foreground mb-3 flex items-center gap-1.5">📈 知识点掌握</h2>
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <!-- 100以内加法 85% green -->
          <div class="mb-4 last:mb-0">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[14px] text-card-foreground">100以内加法</span>
              <span class="text-[14px] font-bold text-card-foreground">85% 🟢</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 85%; background-color: #4CAF50;"></div>
            </div>
          </div>
          <!-- 100以内减法 78% orange -->
          <div class="mb-4 last:mb-0">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[14px] text-card-foreground">100以内减法</span>
              <span class="text-[14px] font-bold text-card-foreground">78% 🟡</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 78%; background-color: #FF8A3D;"></div>
            </div>
          </div>
          <!-- 乘法口诀 92% green -->
          <div class="mb-4 last:mb-0">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[14px] text-card-foreground">乘法口诀</span>
              <span class="text-[14px] font-bold text-card-foreground">92% 🟢</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 92%; background-color: #4CAF50;"></div>
            </div>
          </div>
          <!-- 表内除法 60% orange -->
          <div class="mb-4 last:mb-0">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[14px] text-card-foreground">表内除法</span>
              <span class="text-[14px] font-bold text-card-foreground">60% 🟠</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 60%; background-color: #FF8A3D;"></div>
            </div>
          </div>
          <!-- 混合运算 45% red -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[14px] text-card-foreground">混合运算</span>
              <span class="text-[14px] font-bold text-card-foreground">45% 🔴</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 45%; background-color: #FF453A;"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 6. Learning trend - daily bar chart -->
      <section class="px-4 mb-6">
        <h2 class="text-[18px] font-semibold text-foreground mb-3 flex items-center gap-1.5">📅 每日答题量</h2>
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="flex items-end justify-between gap-2" style="height: 160px;">
            <!-- 周一 15 -->
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <div class="w-full rounded-t-[6px]" style="height: 50%; background-color: #FF8A3D;"></div>
            </div>
            <!-- 周二 22 -->
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <div class="w-full rounded-t-[6px]" style="height: 73.3%; background-color: #FF8A3D;"></div>
            </div>
            <!-- 周三 18 -->
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <div class="w-full rounded-t-[6px]" style="height: 60%; background-color: #FF8A3D;"></div>
            </div>
            <!-- 周四 25 -->
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <div class="w-full rounded-t-[6px]" style="height: 83.3%; background-color: #FF8A3D;"></div>
            </div>
            <!-- 周五 30 peak -->
            <div class="flex-1 flex flex-col items-center justify-end h-full relative">
              <span class="absolute text-[10px] font-semibold" style="color: #FF8A3D; top: -2px;">峰值30</span>
              <div class="w-full rounded-t-[6px]" style="height: 100%; background-color: #FF8A3D;"></div>
            </div>
            <!-- 周六 28 -->
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <div class="w-full rounded-t-[6px]" style="height: 93.3%; background-color: #FF8A3D;"></div>
            </div>
            <!-- 周日 18 -->
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <div class="w-full rounded-t-[6px]" style="height: 60%; background-color: #FF8A3D;"></div>
            </div>
          </div>
          <div class="flex items-center justify-between gap-2 mt-2.5">
            <span class="flex-1 text-[12px] text-muted-foreground text-center">周一</span>
            <span class="flex-1 text-[12px] text-muted-foreground text-center">周二</span>
            <span class="flex-1 text-[12px] text-muted-foreground text-center">周三</span>
            <span class="flex-1 text-[12px] text-muted-foreground text-center">周四</span>
            <span class="flex-1 text-[12px] text-muted-foreground text-center">周五</span>
            <span class="flex-1 text-[12px] text-muted-foreground text-center">周六</span>
            <span class="flex-1 text-[12px] text-muted-foreground text-center">周日</span>
          </div>
        </div>
      </section>

      <!-- 7. Learning suggestions -->
      <section class="px-4 mb-6">
        <h2 class="text-[18px] font-semibold text-foreground mb-3 flex items-center gap-1.5">💡 学习建议</h2>
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <ul class="flex flex-col gap-3">
            <li class="text-[14px] text-card-foreground leading-snug flex items-start gap-2">
              <span class="text-[16px] leading-none shrink-0">✅</span>
              <span>乘法掌握优秀，保持练习</span>
            </li>
            <li class="text-[14px] text-card-foreground leading-snug flex items-start gap-2">
              <span class="text-[16px] leading-none shrink-0">⚠️</span>
              <span>除法和混合运算需要加强</span>
            </li>
            <li class="text-[14px] text-card-foreground leading-snug flex items-start gap-2">
              <span class="text-[16px] leading-none shrink-0">📌</span>
              <span>建议每天练习10道除法题</span>
            </li>
            <li class="text-[14px] text-card-foreground leading-snug flex items-start gap-2">
              <span class="text-[16px] leading-none shrink-0">🎯</span>
              <span>目标：下周正确率提升到88%</span>
            </li>
          </ul>
        </div>
      </section>

      <!-- 8. Download report button -->
      <section class="px-4 mb-6">
        <button class="w-full h-12 rounded-full flex items-center justify-center gap-2 text-[15px] font-semibold" style="background-color: #FFFFFF; color: #FF8A3D; border: 1.5px solid #FF8A3D;">
          <i data-lucide="download" class="w-5 h-5" style="color: #FF8A3D;"></i>
          <span>下载报告</span>
        </button>
      </section>

      <!-- 9. Bottom safe area -->
      <div style="height: 24px;"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F8F9FB;
  --brand-muted-foreground: #636E72;
  --brand-border: #F0F2F5;
  --brand-input: #E0E4E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 10px;
  --brand-radius-md: 16px;
  --brand-radius-lg: 20px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #F0F2F5; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
