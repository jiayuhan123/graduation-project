<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full" style="background-color: #F8F9FB;">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top nav bar -->
      <header class="px-4 h-14 flex items-center justify-between">
        <div class="w-11"></div>
        <h1 class="text-[18px] font-semibold text-foreground">我的</h1>
        <button class="w-11 h-11 rounded-full flex items-center justify-center shrink-0" style="background-color: #F0F2F5;" aria-label="设置">
          <i data-lucide="settings" class="w-5 h-5" style="color: #636E72;"></i>
        </button>
      </header>

      <!-- 3. Personal info card -->
      <section class="px-4 mt-2 mb-5">
        <div class="bg-white rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-4">
            <div class="w-[72px] h-[72px] rounded-full flex items-center justify-center shrink-0" style="background: linear-gradient(135deg, #FFB07A 0%, #FF8A3D 100%); box-shadow: 0 6px 14px rgba(255,138,61,0.32);">
              <span class="text-white font-semibold" style="font-size: 30px; line-height: 1;">明</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <h2 class="text-[20px] font-bold text-foreground leading-tight">小明</h2>
                <span class="text-[12px] font-semibold px-2 py-0.5 rounded-full text-white shrink-0" style="background-color: #FF8A3D;">Lv.5</span>
              </div>
              <p class="text-[13px] text-muted-foreground mt-1">阳光小学 三年级2班</p>
            </div>
          </div>
          <div class="flex items-center justify-between mt-4 pt-4" style="border-top: 1px solid #F0F2F5;">
            <div class="flex flex-col items-center flex-1">
              <div class="flex items-center gap-1">
                <span class="text-[14px] leading-none">⭐</span>
                <span class="text-[16px] font-bold text-foreground leading-none">1280</span>
              </div>
              <span class="text-[11px] text-muted-foreground mt-1">积分</span>
            </div>
            <div class="w-px h-7 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <div class="flex items-center gap-1">
                <span class="text-[14px] leading-none">🏅</span>
                <span class="text-[16px] font-bold text-foreground leading-none">白银段位</span>
              </div>
              <span class="text-[11px] text-muted-foreground mt-1">段位</span>
            </div>
            <div class="w-px h-7 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <div class="flex items-center gap-1">
                <span class="text-[14px] leading-none">🔥</span>
                <span class="text-[16px] font-bold text-foreground leading-none">7天</span>
              </div>
              <span class="text-[11px] text-muted-foreground mt-1">连续</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. Learning data overview -->
      <section class="px-4 mb-5">
        <div class="bg-white rounded-[16px] p-4 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-4">
            <div class="flex flex-col items-center text-center">
              <span class="text-[22px] leading-none">📝</span>
              <span class="text-[18px] font-bold text-foreground mt-1.5 leading-none">520</span>
              <span class="text-[12px] text-muted-foreground mt-1">总答题</span>
            </div>
            <div class="flex flex-col items-center text-center" style="border-left: 1px solid #F0F2F5;">
              <span class="text-[22px] leading-none">✅</span>
              <span class="text-[18px] font-bold text-foreground mt-1.5 leading-none">85%</span>
              <span class="text-[12px] text-muted-foreground mt-1">正确率</span>
            </div>
            <div class="flex flex-col items-center text-center" style="border-left: 1px solid #F0F2F5;">
              <span class="text-[22px] leading-none">⏱️</span>
              <span class="text-[18px] font-bold text-foreground mt-1.5 leading-none">12h</span>
              <span class="text-[12px] text-muted-foreground mt-1">学习时长</span>
            </div>
            <div class="flex flex-col items-center text-center" style="border-left: 1px solid #F0F2F5;">
              <span class="text-[22px] leading-none">🏆</span>
              <span class="text-[18px] font-bold text-foreground mt-1.5 leading-none">8</span>
              <span class="text-[12px] text-muted-foreground mt-1">通关数</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 5. Achievement wall -->
      <section class="px-4 mb-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-[17px] font-semibold text-foreground flex items-center gap-1.5">🏅 我的成就</h2>
        </div>
        <div class="bg-white rounded-[20px] p-4 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-3 gap-3">
            <div class="flex flex-col items-center text-center">
              <div class="w-[52px] h-[52px] rounded-full flex items-center justify-center mb-1.5" style="background-color: rgba(255,138,61,0.15);">
                <span class="text-[24px] leading-none">⭐</span>
              </div>
              <span class="text-[12px] font-medium text-foreground leading-tight">积分达人</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-[52px] h-[52px] rounded-full flex items-center justify-center mb-1.5" style="background-color: rgba(77,171,247,0.15);">
                <span class="text-[24px] leading-none">⚡</span>
              </div>
              <span class="text-[12px] font-medium text-foreground leading-tight">速算高手</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-[52px] h-[52px] rounded-full flex items-center justify-center mb-1.5" style="background-color: rgba(255,107,157,0.15);">
                <span class="text-[24px] leading-none">🔥</span>
              </div>
              <span class="text-[12px] font-medium text-foreground leading-tight">连续7天</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-[52px] h-[52px] rounded-full flex items-center justify-center mb-1.5" style="background-color: rgba(76,175,80,0.15);">
                <span class="text-[24px] leading-none">🏆</span>
              </div>
              <span class="text-[12px] font-medium text-foreground leading-tight">通关达人</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-[52px] h-[52px] rounded-full flex items-center justify-center mb-1.5" style="background-color: #F0F2F5;">
                <span class="text-[24px] leading-none" style="filter: grayscale(1); opacity: 0.5;">👑</span>
              </div>
              <span class="text-[12px] font-medium text-muted-foreground leading-tight flex items-center gap-0.5">🔒 数学之王</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-[52px] h-[52px] rounded-full flex items-center justify-center mb-1.5" style="background-color: #F0F2F5;">
                <span class="text-[24px] leading-none" style="filter: grayscale(1); opacity: 0.5;">🎯</span>
              </div>
              <span class="text-[12px] font-medium text-muted-foreground leading-tight flex items-center gap-0.5">🔒 全对达人</span>
            </div>
          </div>
          <div class="mt-4 pt-3 text-center" style="border-top: 1px solid #F0F2F5;">
            <a class="text-[13px] font-medium" style="color: #FF8A3D;">查看全部成就 →</a>
          </div>
        </div>
      </section>

      <!-- 6. Function menu list -->
      <section class="px-4 mb-8">
        <div class="bg-white rounded-[20px] shadow-sm overflow-hidden" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-3 px-4" style="height: 52px;">
            <span class="text-[20px] leading-none shrink-0">📊</span>
            <span class="text-[15px] text-foreground flex-1">学习报告</span>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #B2BEC3;"></i>
          </div>
          <div class="h-px bg-border ml-4"></div>
          <div class="flex items-center gap-3 px-4" style="height: 52px;">
            <span class="text-[20px] leading-none shrink-0">📋</span>
            <span class="text-[15px] text-foreground flex-1">错题本</span>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #B2BEC3;"></i>
          </div>
          <div class="h-px bg-border ml-4"></div>
          <div class="flex items-center gap-3 px-4" style="height: 52px;">
            <span class="text-[20px] leading-none shrink-0">🎯</span>
            <span class="text-[15px] text-foreground flex-1">学习目标</span>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #B2BEC3;"></i>
          </div>
          <div class="h-px bg-border ml-4"></div>
          <div class="flex items-center gap-3 px-4" style="height: 52px;">
            <span class="text-[20px] leading-none shrink-0">🔔</span>
            <span class="text-[15px] text-foreground flex-1">消息通知</span>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #B2BEC3;"></i>
          </div>
          <div class="h-px bg-border ml-4"></div>
          <div class="flex items-center gap-3 px-4" style="height: 52px;">
            <span class="text-[20px] leading-none shrink-0">⚙️</span>
            <span class="text-[15px] text-foreground flex-1">设置</span>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #B2BEC3;"></i>
          </div>
        </div>
      </section>
    </main>

    <!-- 7. Bottom navigation -->
    <nav data-mobile-nav="global" class="w-full h-[64px]"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a data-nav-key="home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a><a data-nav-key="practice" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="pencil" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">练习</span></a><a data-nav-key="games" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="gamepad-2" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">闯关</span></a><a data-nav-key="profile" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>

    <script>lucide.createIcons();</script>
    <style id="style-override">

</style>
    <style id="critical-layout">

</body>
</html>
