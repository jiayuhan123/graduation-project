          <i data-lucide="trophy" class="w-5 h-5" style="color: #FF8A3D;"></i>
        </button>
      </header>

      <!-- 3. Chapter info card -->
      <section class="px-4 mt-2 mb-3">
        <div class="bg-card rounded-[20px] p-4 shadow-sm flex items-center gap-3" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">

            <span class="text-[28px] leading-none">🏰</span>
          </div>
          <div class="flex-1 min-w-0">
            <h2 class="text-[18px] font-bold text-card-foreground">乘法城堡</h2>
            <p class="text-[13px] text-muted-foreground mt-0.5">共12关 · 已通关5关</p>
            <div class="w-full rounded-full overflow-hidden mt-2" style="height: 8px; background-color: #FFF0E5;">
              <div class="h-full rounded-full" style="width: 41.7%; background-color: #FF8A3D;"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. Level map (snake path) -->
      <section class="map-section py-2 mb-2" style="background-color: #FFFCF8;">

        <!-- Level 1 · right · done 3★ -->
        <div class="level-row" data-side="right">
          <div class="info-card">
            <p class="text-[12px] text-muted-foreground leading-tight">第1关</p>
            <p class="text-[15px] font-semibold text-card-foreground leading-tight mt-0.5">加法入门</p>
            <p class="text-[12px] text-muted-foreground mt-1">最佳成绩 <span class="font-medium" style="color: #4CAF50;">95%</span></p>
          </div>
          <div class="node-wrap">
            <div class="node-top"><span class="text-[12px] leading-none">⭐⭐⭐</span></div>
            <div class="node-circle node-done"><i data-lucide="check" class="w-8 h-8"></i></div>
          </div>
        </div>

        <!-- connector 1→2 right→left -->
        <svg class="connector" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 87 0 C 87 20, 13 20, 13 40" fill="none" stroke="#D5D8DC" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>

        <!-- Level 2 · left · done 3★ -->
        <div class="level-row" data-side="left">
          <div class="node-wrap">
            <div class="node-top"><span class="text-[12px] leading-none">⭐⭐⭐</span></div>
            <div class="node-circle node-done"><i data-lucide="check" class="w-8 h-8"></i></div>
          </div>
          <div class="info-card">
            <p class="text-[12px] text-muted-foreground leading-tight">第2关</p>
            <p class="text-[15px] font-semibold text-card-foreground leading-tight mt-0.5">减法基础</p>
            <p class="text-[12px] text-muted-foreground mt-1">最佳成绩 <span class="font-medium" style="color: #4CAF50;">90%</span></p>
          </div>
        </div>

        <!-- connector 2→3 left→right -->
        <svg class="connector" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 13 0 C 13 20, 87 20, 87 40" fill="none" stroke="#D5D8DC" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>

        <!-- Level 3 · right · done 2★ -->
        <div class="level-row" data-side="right">
          <div class="info-card">
            <p class="text-[12px] text-muted-foreground leading-tight">第3关</p>
            <p class="text-[15px] font-semibold text-card-foreground leading-tight mt-0.5">乘法口诀</p>
            <p class="text-[12px] text-muted-foreground mt-1">最佳成绩 <span class="font-medium" style="color: #4CAF50;">85%</span></p>
          </div>
          <div class="node-wrap">
            <div class="node-top"><span class="text-[12px] leading-none">⭐⭐<span style="opacity: 0.35;">☆</span></span></div>
            <div class="node-circle node-done"><i data-lucide="check" class="w-8 h-8"></i></div>
          </div>
        </div>

        <!-- connector 3→4 right→left -->
        <svg class="connector" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 87 0 C 87 20, 13 20, 13 40" fill="none" stroke="#D5D8DC" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>

        <!-- Level 4 · left · done 3★ -->
        <div class="level-row" data-side="left">
          <div class="node-wrap">
            <div class="node-top"><span class="text-[12px] leading-none">⭐⭐⭐</span></div>
            <div class="node-circle node-done"><i data-lucide="check" class="w-8 h-8"></i></div>
          </div>
          <div class="info-card">
            <p class="text-[12px] text-muted-foreground leading-tight">第4关</p>
            <p class="text-[15px] font-semibold text-card-foreground leading-tight mt-0.5">除法入门</p>
            <p class="text-[12px] text-muted-foreground mt-1">最佳成绩 <span class="font-medium" style="color: #4CAF50;">92%</span></p>
          </div>
        </div>

        <!-- connector 4→5 left→right -->
        <svg class="connector" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 13 0 C 13 20, 87 20, 87 40" fill="none" stroke="#D5D8DC" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>

        <!-- Level 5 · right · done 2★ -->
        <div class="level-row" data-side="right">
          <div class="info-card">
            <p class="text-[12px] text-muted-foreground leading-tight">第5关</p>
            <p class="text-[15px] font-semibold text-card-foreground leading-tight mt-0.5">混合运算</p>
            <p class="text-[12px] text-muted-foreground mt-1">最佳成绩 <span class="font-medium" style="color: #4CAF50;">80%</span></p>
          </div>
          <div class="node-wrap">
            <div class="node-top"><span class="text-[12px] leading-none">⭐⭐<span style="opacity: 0.35;">☆</span></span></div>
            <div class="node-circle node-done"><i data-lucide="check" class="w-8 h-8"></i></div>

        </svg>

        <!-- Level 6 · left · current -->
        <div class="level-row" data-side="left">
          <div class="node-wrap">
            <div class="node-top"><span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(255,138,61,0.15); color: #FF8A3D;">进行中</span></div>
            <div class="node-circle node-current"><span class="text-[24px] font-bold leading-none">6</span></div>
          </div>
          <div class="info-card">
            <p class="text-[12px] text-muted-foreground leading-tight">第6关</p>
            <p class="text-[15px] font-semibold leading-tight mt-0.5" style="color: #FF8A3D;">乘法进阶</p>

    <style id="game-map-styles">
.level-row { display: flex; align-items: center; gap: 14px; padding: 6px 16px; }
.level-row[data-side="right"] { flex-direction: row-reverse; }
.node-wrap { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
.node-top { min-height: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.node-circle { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
.node-done { background-color: #4CAF50; color: #FFFFFF; box-shadow: 0 6px 14px rgba(76,175,80,0.32); }
.node-current { background-color: #FF8A3D; color: #FFFFFF; animation: gm-pulse 1.8s infinite; }
.node-locked { background-color: #E0E4E8; color: #9AA0A6; }
.info-card { flex: 1 1 0%; min-width: 0; }
.level-row[data-side="right"] .info-card { text-align: right; }
.connector { width: 100%; height: 40px; display: block; }
@keyframes gm-pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,138,61,0.5), 0 6px 14px rgba(255,138,61,0.35); }
  70% { box-shadow: 0 0 0 14px rgba(255,138,61,0), 0 6px 14px rgba(255,138,61,0.35); }
  100% { box-shadow: 0 0 0 0 rgba(255,138,61,0), 0 6px 14px rgba(255,138,61,0.35); }
}
    </style>

</style>
    <style id="critical-layout">

</style>
