<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题练习</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation: close + title + countdown -->
      <header class="px-4 py-3 flex items-center justify-between">
        <button class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: #F0F2F5;" aria-label="关闭">
          <i data-lucide="x" class="w-5 h-5" style="color: #636E72;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">错题练习</h1>
        <div class="flex items-center gap-1 h-9 px-3 rounded-full" style="background-color: rgba(255,138,61,0.10);">
          <span class="text-[14px] leading-none">⏱️</span>
          <span class="text-[13px] font-medium leading-none" style="color: #FF8A3D;">不限时</span>
        </div>
      </header>

      <!-- 3. Progress area -->
      <section class="px-4 pt-2 pb-3">
        <p class="text-[14px] text-muted-foreground text-center mb-2">第 <span class="font-semibold" style="color: #FF8A3D;">2</span>/5 题</p>
        <div class="w-full rounded-full overflow-hidden" style="height: 8px; background-color: #FFF0E5;">
          <div class="h-full rounded-full" style="width: 40%; background-color: #FF8A3D;"></div>
        </div>
      </section>

      <!-- 4. Original wrong question review card -->
      <section class="px-4 mt-2">
        <div class="rounded-[12px] p-4" style="background-color: #FFEBEE;">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full" style="background-color: #FF3B30; color: #FFFFFF;">📌 原错题</span>
          </div>
          <div class="flex items-center flex-wrap gap-2 mb-2">
            <span class="text-[20px] font-bold text-foreground">56 - 19 = ?</span>
          </div>
          <div class="flex items-center flex-wrap gap-x-3 gap-y-1 text-[15px]">
            <span class="text-muted-foreground">你的答案：</span>
            <span class="font-semibold" style="color: #FF3B30;">27</span>
            <span class="text-muted-foreground">→</span>
            <span class="text-muted-foreground">正确答案：</span>
            <span class="font-bold" style="color: #FF8A3D;">37</span>
          </div>
          <p class="text-[13px] text-muted-foreground mt-2.5 leading-snug">错因：退位减法遗漏退位</p>
        </div>
      </section>

      <!-- 5. Question display area -->
      <section class="px-4 mt-4">
        <div class="flex items-center justify-center gap-2 mb-3">
          <span class="text-[12px] font-medium px-3 py-1 rounded-full" style="background-color: rgba(77,171,247,0.14); color: #2B8FD6;">🎯 相似题</span>
        </div>
        <div class="flex items-center justify-center py-3">
          <h2 class="text-[48px] font-bold tracking-tight text-center" style="color: #2D3436;">63 - 28 = ?</h2>
        </div>
        <p class="text-[14px] text-muted-foreground text-center mt-1">💡 注意退位</p>
      </section>

      <!-- 6. Answer input area -->
      <section class="px-4 mt-5">
        <div class="rounded-[16px] flex items-center justify-center" style="height: 64px; border: 2px solid #FF8A3D; background-color: #FFFFFF;">
          <input id="answer-input" type="text" inputmode="numeric" placeholder="输入答案" class="w-full h-full bg-transparent text-center font-bold outline-none px-4" style="font-size: 32px; color: #2D3436;" />
        </div>
      </section>

      <!-- 7. Number keyboard (3x4 grid) -->
      <section class="px-4 mt-4 mb-4">
        <div class="grid grid-cols-3 gap-2.5">
          <button class="key-btn" data-key="1">1</button>
          <button class="key-btn" data-key="2">2</button>
          <button class="key-btn" data-key="3">3</button>
          <button class="key-btn" data-key="4">4</button>
          <button class="key-btn" data-key="5">5</button>
          <button class="key-btn" data-key="6">6</button>
          <button class="key-btn" data-key="7">7</button>
          <button class="key-btn" data-key="8">8</button>
          <button class="key-btn" data-key="9">9</button>
          <button class="key-btn" data-key="del" aria-label="删除">
            <i data-lucide="delete" class="w-6 h-6" style="color: #636E72;"></i>
          </button>
          <button class="key-btn" data-key="0">0</button>
          <button class="key-btn key-submit" data-key="submit">提交</button>
        </div>
      </section>

      <!-- 8. Bottom safe area -->
      <div style="height: env(safe-area-inset-bottom, 0px);"></div>
    </main>

    <script>
      lucide.createIcons();
      (function () {
        var input = document.getElementById('answer-input');
        var keyboard = document.querySelector('section .grid.grid-cols-3');
        function syncInput(v) { input.value = v; }
        keyboard.addEventListener('click', function (e) {
          var btn = e.target.closest('[data-key]');
          if (!btn) return;
          var key = btn.getAttribute('data-key');
          if (key === 'del') {
            input.value = input.value.slice(0, -1);
          } else if (key === 'submit') {
            // submit action placeholder
            input.blur();
          } else if (/^[0-9]$/.test(key)) {
            input.value += key;
          }
          input.focus();
        });
      })();
    </script>

    <style id="style-override">
:root {
  --brand-background: #FFFFFF;

  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F8F9FB;
  --brand-muted-foreground: #636E72;
  --brand-border: #F0F2F5;
  --brand-input: #E0E4E8;

}

  height: 56px;
  border-radius: 16px;
  background-color: #F8F9FB;
  color: #2D3436;
  font-size: 22px;

  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.15s ease, transform 0.1s ease;
  -webkit-tap-highlight-color: transparent;
}
.key-btn:active {
  background-color: #FFE9D6;
  transform: scale(0.97);
}
.key-submit {
  background-color: #FF8A3D;
  color: #FFFFFF;
  font-size: 18px;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(255,138,61,0.30);
}
.key-submit:active {
  background-color: #F2781F;
}
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }

</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

</style>
</body>
</html>
