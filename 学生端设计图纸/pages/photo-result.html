<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拍照批改-批改结果</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation bar -->
      <header class="px-4 h-[52px] flex items-center justify-between">
        <button class="w-10 h-10 rounded-full flex items-center justify-center -ml-2" aria-label="返回">
          <i data-lucide="arrow-left" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">批改结果</h1>
        <button class="w-10 h-10 rounded-full flex items-center justify-center -mr-2" aria-label="分享">
          <i data-lucide="share-2" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
      </header>

      <!-- 3. Grading summary card -->
      <section class="px-4 mt-3 mb-5">
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-4">
            <!-- Big emoji circle -->
            <div class="w-16 h-16 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.15);">
              <span class="text-[34px] leading-none">📊</span>
            </div>
            <!-- Right content -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center flex-wrap gap-x-3 gap-y-1 text-[13px] text-muted-foreground">
                <span>共 <span class="font-semibold text-foreground">10</span> 题</span>
                <span>✅ 正确 <span class="font-semibold" style="color:#4CAF50;">8</span> 题</span>
                <span>❌ 错误 <span class="font-semibold" style="color:#FF3B30;">2</span> 题</span>
              </div>
              <div class="flex items-baseline gap-1.5 mt-1.5">
                <span class="text-[30px] font-bold leading-none" style="color: #FF8A3D;">80%</span>
                <span class="text-[13px] text-muted-foreground">正确率</span>
              </div>
            </div>
          </div>
          <!-- Progress bar -->
          <div class="w-full rounded-full overflow-hidden mt-4" style="height: 10px; background-color: #FFF0E5;">
            <div class="h-full rounded-full" style="width: 80%; background-color: #FF8A3D;"></div>
          </div>
        </div>
      </section>

      <!-- 4. Question list -->
      <section class="px-4 mb-6">
        <h2 class="text-[17px] font-semibold text-foreground mb-3 flex items-center gap-1.5">题目详情 <span>📝</span></h2>

        <div class="space-y-3">
          <!-- Question 1: correct -->
          <div class="bg-card rounded-[16px] p-4 shadow-sm flex items-start gap-3" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-white font-bold text-[15px]" style="background-color: #FF8A3D;">1</div>
            <div class="flex-1 min-w-0">
              <p class="text-[16px] font-medium text-card-foreground leading-relaxed">23 + 45 = ?</p>
              <p class="text-[13px] text-muted-foreground mt-1">答案：<span class="font-semibold" style="color: #4CAF50;">68</span></p>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">✅ 正确</span>
          </div>

          <!-- Question 2: correct -->
          <div class="bg-card rounded-[16px] p-4 shadow-sm flex items-start gap-3" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-white font-bold text-[15px]" style="background-color: #FF8A3D;">2</div>
            <div class="flex-1 min-w-0">
              <p class="text-[16px] font-medium text-card-foreground leading-relaxed">7 × 8 = ?</p>
              <p class="text-[13px] text-muted-foreground mt-1">答案：<span class="font-semibold" style="color: #4CAF50;">56</span></p>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">✅ 正确</span>
          </div>

          <!-- Question 3: wrong -->
          <div class="bg-card rounded-[16px] p-4 shadow-sm flex items-start gap-3" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-white font-bold text-[15px]" style="background-color: #FF8A3D;">3</div>
            <div class="flex-1 min-w-0">
              <p class="text-[16px] font-medium text-card-foreground leading-relaxed">56 - 19 = ?</p>
              <p class="text-[13px] mt-1" style="color: #FF3B30;">你的答案：27</p>
              <p class="text-[13px] text-muted-foreground mt-0.5">正确答案：<span class="font-semibold" style="color: #FF8A3D;">37</span></p>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(255,59,49,0.12); color: #FF3B30;">❌ 错误</span>
          </div>

          <!-- Question 4: correct -->
          <div class="bg-card rounded-[16px] p-4 shadow-sm flex items-start gap-3" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-white font-bold text-[15px]" style="background-color: #FF8A3D;">4</div>
            <div class="flex-1 min-w-0">
              <p class="text-[16px] font-medium text-card-foreground leading-relaxed">36 ÷ 6 = ?</p>
              <p class="text-[13px] text-muted-foreground mt-1">答案：<span class="font-semibold" style="color: #4CAF50;">6</span></p>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">✅ 正确</span>
          </div>

          <!-- Question 5: wrong -->
          <div class="bg-card rounded-[16px] p-4 shadow-sm flex items-start gap-3" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-white font-bold text-[15px]" style="background-color: #FF8A3D;">5</div>
            <div class="flex-1 min-w-0">
              <p class="text-[16px] font-medium text-card-foreground leading-relaxed">4 × 9 = ?</p>
              <p class="text-[13px] mt-1" style="color: #FF3B30;">你的答案：32 <span class="text-muted-foreground">（涂改）</span></p>
              <p class="text-[13px] text-muted-foreground mt-0.5">正确答案：<span class="font-semibold" style="color: #FF8A3D;">36</span></p>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(255,59,49,0.12); color: #FF3B30;">❌ 错误</span>
          </div>
        </div>
      </section>
    </main>

    <!-- 5. Bottom action buttons -->
    <div class="w-full" style="background: #FFFFFF; border-top: 1px solid #F0F2F5;">
      <div class="max-w-md mx-auto w-full px-4 pt-3.5" style="padding-bottom: max(16px, env(safe-area-inset-bottom));">
        <div class="flex gap-3">
          <button class="flex-1 h-12 rounded-full text-white text-[16px] font-semibold flex items-center justify-center gap-1.5" style="background-color: #FF8A3D; box-shadow: 0 4px 14px rgba(255,138,61,0.3);">
            <i data-lucide="repeat" class="w-4 h-4"></i>
            错题练习
          </button>
          <button class="flex-1 h-12 rounded-full text-[16px] font-semibold flex items-center justify-center gap-1.5" style="background-color: #FFFFFF; color: #FF8A3D; border: 1.5px solid #FF8A3D;">
            <i data-lucide="camera" class="w-4 h-4"></i>
            再来一次
          </button>
        </div>
      </div>
    </div>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F8F9FB;
  --brand-muted-foreground: #636E72;
  --brand-border: #F0F2F5;
  --brand-input: #E0E4E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 10px;
  --brand-radius-md: 16px;
  --brand-radius-lg: 20px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #F0F2F5; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
