<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队闯关结算</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation -->
      <header class="px-4 h-12 flex items-center justify-between">
        <button class="w-10 h-10 -ml-2 flex items-center justify-center" aria-label="返回">
          <i data-lucide="chevron-left" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">团队结算</h1>
        <button class="w-10 h-10 -mr-2 flex items-center justify-center" aria-label="分享">
          <i data-lucide="share-2" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
      </header>

      <!-- 3. Celebration area -->
      <section class="px-4 pt-6 pb-14 text-center relative overflow-hidden" style="background: linear-gradient(180deg, #FFE8D5 0%, #FFF5EB 70%, #FFFFFF 100%);">
        <span class="absolute top-3 left-6 text-[20px] opacity-50">🎊</span>
        <span class="absolute top-7 right-8 text-[18px] opacity-50">✨</span>
        <span class="absolute bottom-12 left-10 text-[16px] opacity-40">🎈</span>
        <span class="absolute bottom-16 right-12 text-[16px] opacity-40">⭐</span>
        <div class="relative">
          <div class="text-[64px] leading-none mb-3">🎉🏆</div>
          <h2 class="text-[28px] font-bold mb-1.5" style="color: #FF8A3D;">团队通关！</h2>
          <p class="text-[15px] text-muted-foreground">数学先锋队 · 乘法口诀</p>
        </div>
      </section>

      <!-- 4. Team score card -->
      <section class="px-4 -mt-6 relative z-10">
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 18px rgba(45,52,54,0.08);">
          <div class="grid grid-cols-4 gap-1">
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] font-bold leading-none" style="color: #FF8A3D;">85%</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">总正确率</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] font-bold leading-none text-foreground">40</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">总题数</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] font-bold leading-none" style="color: #FF8A3D;">+150</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">团队积分</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] font-bold leading-none text-foreground">05:30</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">用时</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 5. Member contribution -->
      <section class="px-4 mt-6">
        <h2 class="text-[18px] font-semibold text-foreground mb-3">📊 成员贡献</h2>
        <div class="bg-card rounded-[20px] shadow-sm p-4" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <!-- Member 1: 小明 (MVP) -->
          <div class="flex items-start gap-3 py-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FFF0E5;">
              <span class="text-[20px] leading-none">🧒</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-2">
                <span class="text-[15px] font-medium text-card-foreground">小明 <span class="text-[12px] text-muted-foreground">队长</span></span>
                <div class="flex items-center gap-2">
                  <span class="text-[12px] text-muted-foreground">正确 12/15</span>
                  <span class="text-[11px] font-medium px-2 py-0.5 rounded-full whitespace-nowrap" style="background-color: rgba(255,107,157,0.15); color: #FF6B9D;">⭐ MVP</span>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex-1 rounded-full overflow-hidden" style="height: 6px; background-color: #FFF0E5;">
                  <div class="h-full rounded-full" style="width: 80%; background-color: #FF8A3D;"></div>
                </div>
                <span class="text-[12px] font-semibold" style="color: #FF8A3D;">80%</span>
              </div>
            </div>
          </div>
          <div class="h-px bg-border ml-12"></div>
          <!-- Member 2: 李华 -->
          <div class="flex items-start gap-3 py-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FFF0E5;">
              <span class="text-[20px] leading-none">👦</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-2">
                <span class="text-[15px] font-medium text-card-foreground">李华</span>
                <span class="text-[12px] text-muted-foreground">正确 10/15</span>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex-1 rounded-full overflow-hidden" style="height: 6px; background-color: #FFF0E5;">
                  <div class="h-full rounded-full" style="width: 67%; background-color: #FF8A3D;"></div>
                </div>
                <span class="text-[12px] font-semibold" style="color: #FF8A3D;">67%</span>
              </div>
            </div>
          </div>
          <div class="h-px bg-border ml-12"></div>
          <!-- Member 3: 王小红 -->
          <div class="flex items-start gap-3 py-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FFF0E5;">
              <span class="text-[20px] leading-none">🧑</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-2">
                <span class="text-[15px] font-medium text-card-foreground">王小红</span>
                <span class="text-[12px] text-muted-foreground">正确 12/15</span>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex-1 rounded-full overflow-hidden" style="height: 6px; background-color: #FFF0E5;">
                  <div class="h-full rounded-full" style="width: 80%; background-color: #FF8A3D;"></div>
                </div>
                <span class="text-[12px] font-semibold" style="color: #FF8A3D;">80%</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 6. Personal record -->
      <section class="px-4 mt-6">
        <h2 class="text-[18px] font-semibold text-foreground mb-3">📈 我的战绩</h2>
        <div class="bg-card rounded-[20px] shadow-sm p-5" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-4 gap-2">
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] leading-none mb-1.5">✅</span>
              <span class="text-[20px] font-bold text-foreground leading-none">12</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">正确题</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] leading-none mb-1.5">📊</span>
              <span class="text-[20px] font-bold text-foreground leading-none">80%</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">正确率</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] leading-none mb-1.5">🔥</span>
              <span class="text-[20px] font-bold text-foreground leading-none">5</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">连击</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] leading-none mb-1.5">⭐</span>
              <span class="text-[20px] font-bold leading-none" style="color: #FF8A3D;">+50</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">积分</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 7. Team rewards -->
      <section class="px-4 mt-6">
        <h2 class="text-[18px] font-semibold text-foreground mb-3">🎁 团队奖励</h2>
        <div class="bg-card rounded-[20px] shadow-sm p-4" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-3 py-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.15);">
              <span class="text-[22px] leading-none">⭐</span>
            </div>
            <div class="flex-1">
              <p class="text-[15px] font-medium text-card-foreground">积分 +50</p>
              <p class="text-[12px] text-muted-foreground mt-0.5">团队通关奖励</p>
            </div>
          </div>
          <div class="h-px bg-border ml-[52px]"></div>
          <div class="flex items-center gap-3 py-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,107,157,0.15);">
              <span class="text-[22px] leading-none">🏅</span>
            </div>
            <div class="flex-1">
              <p class="text-[15px] font-medium text-card-foreground">获得徽章"团队之星"</p>
              <p class="text-[12px] text-muted-foreground mt-0.5">集齐3枚徽章可升级段位</p>
            </div>
          </div>
          <div class="h-px bg-border ml-[52px]"></div>
          <div class="flex items-center gap-3 py-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(76,175,80,0.15);">
              <span class="text-[22px] leading-none">🔓</span>
            </div>
            <div class="flex-1">
              <p class="text-[15px] font-medium text-card-foreground">解锁新关卡"团队挑战II"</p>
              <p class="text-[12px] text-muted-foreground mt-0.5">难度升级，奖励更丰厚</p>
            </div>
          </div>
        </div>
      </section>

      <!-- 8. Bottom buttons -->
      <div class="px-4 mt-8 mb-4">
        <div class="flex gap-3">
          <button class="flex-1 h-12 rounded-full text-[16px] font-semibold text-white flex items-center justify-center" style="background-color: #FF8A3D; box-shadow: 0 4px 12px rgba(255,138,61,0.35);">再来一局</button>
          <button class="flex-1 h-12 rounded-full text-[16px] font-semibold flex items-center justify-center border-2" style="border-color: #FF8A3D; color: #FF8A3D; background-color: #FFFFFF;">返回地图</button>
        </div>
      </div>

      <!-- 9. Bottom safe area -->
      <div style="height: env(safe-area-inset-bottom, 0px);"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">

  --brand-background: #FFFFFF;

  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;

  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F8F9FB;
  --brand-muted-foreground: #636E72;

  --brand-input: #E0E4E8;

body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }

</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #F0F2F5; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
