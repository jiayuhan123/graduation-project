<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错题本</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }

      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }

      .ring-input { --tw-ring-color: var(--brand-input); }

      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;

        background-color: currentColor;
      }

</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation bar -->
      <header class="px-4 h-[48px] flex items-center justify-between">
        <button class="w-9 h-9 flex items-center justify-center -ml-1.5 shrink-0" aria-label="返回">
          <i data-lucide="chevron-left" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">错题本</h1>
        <button class="text-[12px] text-muted-foreground shrink-0" aria-label="清空">清空</button>
      </header>

      <!-- 3. Statistics overview card -->
      <section class="px-4 mt-3 mb-5">
        <div class="bg-card rounded-[20px] p-5 shadow-sm" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <h2 class="text-[16px] font-bold text-card-foreground mb-4 flex items-center gap-1.5">📊 错题统计</h2>
          <div class="flex items-center justify-between mb-4">
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] leading-none">📚</span>
              <span class="text-[20px] font-bold text-foreground mt-1.5 leading-none">42</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">总错题</span>
            </div>
            <div class="w-px h-10 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] leading-none">✅</span>
              <span class="text-[20px] font-bold mt-1.5 leading-none" style="color: #4CAF50;">15</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">已掌握</span>
            </div>
            <div class="w-px h-10 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] leading-none">⏰</span>
              <span class="text-[20px] font-bold mt-1.5 leading-none" style="color: #FF8A3D;">27</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">待复习</span>
            </div>
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-[12px] text-muted-foreground">已掌握 35%</span>
            <span class="text-[12px] font-medium text-muted-foreground">15/42</span>
          </div>
          <div class="w-full rounded-full overflow-hidden" style="height: 10px; background-color: #FFF0E5;">
            <div class="h-full rounded-full" style="width: 35%; background-color: #FF8A3D;"></div>
          </div>
        </div>
      </section>

      <!-- 4. Filter tags (horizontal scroll) -->
      <section class="mb-4">
        <div class="flex gap-2 overflow-x-auto no-scrollbar px-4">
          <button class="text-[13px] font-medium px-4 py-2 rounded-full whitespace-nowrap shrink-0" style="background-color: #FF8A3D; color: #FFFFFF;">全部</button>
          <button class="text-[13px] font-medium px-4 py-2 rounded-full whitespace-nowrap shrink-0" style="background-color: #F8F9FB; color: #636E72;">加法</button>
          <button class="text-[13px] font-medium px-4 py-2 rounded-full whitespace-nowrap shrink-0" style="background-color: #F8F9FB; color: #636E72;">减法</button>
          <button class="text-[13px] font-medium px-4 py-2 rounded-full whitespace-nowrap shrink-0" style="background-color: #F8F9FB; color: #636E72;">乘法</button>
          <button class="text-[13px] font-medium px-4 py-2 rounded-full whitespace-nowrap shrink-0" style="background-color: #F8F9FB; color: #636E72;">除法</button>
          <button class="text-[13px] font-medium px-4 py-2 rounded-full whitespace-nowrap shrink-0" style="background-color: #F8F9FB; color: #636E72;">混合运算</button>
        </div>
      </section>

      <!-- 5. Wrong question list -->
      <section class="px-4 space-y-3 mb-6">
        <!-- Card 1 -->
        <div class="bg-card rounded-[20px] shadow-sm overflow-hidden" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06); border-left: 4px solid #FF3B30;">
          <div class="p-4">
            <!-- Row 1: question number + question + error tag -->
            <div class="flex items-center gap-2.5 mb-3">
              <span class="w-7 h-7 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D; color: #FFFFFF; font-size: 13px; font-weight: 700;">1</span>
              <span class="text-[16px] font-bold text-foreground flex-1">56 - 19 = ?</span>
              <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(255,59,48,0.12); color: #FF3B30;">错误3次</span>
            </div>
            <!-- Row 2: answers -->
            <div class="flex items-center gap-2 mb-3 px-1">
              <span class="text-[13px] text-muted-foreground">你的答案</span>
              <span class="text-[16px] font-bold" style="color: #FF3B30;">27</span>
              <span class="text-[14px] text-muted-foreground mx-1">→</span>
              <span class="text-[13px] text-muted-foreground">正确答案</span>
              <span class="text-[16px] font-bold" style="color: #FF8A3D;">37</span>
            </div>
            <!-- Row 3: knowledge point + date -->
            <div class="flex items-center gap-3 mb-3">
              <span class="text-[12px] text-muted-foreground flex items-center gap-1">
                <span>🏷️</span> 减法
              </span>
              <span class="text-[12px] text-muted-foreground flex items-center gap-1">
                <span>🕒</span> 9月4日
              </span>
            </div>
            <!-- Row 4: action buttons -->
            <div class="flex items-center gap-2.5">
              <button class="flex-1 text-[13px] font-semibold py-2 rounded-full" style="background-color: #FF8A3D; color: #FFFFFF;">再去练习</button>
              <button class="flex-1 text-[13px] font-semibold py-2 rounded-full" style="background-color: #FFFFFF; color: #4CAF50; border: 1.5px solid #4CAF50;">已掌握</button>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="bg-card rounded-[20px] shadow-sm overflow-hidden" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06); border-left: 4px solid #FF3B30;">
          <div class="p-4">
            <div class="flex items-center gap-2.5 mb-3">
              <span class="w-7 h-7 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D; color: #FFFFFF; font-size: 13px; font-weight: 700;">2</span>
              <span class="text-[16px] font-bold text-foreground flex-1">7 × 8 = ?</span>
              <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(255,59,48,0.12); color: #FF3B30;">错误2次</span>
            </div>
            <div class="flex items-center gap-2 mb-3 px-1">
              <span class="text-[13px] text-muted-foreground">你的答案</span>
              <span class="text-[16px] font-bold" style="color: #FF3B30;">54</span>
              <span class="text-[14px] text-muted-foreground mx-1">→</span>
              <span class="text-[13px] text-muted-foreground">正确答案</span>
              <span class="text-[16px] font-bold" style="color: #FF8A3D;">56</span>
            </div>
            <div class="flex items-center gap-3 mb-3">
              <span class="text-[12px] text-muted-foreground flex items-center gap-1">
                <span>🏷️</span> 乘法
              </span>
              <span class="text-[12px] text-muted-foreground flex items-center gap-1">
                <span>🕒</span> 9月3日
              </span>
            </div>
            <div class="flex items-center gap-2.5">
              <button class="flex-1 text-[13px] font-semibold py-2 rounded-full" style="background-color: #FF8A3D; color: #FFFFFF;">再去练习</button>
              <button class="flex-1 text-[13px] font-semibold py-2 rounded-full" style="background-color: #FFFFFF; color: #4CAF50; border: 1.5px solid #4CAF50;">已掌握</button>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="bg-card rounded-[20px] shadow-sm overflow-hidden" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06); border-left: 4px solid #FF3B30;">
          <div class="p-4">
            <div class="flex items-center gap-2.5 mb-3">
              <span class="w-7 h-7 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D; color: #FFFFFF; font-size: 13px; font-weight: 700;">3</span>
              <span class="text-[16px] font-bold text-foreground flex-1">36 ÷ 6 = ?</span>
              <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(255,59,48,0.12); color: #FF3B30;">错误1次</span>
            </div>
            <div class="flex items-center gap-2 mb-3 px-1">
              <span class="text-[13px] text-muted-foreground">你的答案</span>
              <span class="text-[16px] font-bold" style="color: #FF3B30;">7</span>
              <span class="text-[14px] text-muted-foreground mx-1">→</span>
              <span class="text-[13px] text-muted-foreground">正确答案</span>
              <span class="text-[16px] font-bold" style="color: #FF8A3D;">6</span>
            </div>
            <div class="flex items-center gap-3 mb-3">
              <span class="text-[12px] text-muted-foreground flex items-center gap-1">
                <span>🏷️</span> 除法
              </span>
              <span class="text-[12px] text-muted-foreground flex items-center gap-1">
                <span>🕒</span> 9月2日
              </span>
            </div>
            <div class="flex items-center gap-2.5">
              <button class="flex-1 text-[13px] font-semibold py-2 rounded-full" style="background-color: #FF8A3D; color: #FFFFFF;">再去练习</button>
              <button class="flex-1 text-[13px] font-semibold py-2 rounded-full" style="background-color: #FFFFFF; color: #4CAF50; border: 1.5px solid #4CAF50;">已掌握</button>
            </div>
          </div>
        </div>

        <!-- Card 4 -->
        <div class="bg-card rounded-[20px] shadow-sm overflow-hidden" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06); border-left: 4px solid #FF3B30;">
          <div class="p-4">
            <div class="flex items-center gap-2.5 mb-3">
              <span class="w-7 h-7 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D; color: #FFFFFF; font-size: 13px; font-weight: 700;">4</span>
              <span class="text-[16px] font-bold text-foreground flex-1">23 + 48 = ?</span>
              <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background-color: rgba(255,59,48,0.12); color: #FF3B30;">错误2次</span>
            </div>
            <div class="flex items-center gap-2 mb-3 px-1">
              <span class="text-[13px] text-muted-foreground">你的答案</span>
              <span class="text-[16px] font-bold" style="color: #FF3B30;">61</span>
              <span class="text-[14px] text-muted-foreground mx-1">→</span>
              <span class="text-[13px] text-muted-foreground">正确答案</span>
              <span class="text-[16px] font-bold" style="color: #FF8A3D;">71</span>
            </div>
            <div class="flex items-center gap-3 mb-3">
              <span class="text-[12px] text-muted-foreground flex items-center gap-1">
                <span>🏷️</span> 加法
              </span>
              <span class="text-[12px] text-muted-foreground flex items-center gap-1">
                <span>🕒</span> 9月1日
              </span>
            </div>
            <div class="flex items-center gap-2.5">
              <button class="flex-1 text-[13px] font-semibold py-2 rounded-full" style="background-color: #FF8A3D; color: #FFFFFF;">再去练习</button>
              <button class="flex-1 text-[13px] font-semibold py-2 rounded-full" style="background-color: #FFFFFF; color: #4CAF50; border: 1.5px solid #4CAF50;">已掌握</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 6. Bottom action button -->
      <section class="px-4 mb-6 flex justify-center">
        <button class="w-[80%] text-[15px] font-bold py-3.5 rounded-full flex items-center justify-center gap-2" style="background-color: #FF8A3D; color: #FFFFFF; box-shadow: 0 6px 16px rgba(255,138,61,0.35);">
          <span class="text-[17px] leading-none">🔄</span>
          全部错题重练
        </button>
      </section>

      <!-- 7. Bottom safe area -->
      <div style="height: 20px;"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">

  --brand-background: #FFFFFF;
