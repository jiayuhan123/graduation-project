server:
  port: 10000

spring:
  application:
    name: gateway
  config:
    import: "optional:nacos:${spring.application.name}.yaml"  # 从 Nacos 配置中心导入配置（optional 表示即使 Nacos 中不存在也不报错）
  cloud:
    nacos:
      server-addr: 122.51.234.113:8848  # Nacos 服务器地址（discovery 和 config 共享）
      discovery:
        server-addr: 122.51.234.113:8848
      config:
        server-addr: 122.51.234.113:8848
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: true # 开启从注册中心动态创建路由的功能
