<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练任务发布</title>
    <style id="theme-vars">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation -->
      <header class="h-11 px-4 flex items-center justify-between">
        <button class="w-8 h-8 flex items-center justify-center -ml-1" aria-label="返回">
          <i data-lucide="arrow-left" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[16px] font-semibold text-foreground">训练任务</h1>
        <button class="text-[14px] font-medium" style="color: #FF8A3D;">草稿</button>
      </header>

      <!-- 3. Task source hint card -->
      <section class="px-4 mt-3">
        <div class="bg-white rounded-xl p-4" style="border-left: 4px solid rgba(255,138,61,0.35); box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-1.5">
            <i data-lucide="sparkles" class="w-4 h-4" style="color: #FF8A3D;"></i>
            <span class="text-[14px] font-medium" style="color: #FF8A3D;">基于学情分析自动推荐</span>
          </div>
          <p class="text-[13px] mt-1.5 leading-relaxed" style="color: #636E72;">以下学生"表内除法"掌握度低于60%，建议安排针对性训练</p>
        </div>
      </section>

      <!-- 4. Select students -->
      <section class="px-4 mt-5">
        <h2 class="text-[16px] font-bold text-foreground mb-3">选择学生</h2>
        <div class="bg-white rounded-xl overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">

          <!-- 赵强 50% — selected -->
          <div class="flex items-center gap-3 px-4 py-3.5" style="box-shadow: inset 4px 0 0 0 #FF5C35;">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-[14px] font-semibold" style="background-color: rgba(255,92,53,0.12); color: #FF5C35;">赵</div>
            <div class="flex-1 min-w-0">
              <span class="text-[15px] font-medium text-foreground">赵强</span>
            </div>
            <div class="flex items-baseline gap-1 mr-1">
              <span class="text-[12px]" style="color: #636E72;">掌握度</span>
              <span class="text-[14px] font-semibold" style="color: #FF3B30;">50%</span>
            </div>
            <div class="w-5 h-5 rounded-md flex items-center justify-center shrink-0" style="background-color: #FF8A3D;">
              <i data-lucide="check" class="w-3.5 h-3.5" style="color: #FFFFFF;"></i>
            </div>
          </div>
          <div class="h-px bg-border mx-4"></div>

          <!-- 李华 58% — selected -->
          <div class="flex items-center gap-3 px-4 py-3.5" style="box-shadow: inset 4px 0 0 0 #FF5C35;">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-[14px] font-semibold" style="background-color: rgba(255,138,61,0.12); color: #FF8A3D;">李</div>
            <div class="flex-1 min-w-0">
              <span class="text-[15px] font-medium text-foreground">李华</span>
            </div>
            <div class="flex items-baseline gap-1 mr-1">
              <span class="text-[12px]" style="color: #636E72;">掌握度</span>
              <span class="text-[14px] font-semibold" style="color: #FF3B30;">58%</span>
            </div>
            <div class="w-5 h-5 rounded-md flex items-center justify-center shrink-0" style="background-color: #FF8A3D;">
              <i data-lucide="check" class="w-3.5 h-3.5" style="color: #FFFFFF;"></i>
            </div>
          </div>
          <div class="h-px bg-border mx-4"></div>

          <!-- 刘洋 60% — unselected -->
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-[14px] font-semibold" style="background-color: rgba(77,171,247,0.12); color: #4DABF7;">刘</div>
            <div class="flex-1 min-w-0">
              <span class="text-[15px] font-medium text-foreground">刘洋</span>
            </div>
            <div class="flex items-baseline gap-1 mr-1">
              <span class="text-[12px]" style="color: #636E72;">掌握度</span>
              <span class="text-[14px] font-semibold" style="color: #636E72;">60%</span>
            </div>
            <div class="w-5 h-5 rounded-md shrink-0" style="border: 1.5px solid #DFE3E8;"></div>
          </div>
          <div class="h-px bg-border mx-4"></div>

          <!-- 陈静 65% — unselected -->
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-[14px] font-semibold" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">陈</div>
            <div class="flex-1 min-w-0">
              <span class="text-[15px] font-medium text-foreground">陈静</span>
            </div>
            <div class="flex items-baseline gap-1 mr-1">
              <span class="text-[12px]" style="color: #636E72;">掌握度</span>
              <span class="text-[14px] font-semibold" style="color: #636E72;">65%</span>
            </div>
            <div class="w-5 h-5 rounded-md shrink-0" style="border: 1.5px solid #DFE3E8;"></div>
          </div>
          <div class="h-px bg-border mx-4"></div>

          <!-- 周明 72% — unselected -->
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-[14px] font-semibold" style="background-color: rgba(151,117,250,0.12); color: #9775FA;">周</div>
            <div class="flex-1 min-w-0">
              <span class="text-[15px] font-medium text-foreground">周明</span>
            </div>
            <div class="flex items-baseline gap-1 mr-1">
              <span class="text-[12px]" style="color: #636E72;">掌握度</span>
              <span class="text-[14px] font-semibold" style="color: #636E72;">72%</span>
            </div>
            <div class="w-5 h-5 rounded-md shrink-0" style="border: 1.5px solid #DFE3E8;"></div>
          </div>

        </div>
        <p class="text-[13px] mt-2.5 px-1" style="color: #636E72;">已选 <span class="font-semibold" style="color: #FF8A3D;">2</span> 人</p>
      </section>

      <!-- 5. Training content -->
      <section class="px-4 mt-5">
        <h2 class="text-[16px] font-bold text-foreground mb-3">训练内容</h2>
        <div class="bg-white rounded-xl overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">

          <!-- Knowledge point -->
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.10);">
              <i data-lucide="book-open" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
            </div>
            <span class="text-[14px] text-foreground shrink-0">知识点</span>
            <span class="text-[14px] font-medium text-foreground ml-auto">表内除法</span>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
          </div>
          <div class="h-px bg-border mx-4"></div>

          <!-- Question type -->
          <div class="flex items-center gap-3 px-4 py-3.5">
            <span class="text-[14px] text-foreground shrink-0">题型</span>
            <div class="flex gap-2 ml-auto">
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #FF8A3D; color: #FFFFFF;">口算</span>
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">填空</span>
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">竖式</span>
            </div>
          </div>
          <div class="h-px bg-border mx-4"></div>

          <!-- Question count -->
          <div class="flex items-center gap-3 px-4 py-3.5">
            <span class="text-[14px] text-foreground shrink-0">题量</span>
            <div class="flex gap-2 ml-auto">
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">10题</span>
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #FF8A3D; color: #FFFFFF;">20题</span>
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">30题</span>
            </div>
          </div>
          <div class="h-px bg-border mx-4"></div>

          <!-- Difficulty -->
          <div class="flex items-center gap-3 px-4 py-3.5">
            <span class="text-[14px] text-foreground shrink-0">难度</span>
            <div class="flex gap-2 ml-auto">
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #FF8A3D; color: #FFFFFF;">简单</span>
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">中等</span>
              <span class="px-4 py-1.5 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">困难</span>
            </div>
          </div>

        </div>
      </section>

      <!-- 6. Deadline -->
      <section class="px-4 mt-5">
        <div class="bg-white rounded-xl overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.10);">
              <i data-lucide="calendar" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
            </div>
            <span class="text-[14px] text-foreground shrink-0">截止时间</span>
            <span class="text-[14px] font-medium text-foreground ml-auto">9月7日 周六 23:59</span>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
          </div>
        </div>
      </section>

      <!-- 7. Publish button -->
      <section class="px-4 mt-8 mb-4">
        <div class="flex justify-center">
          <button class="w-[80%] py-3.5 rounded-full text-[16px] font-semibold flex items-center justify-center gap-2" style="background-color: #FF8A3D; color: #FFFFFF; box-shadow: 0 4px 12px rgba(255,138,61,0.30);">
            <i data-lucide="send" class="w-4 h-4" style="color: #FFFFFF;"></i>
            发布训练任务
          </button>
        </div>
      </section>

      <!-- 8. Bottom safe area -->
      <div style="height: env(safe-area-inset-bottom, 20px);"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #F8F9FB;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F2F5;
  --brand-muted-foreground: #636E72;
  --brand-border: #ECEFF2;
  --brand-input: #DFE3E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 6px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECEFF2; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
