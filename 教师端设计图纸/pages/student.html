<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生详情</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation -->
      <header class="px-4 h-[52px] flex items-center justify-between">
        <button class="w-9 h-9 flex items-center justify-center -ml-1" aria-label="返回">
          <i data-lucide="arrow-left" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">学生详情</h1>
        <button class="w-9 h-9 flex items-center justify-center -mr-1" aria-label="更多">
          <i data-lucide="more-horizontal" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
      </header>

      <!-- 3. Student info card -->
      <section class="px-4 mt-2">
        <div class="bg-white rounded-[12px] p-4" style="box-shadow: 0 4px 14px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-3.5">
            <div class="w-14 h-14 rounded-full flex items-center justify-center shrink-0" style="background: linear-gradient(135deg, #FFB084 0%, #FF8A3D 100%); box-shadow: 0 4px 10px rgba(255,138,61,0.28);">
              <span class="text-[22px] font-bold text-white leading-none">明</span>
            </div>
            <div class="flex-1 min-w-0">
              <h2 class="text-[18px] font-bold text-foreground leading-tight">张明</h2>
              <p class="text-[13px] text-muted-foreground mt-1">三年级2班</p>
              <p class="text-[12px] text-muted-foreground mt-0.5">学号 2024010236</p>
            </div>
          </div>
          <div class="flex items-center mt-4 pt-3.5" style="border-top: 1px solid #F0F2F5;">
            <div class="flex-1 flex items-center justify-center gap-1.5">
              <i data-lucide="star" class="w-4 h-4 shrink-0" style="color: #FF8A3D;"></i>
              <span class="text-[13px] leading-none"><span class="font-bold text-foreground">680</span> <span class="text-muted-foreground">积分</span></span>
            </div>
            <div class="w-px h-4 shrink-0" style="background-color: #F0F2F5;"></div>
            <div class="flex-1 flex items-center justify-center gap-1.5">
              <i data-lucide="zap" class="w-4 h-4 shrink-0" style="color: #FF8A3D;"></i>
              <span class="text-[13px] leading-none"><span class="font-bold text-foreground">Lv.4</span> <span class="text-muted-foreground">等级</span></span>
            </div>
            <div class="w-px h-4 shrink-0" style="background-color: #F0F2F5;"></div>
            <div class="flex-1 flex items-center justify-center gap-1.5">
              <i data-lucide="flame" class="w-4 h-4 shrink-0" style="color: #FF8A3D;"></i>
              <span class="text-[13px] leading-none"><span class="font-bold text-foreground">7天</span> <span class="text-muted-foreground">连续</span></span>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. Learning data grid -->
      <section class="px-4 mt-3">
        <div class="bg-white rounded-[12px] p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-4 gap-2">
            <div class="flex flex-col items-center text-center">
              <div class="w-9 h-9 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="file-text" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">156</span>
              <span class="text-[11px] text-muted-foreground mt-1">总答题</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-9 h-9 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(76,175,80,0.12);">
                <i data-lucide="target" class="w-[18px] h-[18px]" style="color: #4CAF50;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">85%</span>
              <span class="text-[11px] text-muted-foreground mt-1">正确率</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-9 h-9 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(77,171,247,0.12);">
                <i data-lucide="clock" class="w-[18px] h-[18px]" style="color: #4DABF7;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">8.5h</span>
              <span class="text-[11px] text-muted-foreground mt-1">用时</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-9 h-9 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(151,117,250,0.12);">
                <i data-lucide="flag" class="w-[18px] h-[18px]" style="color: #9775FA;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">5</span>
              <span class="text-[11px] text-muted-foreground mt-1">通关数</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 5. Knowledge mastery -->
      <section class="px-4 mt-5">
        <h2 class="text-[16px] font-bold text-foreground mb-3">知识点掌握</h2>
        <div class="bg-white rounded-[12px] p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="mb-3.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[14px] text-foreground">加法</span>
              <span class="text-[13px] font-semibold text-foreground">88%</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 88%; background-color: #FF8A3D;"></div>
            </div>
          </div>
          <div class="mb-3.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[14px] text-foreground">减法</span>
              <span class="text-[13px] font-semibold text-foreground">75%</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 75%; background-color: #FF8A3D;"></div>
            </div>
          </div>
          <div class="mb-3.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[14px] text-foreground">乘法</span>
              <span class="text-[13px] font-semibold text-foreground">92%</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 92%; background-color: #FF8A3D;"></div>
            </div>
          </div>
          <div class="mb-3.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[14px] text-foreground">除法</span>
              <span class="text-[13px] font-semibold text-foreground">60%</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 60%; background-color: #FF8A3D;"></div>
            </div>
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[14px] text-foreground">混合运算</span>
              <span class="text-[13px] font-semibold text-foreground">55%</span>
            </div>
            <div class="w-full rounded-full overflow-hidden" style="height: 6px; background-color: #F0F2F5;">
              <div class="h-full rounded-full" style="width: 55%; background-color: #FF8A3D;"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 6. Recent homework -->
      <section class="px-4 mt-5">
        <h2 class="text-[16px] font-bold text-foreground mb-3">近期作业</h2>
        <div class="bg-white rounded-[12px] overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="flex-1 min-w-0">
              <p class="text-[15px] text-foreground leading-snug">加法练习 · 20题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5">9月4日</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[14px] font-semibold text-foreground">80%</span>
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">良好</span>
            </div>
          </div>
          <div class="h-px bg-border mx-4"></div>
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="flex-1 min-w-0">
              <p class="text-[15px] text-foreground leading-snug">乘法练习 · 20题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5">9月3日</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[14px] font-semibold text-foreground">90%</span>
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">优秀</span>
            </div>
          </div>
          <div class="h-px bg-border mx-4"></div>
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="flex-1 min-w-0">
              <p class="text-[15px] text-foreground leading-snug">减法练习 · 20题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5">9月2日</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[14px] font-semibold text-foreground">60%</span>
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(255,138,61,0.12); color: #FF8A3D;">需努力</span>
            </div>
          </div>
          <div class="h-px bg-border mx-4"></div>
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="flex-1 min-w-0">
              <p class="text-[15px] text-foreground leading-snug">作业本第12页 · 10题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5">9月1日</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[14px] font-semibold text-foreground">70%</span>
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(245,166,35,0.14); color: #E8920C;">一般</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 7. Teacher comment -->
      <section class="px-4 mt-5">
        <h2 class="text-[16px] font-bold text-foreground mb-3">教师评语</h2>
        <div class="bg-white rounded-[12px] p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <p class="text-[14px] leading-relaxed" style="color: #636E72;">张明同学在乘法方面表现优秀，但除法和混合运算还需加强。建议多练习表内除法。</p>
          <button class="mt-3.5 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full" style="background-color: #F0F2F5;">
            <i data-lucide="pencil" class="w-3.5 h-3.5" style="color: #636E72;"></i>
            <span class="text-[13px] font-medium" style="color: #636E72;">编辑评语</span>
          </button>
        </div>
      </section>

      <!-- 8. Bottom action button -->
      <section class="px-4 mt-6">
        <button class="w-full h-[50px] rounded-full flex items-center justify-center gap-1.5" style="background-color: #FF8A3D; box-shadow: 0 6px 16px rgba(255,138,61,0.32);">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
          <span class="text-[16px] font-semibold text-white">布置个性化练习</span>
        </button>
      </section>

      <!-- 9. Bottom safe area -->
      <div style="height: 24px;"></div>
      <div style="height: env(safe-area-inset-bottom);"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">

  --brand-background: #FFFFFF;

  --brand-card: #FFFFFF;

  --brand-popover-foreground: #2D3436;

</body>
</html>
