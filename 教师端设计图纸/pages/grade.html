<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业批改</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation -->
      <header class="px-4 h-[52px] flex items-center justify-between border-b border-border" style="background-color: #FFFFFF;">
        <button class="w-10 h-10 -ml-2 flex items-center justify-center shrink-0" aria-label="返回">
          <i data-lucide="chevron-left" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">作业批改</h1>
        <button class="w-10 h-10 -mr-2 flex items-center justify-center shrink-0" aria-label="筛选">
          <i data-lucide="filter" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
      </header>

      <!-- 3. Grading progress card -->
      <section class="px-4 pt-4 pb-3">
        <div class="bg-white rounded-[12px] p-4 shadow-sm" style="box-shadow: 0 2px 10px rgba(45,52,54,0.05);">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-[16px] font-bold text-foreground">今日批改进度</h2>
            <i data-lucide="clipboard-list" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
          </div>
          <div class="w-full rounded-full overflow-hidden" style="height: 8px; background-color: #FFF0E5;">
            <div class="h-full rounded-full" style="width: 66.7%; background-color: #FF8A3D;"></div>
          </div>
          <div class="flex items-center justify-between mt-2.5">
            <span class="text-[14px] font-medium text-foreground">已完成 <span style="color: #FF8A3D;">8</span>/12</span>
            <span class="text-[13px] text-muted-foreground">剩余4份</span>
          </div>
        </div>
      </section>

      <!-- 4. Tab filter bar -->
      <section class="mb-2">
        <div class="flex gap-2 px-4 overflow-x-auto no-scrollbar" style="scrollbar-width: none;">
          <button class="shrink-0 px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors" style="background-color: #FF8A3D; color: #FFFFFF;">全部</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors" style="background-color: #F8F9FB; color: #636E72;">待批改</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors" style="background-color: #F8F9FB; color: #636E72;">已批改</button>
          <button class="shrink-0 px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap transition-colors" style="background-color: #F8F9FB; color: #636E72;">需关注</button>
        </div>
      </section>

      <!-- 5. Homework list -->
      <section class="px-4 pb-6 flex flex-col gap-3">
        <!-- Card 1: 待批改, highlighted -->
        <div class="bg-white rounded-[12px] shadow-sm overflow-hidden" style="box-shadow: 0 2px 10px rgba(45,52,54,0.05); border-left: 4px solid #FF8A3D;">
          <div class="flex items-center gap-3 p-3.5">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D;">
              <span class="text-[14px] font-semibold" style="color: #FFFFFF;">明</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[15px] font-semibold text-foreground">张明</span>
                <span class="text-[12px] text-muted-foreground">三年级2班</span>
              </div>
              <p class="text-[13px] text-foreground mt-1 leading-snug truncate">加法练习 · 20题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>
                <span>14:30 提交</span>
              </p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(255,138,61,0.12); color: #FF8A3D;">待批改</span>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color: #B2BEC3;"></i>
            </div>
          </div>
        </div>

        <!-- Card 2: 待批改 -->
        <div class="bg-white rounded-[12px] shadow-sm overflow-hidden" style="box-shadow: 0 2px 10px rgba(45,52,54,0.05);">
          <div class="flex items-center gap-3 p-3.5">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D;">
              <span class="text-[14px] font-semibold" style="color: #FFFFFF;">华</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[15px] font-semibold text-foreground">李华</span>
                <span class="text-[12px] text-muted-foreground">四年级1班</span>
              </div>
              <p class="text-[13px] text-foreground mt-1 leading-snug truncate">乘法练习 · 20题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>
                <span>13:15 提交</span>
              </p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(255,138,61,0.12); color: #FF8A3D;">待批改</span>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color: #B2BEC3;"></i>
            </div>
          </div>
        </div>

        <!-- Card 3: 已批改 -->
        <div class="bg-white rounded-[12px] shadow-sm overflow-hidden" style="box-shadow: 0 2px 10px rgba(45,52,54,0.05);">
          <div class="flex items-center gap-3 p-3.5">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D;">
              <span class="text-[14px] font-semibold" style="color: #FFFFFF;">红</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[15px] font-semibold text-foreground">王小红</span>
                <span class="text-[12px] text-muted-foreground">三年级2班</span>
              </div>
              <p class="text-[13px] text-foreground mt-1 leading-snug truncate">作业本第13页 · 10题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>
                <span>11:20 提交</span>
              </p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">已批改 80%</span>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color: #B2BEC3;"></i>
            </div>
          </div>
        </div>

        <!-- Card 4: 需关注, red border -->
        <div class="bg-white rounded-[12px] shadow-sm overflow-hidden" style="box-shadow: 0 2px 10px rgba(45,52,54,0.05); border-left: 4px solid #FF3B30;">
          <div class="flex items-center gap-3 p-3.5">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D;">
              <span class="text-[14px] font-semibold" style="color: #FFFFFF;">强</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[15px] font-semibold text-foreground">赵强</span>
                <span class="text-[12px] text-muted-foreground">五年级3班</span>
              </div>
              <p class="text-[13px] text-foreground mt-1 leading-snug truncate">减法练习 · 20题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>
                <span>昨天 19:00 提交</span>
              </p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(255,59,48,0.12); color: #FF3B30;">正确率50% 需关注</span>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color: #B2BEC3;"></i>
            </div>
          </div>
        </div>

        <!-- Card 5: 已批改 -->
        <div class="bg-white rounded-[12px] shadow-sm overflow-hidden" style="box-shadow: 0 2px 10px rgba(45,52,54,0.05);">
          <div class="flex items-center gap-3 p-3.5">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D;">
              <span class="text-[14px] font-semibold" style="color: #FFFFFF;">洋</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[15px] font-semibold text-foreground">刘洋</span>
                <span class="text-[12px] text-muted-foreground">四年级1班</span>
              </div>
              <p class="text-[13px] text-foreground mt-1 leading-snug truncate">除法练习 · 10题</p>
              <p class="text-[12px] text-muted-foreground mt-0.5 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>
                <span>昨天 16:00 提交</span>
              </p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">已批改 90%</span>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color: #B2BEC3;"></i>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 6. Bottom navigation -->
    <nav data-mobile-nav="global" class="w-full h-[64px]"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a data-nav-key="home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a><a data-nav-key="classes" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="users" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">班级</span></a><a data-nav-key="grade" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="clipboard-check" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">批改</span></a><a data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>

    <script>lucide.createIcons();</script>
    <style id="style-override">

  --brand-background: #FFFFFF;

    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

</style>
</body>
</html>
