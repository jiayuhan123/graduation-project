<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布置作业</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;

  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);

    --color-input: var(--brand-input);

    --radius-sm: var(--brand-radius-sm);

  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

      .text-card-foreground { color: var(--brand-card-foreground); }

      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }

      .no-scrollbar::-webkit-scrollbar { display: none; }

<body class="min-h-screen font-sans antialiased">
    <style>
      /* 页面表单交互态（保持 head 与学生端 home.html 完全一致，样式置于 body 内） */
      .opt-card { border: 2px solid #F0F2F5; background: #FFFFFF; transition: border-color .15s ease, background .15s ease; }
      .opt-card[data-selected="true"] { border-color: #FF8A3D; background: rgba(255,138,61,0.05); }
      .opt-check { display: none; }
      .opt-card[data-selected="true"] .opt-check { display: inline-flex; }
      .pill { background-color: #F0F2F5; color: #636E72; transition: background-color .15s ease, color .15s ease; }
      .pill[data-selected="true"] { background-color: #FF8A3D; color: #FFFFFF; }
      .seg-btn { background-color: #F0F2F5; color: #636E72; transition: background-color .15s ease, color .15s ease; }
      .seg-btn[data-selected="true"] { background-color: #FF8A3D; color: #FFFFFF; }
    </style>
    <main class="max-w-md mx-auto w-full">
      <!-- 1. 状态栏占位 -->
      <div style="height: 44px;"></div>

      <!-- 2. 顶部导航 -->
      <header class="px-4 h-12 grid grid-cols-3 items-center">
        <div class="flex justify-start">
          <button class="w-9 h-9 -ml-1 flex items-center justify-center" aria-label="返回">
            <i data-lucide="chevron-left" class="w-6 h-6" style="color:#2D3436;"></i>
          </button>
        </div>
        <h1 class="text-center text-[17px] font-semibold" style="color:#2D3436;">布置作业</h1>
        <div class="flex justify-end">
          <button class="text-[14px] font-medium" style="color:#FF8A3D;">草稿</button>
        </div>
      </header>

      <!-- 3. 作业类型 -->
      <section class="px-4 mt-4 mb-6">
        <h2 class="text-[15px] font-semibold mb-3" style="color:#2D3436;">作业类型</h2>
        <div class="grid grid-cols-3 gap-3">
          <!-- 口算练习（默认选中） -->
          <button class="opt-card relative h-20 rounded-[12px] flex flex-col items-center justify-center gap-1.5" data-group="type" data-select="single" data-selected="true">
            <div class="w-10 h-10 rounded-[10px] flex items-center justify-center" style="background-color:#4DABF7; box-shadow:0 4px 10px rgba(77,171,247,0.28);">
              <i data-lucide="pencil" class="w-5 h-5" style="color:#FFFFFF;"></i>
            </div>
            <span class="text-[13px] font-medium" style="color:#2D3436;">口算练习</span>
            <span class="opt-check absolute top-1.5 right-1.5 w-[18px] h-[18px] rounded-full items-center justify-center" style="background:#FF8A3D;">
              <i data-lucide="check" class="w-3 h-3" style="color:#FFFFFF;"></i>
            </span>
          </button>
          <!-- 拍照批改 -->
          <button class="opt-card relative h-20 rounded-[12px] flex flex-col items-center justify-center gap-1.5" data-group="type" data-select="single" data-selected="false">
            <div class="w-10 h-10 rounded-[10px] flex items-center justify-center" style="background-color:#FF8A3D; box-shadow:0 4px 10px rgba(255,138,61,0.28);">
              <i data-lucide="camera" class="w-5 h-5" style="color:#FFFFFF;"></i>
            </div>
            <span class="text-[13px] font-medium" style="color:#2D3436;">拍照批改</span>
            <span class="opt-check absolute top-1.5 right-1.5 w-[18px] h-[18px] rounded-full items-center justify-center" style="background:#FF8A3D;">
              <i data-lucide="check" class="w-3 h-3" style="color:#FFFFFF;"></i>
            </span>
          </button>
          <!-- 闯关挑战 -->
          <button class="opt-card relative h-20 rounded-[12px] flex flex-col items-center justify-center gap-1.5" data-group="type" data-select="single" data-selected="false">
            <div class="w-10 h-10 rounded-[10px] flex items-center justify-center" style="background-color:#FF6B9D; box-shadow:0 4px 10px rgba(255,107,157,0.28);">
              <i data-lucide="gamepad-2" class="w-5 h-5" style="color:#FFFFFF;"></i>
            </div>
            <span class="text-[13px] font-medium" style="color:#2D3436;">闯关挑战</span>
            <span class="opt-check absolute top-1.5 right-1.5 w-[18px] h-[18px] rounded-full items-center justify-center" style="background:#FF8A3D;">
              <i data-lucide="check" class="w-3 h-3" style="color:#FFFFFF;"></i>
            </span>
          </button>
        </div>
      </section>

      <!-- 4. 选择班级 -->
      <section class="px-4 mb-6">
        <h2 class="text-[15px] font-semibold mb-3" style="color:#2D3436;">选择班级</h2>
        <div class="flex flex-wrap gap-2">
          <button class="pill px-4 py-2 rounded-full text-[14px] font-medium" data-group="class" data-select="multi" data-people="40" data-selected="true">三年级2班</button>
          <button class="pill px-4 py-2 rounded-full text-[14px] font-medium" data-group="class" data-select="multi" data-people="40" data-selected="true">四年级1班</button>
          <button class="pill px-4 py-2 rounded-full text-[14px] font-medium" data-group="class" data-select="multi" data-people="35" data-selected="false">五年级3班</button>
        </div>
        <p id="class-count" class="text-[13px] mt-3" style="color:#636E72;">已选 2 个班级，共 80 人</p>
      </section>

      <!-- 5. 知识点范围 -->
      <section class="px-4 mb-6">
        <h2 class="text-[15px] font-semibold mb-3" style="color:#2D3436;">知识点范围</h2>
        <div class="flex flex-wrap gap-2">
          <button class="pill px-4 py-2 rounded-full text-[14px] font-medium" data-group="knowledge" data-select="multi" data-selected="true">100以内加减法</button>
          <button class="pill px-4 py-2 rounded-full text-[14px] font-medium" data-group="knowledge" data-select="multi" data-selected="true">乘法口诀表</button>
          <button class="pill px-4 py-2 rounded-full text-[14px] font-medium" data-group="knowledge" data-select="multi" data-selected="false">表内除法</button>
          <button class="pill px-4 py-2 rounded-full text-[14px] font-medium" data-group="knowledge" data-select="multi" data-selected="false">混合运算</button>
          <button class="pill px-4 py-2 rounded-full text-[14px] font-medium" data-group="knowledge" data-select="multi" data-selected="false">分数初步</button>
        </div>
      </section>

      <!-- 6. 难度 -->
      <section class="px-4 mb-6">
        <h2 class="text-[15px] font-semibold mb-3" style="color:#2D3436;">难度</h2>
        <div class="grid grid-cols-3 gap-2">
          <button class="seg-btn h-10 rounded-full text-[14px] font-medium" data-group="difficulty" data-select="single" data-selected="false">简单</button>
          <button class="seg-btn h-10 rounded-full text-[14px] font-medium" data-group="difficulty" data-select="single" data-selected="true">中等</button>
          <button class="seg-btn h-10 rounded-full text-[14px] font-medium" data-group="difficulty" data-select="single" data-selected="false">困难</button>
        </div>
      </section>

      <!-- 7. 题量 -->
      <section class="px-4 mb-6">
        <h2 class="text-[15px] font-semibold mb-3" style="color:#2D3436;">题量</h2>
        <div class="grid grid-cols-3 gap-2">
          <button class="seg-btn h-10 rounded-full text-[14px] font-medium" data-group="count" data-select="single" data-selected="false">10题</button>
          <button class="seg-btn h-10 rounded-full text-[14px] font-medium" data-group="count" data-select="single" data-selected="true">20题</button>
          <button class="seg-btn h-10 rounded-full text-[14px] font-medium" data-group="count" data-select="single" data-selected="false">30题</button>
        </div>
      </section>

      <!-- 8. 截止时间 -->
      <section class="px-4 mb-8">
        <h2 class="text-[15px] font-semibold mb-3" style="color:#2D3436;">截止时间</h2>
        <button class="w-full flex items-center gap-3 px-4 py-3.5 rounded-[12px]" style="border:1px solid #F0F2F5; background:#FFFFFF;">
          <i data-lucide="calendar" class="w-5 h-5 shrink-0" style="color:#FF8A3D;"></i>
          <span class="flex-1 text-left text-[15px]" style="color:#2D3436;">9月6日 周五 23:59</span>
          <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color:#B2BEC3;"></i>
        </button>
      </section>

      <!-- 9. 发布按钮 -->
      <div class="px-4 flex justify-center" style="padding-bottom: max(env(safe-area-inset-bottom), 20px);">
        <button class="w-[80%] h-12 rounded-full text-[16px] font-semibold flex items-center justify-center gap-2" style="background-color:#FF8A3D; color:#FFFFFF; box-shadow:0 8px 20px rgba(255,138,61,0.35);">
          <i data-lucide="send" class="w-5 h-5" style="color:#FFFFFF;"></i>
          <span>发布作业</span>
        </button>
      </div>
    </main>

    <script>
      lucide.createIcons();

      // 表单选择交互
      function updateClassCount() {
        var selected = document.querySelectorAll('[data-group="class"][data-selected="true"]');
        var people = 0;
        selected.forEach(function (s) { people += parseInt(s.dataset.people || '0', 10); });
        var el = document.getElementById('class-count');
        if (el) el.textContent = '已选 ' + selected.length + ' 个班级，共 ' + people + ' 人';
      }

      document.addEventListener('click', function (e) {
        var el = e.target.closest('[data-group]');
        if (!el) return;
        var group = el.dataset.group;
        var multi = el.dataset.select === 'multi';
        if (!multi) {
          el.parentNode.querySelectorAll('[data-group="' + group + '"]').forEach(function (s) {
            if (s !== el) s.dataset.selected = 'false';
          });
        }
        el.dataset.selected = el.dataset.selected === 'true' ? 'false' : 'true';
        if (group === 'class') updateClassCount();
      });
    </script>
    <style id="style-override">

  --brand-background: #FFFFFF;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;

  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F8F9FB;
  --brand-muted-foreground: #636E72;
  --brand-border: #F0F2F5;
  --brand-input: #E0E4E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 10px;
  --brand-radius-md: 16px;
  --brand-radius-lg: 20px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #F0F2F5; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
