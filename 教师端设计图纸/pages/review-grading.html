<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>低可信批改复核</title>
    <style id="theme-vars">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top header: back + center title + skip -->
      <header class="px-4 h-[52px] flex items-center justify-between">
        <button class="w-9 h-9 -ml-1 flex items-center justify-center rounded-full" style="background-color: #F0F2F5;" aria-label="返回">
          <i data-lucide="arrow-left" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-bold text-foreground">批改复核</h1>
        <button class="text-[14px] font-medium" style="color: #FF8A3D;">跳过</button>
      </header>

      <!-- 3. Review overview card -->
      <section class="px-4 mt-2">
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-[16px] font-bold text-foreground">待复核</h2>
            <span class="text-[12px] text-muted-foreground">9月4日</span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div class="flex flex-col items-center text-center py-1">
              <span class="text-[22px] font-bold leading-none" style="color: #FF8A3D;">5</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">待复核</span>
            </div>
            <div class="flex flex-col items-center text-center py-1" style="border-left: 1px solid #ECEFF2; border-right: 1px solid #ECEFF2;">
              <span class="text-[22px] font-bold text-foreground leading-none">12</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">已处理</span>
            </div>
            <div class="flex flex-col items-center text-center py-1">
              <span class="text-[22px] font-bold text-foreground leading-none">&lt;80%</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">可信度</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. Student info row -->
      <section class="px-4 mt-4">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background-color: #FF8A3D;">
            <span class="text-[15px] font-semibold text-white">明</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[15px] font-semibold text-foreground leading-tight">张明 · 三年级2班</p>
            <p class="text-[12px] text-muted-foreground mt-0.5">提交 14:30</p>
          </div>
        </div>
      </section>

      <!-- 5. Homework image area (mock) -->
      <section class="px-4 mt-3">
        <div class="relative rounded-xl flex flex-col items-center justify-center" style="background-color: #F0F2F5; height: 200px;">
          <i data-lucide="image" class="w-9 h-9" style="color: #B2BAC2;"></i>
          <p class="text-[13px] mt-2" style="color: #636E72;">学生作业照片</p>
          <span class="absolute top-3 right-3 text-[12px] font-semibold px-2.5 py-1 rounded-full" style="background-color: #FF8A3D; color: #FFFFFF;">可信度 65%</span>
        </div>
      </section>

      <!-- 6. AI recognition result -->
      <section class="px-4 mt-4">
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-1.5 mb-3">
            <i data-lucide="bot" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
            <h3 class="text-[14px] font-bold text-foreground">AI识别结果</h3>
          </div>
          <div class="flex items-center justify-between py-3 px-3.5 rounded-lg" style="background-color: #F8F9FB;">
            <div class="flex items-center gap-2">
              <span class="text-[12px] text-muted-foreground">题目</span>
              <span class="text-[16px] font-semibold text-foreground">56 - 19 = ?</span>
            </div>
          </div>
          <div class="flex items-center justify-between py-3">
            <div class="flex items-center gap-2">
              <span class="text-[12px] text-muted-foreground">AI识别答案</span>
              <span class="text-[18px] font-bold" style="color: #2D3436;">27</span>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full" style="background-color: rgba(255,59,48,0.10); color: #FF3B30;">错误</span>
          </div>
          <div class="h-px" style="background-color: #ECEFF2;"></div>
          <div class="flex items-center gap-2 py-3">
            <i data-lucide="x-circle" class="w-[18px] h-[18px] shrink-0" style="color: #FF3B30;"></i>
            <p class="text-[14px] text-foreground leading-snug">
              错误，正确答案 <span class="font-bold" style="color: #FF8A3D;">37</span>
            </p>
          </div>
          <div class="flex items-center gap-2 mt-1 px-3 py-2.5 rounded-lg" style="background-color: #FFF0E5;">
            <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0" style="color: #FF8A3D;"></i>
            <p class="text-[12px] font-medium" style="color: #FF8A3D;">识别可信度低，请教师复核</p>
          </div>
        </div>
      </section>

      <!-- 7. Teacher review operation -->
      <section class="px-4 mt-4">
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-1.5 mb-3">
            <i data-lucide="clipboard-check" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
            <h3 class="text-[14px] font-bold text-foreground">教师复核</h3>
          </div>
          <div class="flex flex-col gap-2.5">
            <label data-option="correct" class="review-opt flex items-center gap-3 px-3.5 py-3 rounded-lg cursor-pointer" style="background-color: #F8F9FB;">
              <span data-radio class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 border-2" style="border-color: #4CAF50;">
                <span data-dot class="w-2.5 h-2.5 rounded-full" style="background-color: transparent;"></span>
              </span>
              <i data-lucide="check-circle-2" class="w-[18px] h-[18px] shrink-0" style="color: #4CAF50;"></i>
              <span class="text-[14px] text-foreground">确认正确（AI批改正确）</span>
            </label>
            <label data-option="wrong" class="review-opt flex items-center gap-3 px-3.5 py-3 rounded-lg cursor-pointer" style="background-color: #F8F9FB;">
              <span data-radio class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 border-2" style="border-color: #FF3B30;">
                <span data-dot class="w-2.5 h-2.5 rounded-full" style="background-color: transparent;"></span>
              </span>
              <i data-lucide="x-circle" class="w-[18px] h-[18px] shrink-0" style="color: #FF3B30;"></i>
              <span class="text-[14px] text-foreground">AI批改有误（改为正确）</span>
            </label>
            <label data-option="abnormal" class="review-opt flex items-center gap-3 px-3.5 py-3 rounded-lg cursor-pointer" style="background-color: #F8F9FB;">
              <span data-radio class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 border-2" style="border-color: #FF8A3D;">
                <span data-dot class="w-2.5 h-2.5 rounded-full" style="background-color: transparent;"></span>
              </span>
              <i data-lucide="alert-triangle" class="w-[18px] h-[18px] shrink-0" style="color: #FF8A3D;"></i>
              <span class="text-[14px] text-foreground">标记异常（需重新拍照）</span>
            </label>
          </div>
          <textarea class="mt-3 w-full rounded-lg px-3.5 py-2.5 text-[13px] text-foreground resize-none outline-none" rows="2" placeholder="添加复核备注" style="background-color: #F8F9FB; border: 1px solid #ECEFF2;"></textarea>
        </div>
      </section>

      <!-- 8. Bottom action buttons -->
      <section class="px-4 mt-5 mb-6">
        <div class="flex gap-3">
          <button class="flex-1 h-12 rounded-full text-[15px] font-semibold text-white" style="background-color: #FF8A3D;">确认复核</button>
          <button class="flex-1 h-12 rounded-full text-[15px] font-semibold" style="background-color: #FFFFFF; border: 1.5px solid #FF8A3D; color: #FF8A3D;">下一份</button>
        </div>
      </section>

      <!-- 9. Bottom safe area -->
      <div style="height: env(safe-area-inset-bottom, 0px);"></div>
    </main>

    <script>
      lucide.createIcons();
      // single-select radio behavior for teacher review options
      var opts = document.querySelectorAll('.review-opt');
      var colorMap = { correct: '#4CAF50', wrong: '#FF3B30', abnormal: '#FF8A3D' };
      opts.forEach(function (opt) {
        opt.addEventListener('click', function () {
          var key = opt.getAttribute('data-option');
          opts.forEach(function (o) {
            var k = o.getAttribute('data-option');
            var radio = o.querySelector('[data-radio]');
            var dot = o.querySelector('[data-dot]');
            if (k === key) {
              radio.style.backgroundColor = colorMap[k];
              radio.style.borderColor = colorMap[k];
              dot.style.backgroundColor = '#FFFFFF';
              o.style.backgroundColor = '#FFF7F0';
            } else {
              radio.style.backgroundColor = 'transparent';
              radio.style.borderColor = colorMap[k];
              dot.style.backgroundColor = 'transparent';
              o.style.backgroundColor = '#F8F9FB';
            }
          });
        });
      });
    </script>
    <style id="style-override">
:root {
  --brand-background: #F8F9FB;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F2F5;
  --brand-muted-foreground: #636E72;
  --brand-border: #ECEFF2;
  --brand-input: #DFE3E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 6px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECEFF2; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
