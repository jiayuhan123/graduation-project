<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择题目</title>
    <style id="theme-vars">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex; align-items: center; justify-content: center;
        -webkit-mask-size: contain; mask-size: contain;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-position: center; mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <div style="height: 44px;"></div>
      <!-- 顶部导航 -->
      <header class="h-[48px] flex items-center justify-between px-4 bg-white sticky top-0 z-20" style="border-bottom: 1px solid #ECEFF2;">
        <button>
          <i data-lucide="chevron-left" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold" style="color: #2D3436;">选择题目</h1>
        <button class="text-[15px] font-medium" style="color: #FF8A3D;">完成</button>
      </header>

      <!-- 已选统计条 -->
      <div class="bg-white px-4 py-3 flex items-center justify-between sticky top-[48px] z-10" style="border-bottom: 1px solid #ECEFF2;">
        <div class="flex items-center gap-1.5">
          <i data-lucide="check-circle" class="w-4 h-4" style="color: #FF8A3D;"></i>
          <span class="text-[14px] font-semibold" style="color: #FF8A3D;">已选 5 题</span>
        </div>
        <div class="flex items-center gap-3 text-[13px]" style="color: #636E72;">
          <span>总分 50分</span>
          <span style="color: #ECEFF2;">|</span>
          <span>预计15分钟</span>
        </div>
      </div>

      <!-- 筛选区 -->
      <div class="px-4 pt-3 pb-2">
        <!-- 知识点筛选 -->
        <div class="mb-2">
          <div class="text-[11px] mb-1.5" style="color: #636E72;">知识点</div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap" style="background: #FF8A3D; color: #FFFFFF;">全部</button>
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap bg-white" style="color: #636E72; border: 1px solid #ECEFF2;">加法</button>
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap bg-white" style="color: #636E72; border: 1px solid #ECEFF2;">减法</button>
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap bg-white" style="color: #636E72; border: 1px solid #ECEFF2;">乘法</button>
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap bg-white" style="color: #636E72; border: 1px solid #ECEFF2;">除法</button>
          </div>
        </div>
        <!-- 难度筛选 -->
        <div class="mb-1">
          <div class="text-[11px] mb-1.5" style="color: #636E72;">难度</div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap" style="background: #FF8A3D; color: #FFFFFF;">全部</button>
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap bg-white" style="color: #636E72; border: 1px solid #ECEFF2;">简单</button>
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap bg-white" style="color: #636E72; border: 1px solid #ECEFF2;">中等</button>
            <button class="px-2.5 py-1 rounded-md text-[12px] font-medium whitespace-nowrap bg-white" style="color: #636E72; border: 1px solid #ECEFF2;">困难</button>
          </div>
        </div>
      </div>

      <!-- 题目列表 -->
      <div class="px-4 py-2 space-y-3 pb-24">
        <!-- 卡片1 已选中 -->
        <div class="bg-white rounded-xl p-4 relative" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06); border-left: 3px solid #FF8A3D;">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-semibold" style="color: #2D3436;">#001</span>
              <span class="px-1.5 py-0.5 rounded text-[10px]" style="background: #F0F2F5; color: #636E72;">口算</span>
              <span class="px-1.5 py-0.5 rounded text-[10px]" style="background: rgba(76,175,80,0.12); color: #4CAF50;">简单</span>
            </div>
            <i data-lucide="check-circle" class="w-5 h-5" style="color: #FF8A3D;"></i>
          </div>
          <div class="text-[16px] font-medium mb-3 py-2 px-3 rounded-lg" style="color: #2D3436; background: #F8F9FB;">23 + 45 = ?</div>
          <div class="flex items-center justify-between text-[11px]" style="color: #636E72;">
            <span>知识点: 两位数加法</span>
            <span class="font-medium" style="color: #FF8A3D;">2分</span>
          </div>
        </div>

        <!-- 卡片2 已选中 -->
        <div class="bg-white rounded-xl p-4 relative" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06); border-left: 3px solid #FF8A3D;">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-semibold" style="color: #2D3436;">#002</span>
              <span class="px-1.5 py-0.5 rounded text-[10px]" style="background: #F0F2F5; color: #636E72;">填空</span>
              <span class="px-1.5 py-0.5 rounded text-[10px]" style="background: rgba(255,138,61,0.12); color: #FF8A3D;">中等</span>
            </div>
            <i data-lucide="check-circle" class="w-5 h-5" style="color: #FF8A3D;"></i>
          </div>
          <div class="text-[16px] font-medium mb-3 py-2 px-3 rounded-lg" style="color: #2D3436; background: #F8F9FB;">(  ) × 6 = 42</div>
          <div class="flex items-center justify-between text-[11px]" style="color: #636E72;">
            <span>知识点: 表内乘法</span>
            <span class="font-medium" style="color: #FF8A3D;">3分</span>
          </div>
        </div>

        <!-- 卡片3 未选中 -->
        <div class="bg-white rounded-xl p-4 relative" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06); border: 1px solid #ECEFF2;">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-semibold" style="color: #2D3436;">#003</span>
              <span class="px-1.5 py-0.5 rounded text-[10px]" style="background: #F0F2F5; color: #636E72;">竖式计算</span>
              <span class="px-1.5 py-0.5 rounded text-[10px]" style="background: rgba(255,59,48,0.12); color: #FF3B30;">困难</span>
            </div>
            <i data-lucide="circle" class="w-5 h-5" style="color: #DFE3E8;"></i>
          </div>
          <div class="text-[16px] font-medium mb-3 py-2 px-3 rounded-lg" style="color: #2D3436; background: #F8F9FB;">356 + 478 = ?</div>
          <div class="flex items-center justify-between text-[11px]" style="color: #636E72;">
            <span>知识点: 三位数加法</span>
            <span class="font-medium" style="color: #636E72;">5分</span>
          </div>
        </div>

        <!-- 卡片4 已选中 -->
        <div class="bg-white rounded-xl p-4 relative" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06); border-left: 3px solid #FF8A3D;">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-[12px] font-semibold" style="color: #2D3436;">#004</span>
              <span class="px-1.5 py-0.5 rounded text-[10px]" style="background: #F0F2F5; color: #636E72;">口算</span>
              <span class="px-1.5 py-0.5 rounded text-[10px]" style="background: rgba(76,175,80,0.12); color: #4CAF50;">简单</span>
            </div>
            <i data-lucide="check-circle" class="w-5 h-5" style="color: #FF8A3D;"></i>
          </div>
          <div class="text-[16px] font-medium mb-3 py-2 px-3 rounded-lg" style="color: #2D3436; background: #F8F9FB;">72 - 28 = ?</div>
          <div class="flex items-center justify-between text-[11px]" style="color: #636E72;">
            <span>知识点: 两位数减法</span>
            <span class="font-medium" style="color: #FF8A3D;">2分</span>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部固定操作栏 -->
    <div class="max-w-md mx-auto w-full fixed bottom-0 left-0 right-0 bg-white px-4 py-3 flex items-center justify-between" style="border-top: 1px solid #ECEFF2; z-index: 30;">
      <div class="flex flex-col">
        <span class="text-[13px] font-semibold" style="color: #2D3436;">已选5题 · 50分</span>
        <span class="text-[11px]" style="color: #636E72;">预计15分钟</span>
      </div>
      <button class="px-6 py-2.5 rounded-lg text-[15px] font-semibold" style="background: #FF8A3D; color: #FFFFFF;">确认选题</button>
    </div>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #F8F9FB;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F2F5;
  --brand-muted-foreground: #636E72;
  --brand-border: #ECEFF2;
  --brand-input: #DFE3E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 6px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
