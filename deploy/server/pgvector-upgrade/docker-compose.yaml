name: ${COMPOSE_PROJECT_NAME:-primary-math-platform}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?请设置 DB_USERNAME}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?请设置 DB_PASSWORD}"
      POSTGRES_DB: ${MONOLITH_DB_NAME:-monolith_db}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    shm_size: "128m"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 384m
    networks:
      - local-net

  redis:
    image: redis:8.0
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    networks:
      - local-net

  nacos:
    image: nacos/nacos-server:v3.2.2
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "${NACOS_AUTH_ENABLE:-false}"
      NACOS_AUTH_SYSTEM_TYPE: "${NACOS_AUTH_SYSTEM_TYPE:-nacos}"
      NACOS_AUTH_ADMIN_ENABLE: "${NACOS_AUTH_ADMIN_ENABLE:-true}"
      NACOS_AUTH_CONSOLE_ENABLE: "${NACOS_AUTH_CONSOLE_ENABLE:-true}"
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos_identity_project}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos_identity_value_111111}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      JVM_XMS: ${NACOS_JVM_XMS:-256m}
      JVM_XMX: ${NACOS_JVM_XMX:-256m}
      JVM_XMN: ${NACOS_JVM_XMN:-128m}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "0.0.0.0:${NACOS_SERVER_PORT:-8848}:8848"
      - "0.0.0.0:${NACOS_CONSOLE_PORT:-8847}:8080"
      - "0.0.0.0:${NACOS_GRPC_PORT:-9848}:9848"
      - "0.0.0.0:${NACOS_GRPC_CLIENT_PORT:-9849}:9849"
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/data:/home/nacos/data
    mem_limit: 512m
    networks:
      - local-net

  rabbitmq:
    image: rabbitmq:4.3.4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?请设置 RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?请设置 RABBITMQ_PASSWORD}"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "0.0.0.0:${RABBITMQ_PORT:-5672}:5672"
      - "0.0.0.0:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 320m
    networks:
      - local-net

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    ports:
      - "0.0.0.0:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 192m
    networks:
      - local-net

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "0.0.0.0:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 160m
    networks:
      - local-net

  jenkins:
    build:
      context: ./deploy/jenkins
      dockerfile: Dockerfile
    image: primary-math-platform-jenkins:lts-jdk21
    restart: unless-stopped
    environment:
      JAVA_OPTS: "${JENKINS_JAVA_OPTS:--Xms128m -Xmx320m -XX:MaxMetaspaceSize=160m -Djava.awt.headless=true} -Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_config/casc.yaml
      JENKINS_ADMIN_USERNAME: "${JENKINS_ADMIN_USERNAME:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?请设置 JENKINS_ADMIN_PASSWORD}"
      TZ: ${TZ:-Asia/Shanghai}
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "0.0.0.0:${JENKINS_WEB_PORT:-8080}:8080"
    volumes:
      - ./data/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/jenkins/casc.yaml:/var/jenkins_config/casc.yaml:ro
    mem_limit: 640m
    networks:
      - local-net

networks:
  local-net:
    driver: bridge
