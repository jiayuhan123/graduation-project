global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # 模块化单体当前直接运行在宿主机，Prometheus 从容器内抓取统一入口。
  - job_name: primary-math-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:10000
        labels:
          service: monolith-app
