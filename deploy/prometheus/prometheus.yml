global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Java 单体与 Prometheus 位于同一个平台网络，通过容器服务名抓取指标。
  - job_name: primary-math-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - monolith-app:10000
        labels:
          service: monolith-app

  - job_name: primary-math-agent
    metrics_path: /metrics
    static_configs:
      - targets:
          - agent-service:8100
        labels:
          service: agent-service
