<!DOCTYPE html>

<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top header -->
      <header class="px-4 pt-3 pb-2 grid grid-cols-3 items-center">
        <div class="justify-self-start">
          <button class="w-9 h-9 -ml-1 flex items-center justify-center shrink-0" aria-label="返回">
            <i data-lucide="arrow-left" class="w-5 h-5" style="color: #2D3436;"></i>
          </button>
        </div>
        <h1 class="justify-self-center text-[17px] font-bold text-foreground">教师管理</h1>
        <div class="justify-self-end">
          <button class="w-9 h-9 -mr-1 flex items-center justify-center shrink-0" aria-label="添加教师">
            <i data-lucide="plus" class="w-5 h-5" style="color: #FF8A3D;"></i>
          </button>
        </div>
      </header>

      <!-- 3. Search bar -->
      <section class="px-4 mt-2">
        <div class="flex items-center gap-2 bg-white rounded-xl px-3 h-10" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <i data-lucide="search" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
          <input type="text" placeholder="搜索教师姓名/手机号" class="flex-1 min-w-0 bg-transparent outline-none text-[14px] text-foreground" style="color-scheme: light;">
        </div>
      </section>

      <!-- 4. Filter tags -->
      <section class="mt-3">
        <div class="flex gap-2 overflow-x-auto no-scrollbar px-4 pb-1">
          <button class="shrink-0 px-3.5 h-7 rounded-full text-[13px] font-medium" style="background-color: #FF8A3D; color: #FFFFFF;">全部</button>
          <button class="shrink-0 px-3.5 h-7 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">待审核</button>
          <button class="shrink-0 px-3.5 h-7 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">在职</button>
          <button class="shrink-0 px-3.5 h-7 rounded-full text-[13px] font-medium" style="background-color: #F0F2F5; color: #636E72;">已离职</button>
        </div>
      </section>

      <!-- 5. Stats overview -->
      <section class="px-4 mt-3">
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-3 gap-2">
            <div class="flex flex-col items-center text-center">
              <span class="text-[22px] font-bold text-foreground leading-none">156</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">总教师</span>
            </div>
            <div class="flex flex-col items-center text-center" style="border-left: 1px solid #ECEFF2; border-right: 1px solid #ECEFF2;">
              <span class="text-[22px] font-bold text-foreground leading-none">12</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">本月新增</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[22px] font-bold leading-none" style="color: #FF8A3D;">5</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">待审核</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 6. Teacher list -->
      <section class="px-4 mt-3 mb-6 space-y-3">
        <!-- Card 1: 王老师 在职 -->
        <div class="bg-white rounded-xl p-3.5" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-white text-[15px] font-semibold" style="background: linear-gradient(135deg, #FFB57A, #FF8A3D);">王</div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-bold text-foreground leading-tight">王老师</h3>
              <p class="text-[13px] text-muted-foreground mt-0.5 truncate">阳光小学 · 三年级</p>
            </div>
            <span class="shrink-0 text-[12px] font-medium px-2.5 py-1 rounded-full" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">在职</span>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
          </div>
          <div class="flex items-center gap-4 mt-2.5 pt-2.5" style="border-top: 1px solid #F0F2F5;">
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="phone" class="w-3.5 h-3.5"></i>138****8888
            </span>
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>2024.03加入
            </span>
          </div>
        </div>

        <!-- Card 2: 李老师 待审核 (highlighted) -->
        <div class="bg-white rounded-xl p-3.5" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06); border-left: 4px solid #FF8A3D;">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-white text-[15px] font-semibold" style="background: linear-gradient(135deg, #FFB57A, #FF8A3D);">李</div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-bold text-foreground leading-tight">李老师</h3>
              <p class="text-[13px] text-muted-foreground mt-0.5 truncate">启航实验小学</p>
            </div>
            <span class="shrink-0 text-[12px] font-medium px-2.5 py-1 rounded-full" style="background-color: rgba(255,138,61,0.12); color: #FF8A3D;">待审核</span>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
          </div>
          <div class="flex items-center gap-4 mt-2.5 pt-2.5" style="border-top: 1px solid #F0F2F5;">
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="phone" class="w-3.5 h-3.5"></i>139****6666
            </span>
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>2024.09申请
            </span>
          </div>
        </div>

        <!-- Card 3: 张老师 在职 -->
        <div class="bg-white rounded-xl p-3.5" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-white text-[15px] font-semibold" style="background: linear-gradient(135deg, #FFB57A, #FF8A3D);">张</div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-bold text-foreground leading-tight">张老师</h3>
              <p class="text-[13px] text-muted-foreground mt-0.5 truncate">未来科技学校 · 四年级</p>
            </div>
            <span class="shrink-0 text-[12px] font-medium px-2.5 py-1 rounded-full" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">在职</span>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
          </div>
          <div class="flex items-center gap-4 mt-2.5 pt-2.5" style="border-top: 1px solid #F0F2F5;">
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="phone" class="w-3.5 h-3.5"></i>137****7777
            </span>
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>2023.09加入
            </span>
          </div>
        </div>

        <!-- Card 4: 陈老师 在职 -->
        <div class="bg-white rounded-xl p-3.5" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-white text-[15px] font-semibold" style="background: linear-gradient(135deg, #FFB57A, #FF8A3D);">陈</div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-bold text-foreground leading-tight">陈老师</h3>
              <p class="text-[13px] text-muted-foreground mt-0.5 truncate">博文小学 · 五年级</p>
            </div>
            <span class="shrink-0 text-[12px] font-medium px-2.5 py-1 rounded-full" style="background-color: rgba(76,175,80,0.12); color: #4CAF50;">在职</span>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
          </div>
          <div class="flex items-center gap-4 mt-2.5 pt-2.5" style="border-top: 1px solid #F0F2F5;">
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="phone" class="w-3.5 h-3.5"></i>135****3333
            </span>
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>2023.03加入
            </span>
          </div>
        </div>

        <!-- Card 5: 刘老师 已离职 -->
        <div class="bg-white rounded-xl p-3.5" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06); border-left: 4px solid #B2BAC2;">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 text-white text-[15px] font-semibold" style="background: linear-gradient(135deg, #C5CCD3, #9AA5B1);">刘</div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-bold text-foreground leading-tight">刘老师</h3>
              <p class="text-[13px] text-muted-foreground mt-0.5 truncate">星辰实验学校</p>

            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
          </div>
          <div class="flex items-center gap-4 mt-2.5 pt-2.5" style="border-top: 1px solid #F0F2F5;">
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="phone" class="w-3.5 h-3.5"></i>136****5555
            </span>
            <span class="flex items-center gap-1 text-[12px] text-muted-foreground">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>2022.09-2024.06

    <!-- 7. Bottom navigation -->
    <nav data-mobile-nav="global" class="w-full h-[64px]"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a data-nav-key="home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a><a data-nav-key="manage" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="building-2" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">管理</span></a><a data-nav-key="review" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="clipboard-check" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">审核</span></a><a data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>
