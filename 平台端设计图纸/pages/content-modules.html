<!DOCTYPE html>

    <style id="theme-vars">

<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top header -->
      <header class="px-4 h-11 flex items-center justify-between">
        <button class="w-8 h-8 flex items-center justify-center shrink-0" aria-label="返回">
          <i data-lucide="chevron-left" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">内容模块管理</h1>
        <button class="w-8 h-8 flex items-center justify-center shrink-0" aria-label="添加">
          <i data-lucide="plus" class="w-6 h-6" style="color: #FF8A3D;"></i>
        </button>
      </header>

      <!-- 3. Statistics overview -->
      <section class="px-4 mt-3">
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-3">
            <div class="flex flex-col items-center text-center">
              <span class="text-[22px] font-bold leading-none" style="color: #FF8A3D;">12</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">总模块</span>
            </div>
            <div class="flex flex-col items-center text-center" style="border-left: 1px solid #ECEFF2; border-right: 1px solid #ECEFF2;">
              <span class="text-[22px] font-bold leading-none" style="color: #2D3436;">45</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">总知识点</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[22px] font-bold leading-none" style="color: #2D3436;">3,200</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">总题量</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 4. Filter tab bar -->
      <section class="mt-4">
        <div class="flex gap-2 px-4 overflow-x-auto no-scrollbar">
          <button class="px-3.5 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #FF8A3D; color: #FFFFFF;">全部</button>
          <button class="px-3.5 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #FFFFFF; color: #636E72; border: 1px solid #ECEFF2;">一年级</button>
          <button class="px-3.5 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #FFFFFF; color: #636E72; border: 1px solid #ECEFF2;">二年级</button>
          <button class="px-3.5 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #FFFFFF; color: #636E72; border: 1px solid #ECEFF2;">三年级</button>
          <button class="px-3.5 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #FFFFFF; color: #636E72; border: 1px solid #ECEFF2;">四年级</button>
          <button class="px-3.5 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #FFFFFF; color: #636E72; border: 1px solid #ECEFF2;">五年级</button>
          <button class="px-3.5 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #FFFFFF; color: #636E72; border: 1px solid #ECEFF2;">六年级</button>
        </div>
      </section>

      <!-- 5. Module list -->
      <section class="px-4 mt-4 space-y-3 mb-6">
        <!-- Card 1 -->
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <h3 class="text-[16px] font-bold text-foreground leading-snug">二年级上册·100以内加减法</h3>
              <div class="flex items-center gap-3 mt-2">
                <div class="flex items-center gap-1">
                  <i data-lucide="book-open" class="w-3.5 h-3.5" style="color: #FF8A3D;"></i>
                  <span class="text-[12px] text-muted-foreground">2个知识点</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="file-text" class="w-3.5 h-3.5" style="color: #4DABF7;"></i>
                  <span class="text-[12px] text-muted-foreground">1,000题</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="users" class="w-3.5 h-3.5" style="color: #4CAF50;"></i>
                  <span class="text-[12px] text-muted-foreground">使用率85%</span>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-2.5">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium" style="background-color: rgba(255,138,61,0.10); color: #FF8A3D;">加法</span>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium" style="background-color: rgba(255,138,61,0.10); color: #FF8A3D;">减法</span>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0 mt-1" style="color: #B2BAC2;"></i>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <h3 class="text-[16px] font-bold text-foreground leading-snug">二年级下册·乘法口诀</h3>
              <div class="flex items-center gap-3 mt-2">
                <div class="flex items-center gap-1">
                  <i data-lucide="book-open" class="w-3.5 h-3.5" style="color: #FF8A3D;"></i>
                  <span class="text-[12px] text-muted-foreground">2个知识点</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="file-text" class="w-3.5 h-3.5" style="color: #4DABF7;"></i>
                  <span class="text-[12px] text-muted-foreground">1,200题</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="users" class="w-3.5 h-3.5" style="color: #4CAF50;"></i>
                  <span class="text-[12px] text-muted-foreground">使用率92%</span>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-2.5">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium" style="background-color: rgba(255,138,61,0.10); color: #FF8A3D;">乘法</span>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium" style="background-color: rgba(255,138,61,0.10); color: #FF8A3D;">除法</span>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0 mt-1" style="color: #B2BAC2;"></i>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <h3 class="text-[16px] font-bold text-foreground leading-snug">三年级上册·混合运算</h3>
              <div class="flex items-center gap-3 mt-2">
                <div class="flex items-center gap-1">
                  <i data-lucide="book-open" class="w-3.5 h-3.5" style="color: #FF8A3D;"></i>
                  <span class="text-[12px] text-muted-foreground">1个知识点</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="file-text" class="w-3.5 h-3.5" style="color: #4DABF7;"></i>
                  <span class="text-[12px] text-muted-foreground">400题</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="users" class="w-3.5 h-3.5" style="color: #4CAF50;"></i>
                  <span class="text-[12px] text-muted-foreground">使用率65%</span>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-2.5">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium" style="background-color: rgba(255,138,61,0.10); color: #FF8A3D;">混合运算</span>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0 mt-1" style="color: #B2BAC2;"></i>
          </div>
        </div>

        <!-- Card 4 -->

          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <h3 class="text-[16px] font-bold text-foreground leading-snug">三年级下册·分数初步</h3>
              <div class="flex items-center gap-3 mt-2">
                <div class="flex items-center gap-1">
                  <i data-lucide="book-open" class="w-3.5 h-3.5" style="color: #FF8A3D;"></i>
                  <span class="text-[12px] text-muted-foreground">1个知识点</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="file-text" class="w-3.5 h-3.5" style="color: #4DABF7;"></i>
                  <span class="text-[12px] text-muted-foreground">600题</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="users" class="w-3.5 h-3.5" style="color: #4CAF50;"></i>
                  <span class="text-[12px] text-muted-foreground">使用率45%</span>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-2.5">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium" style="background-color: rgba(255,138,61,0.10); color: #FF8A3D;">分数</span>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0 mt-1" style="color: #B2BAC2;"></i>
          </div>
        </div>

        <!-- Card 5 -->
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 min-w-0">
              <h3 class="text-[16px] font-bold text-foreground leading-snug">四年级上册·多位数运算</h3>
              <div class="flex items-center gap-3 mt-2">
                <div class="flex items-center gap-1">
                  <i data-lucide="book-open" class="w-3.5 h-3.5" style="color: #FF8A3D;"></i>
                  <span class="text-[12px] text-muted-foreground">2个知识点</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="file-text" class="w-3.5 h-3.5" style="color: #4DABF7;"></i>
                  <span class="text-[12px] text-muted-foreground">800题</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="users" class="w-3.5 h-3.5" style="color: #4CAF50;"></i>
                  <span class="text-[12px] text-muted-foreground">使用率70%</span>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 mt-2.5">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium" style="background-color: rgba(255,138,61,0.10); color: #FF8A3D;">多位加法</span>
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-medium" style="background-color: rgba(255,138,61,0.10); color: #FF8A3D;">多位减法</span>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 shrink-0 mt-1" style="color: #B2BAC2;"></i>
          </div>
        </div>
      </section>
    </main>

    <!-- 6. Bottom navigation -->
    <nav data-mobile-nav="global" class="w-full h-[64px]"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a data-nav-key="home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a><a data-nav-key="manage" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="building-2" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">管理</span></a><a data-nav-key="review" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="clipboard-check" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">审核</span></a><a data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>
