<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识点管理</title>
    <style id="theme-vars">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top header -->
      <header class="px-4 h-[48px] flex items-center justify-between">
        <button class="w-9 h-9 flex items-center justify-center -ml-2" aria-label="返回">
          <i data-lucide="arrow-left" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">知识点管理</h1>
        <button class="w-9 h-9 flex items-center justify-center -mr-2" aria-label="添加">
          <i data-lucide="plus" class="w-5 h-5" style="color: #FF8A3D;"></i>
        </button>
      </header>

      <!-- 3. Search bar -->
      <section class="px-4 mt-2">
        <div class="relative">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4" style="color: #636E72;"></i>
          <input type="text" placeholder="搜索知识点" class="w-full h-10 pl-10 pr-4 rounded-lg text-[14px] focus:outline-none" style="background-color: #F0F2F5; color: #2D3436;">
        </div>
      </section>

      <!-- 4. Statistics overview -->
      <section class="px-4 mt-3">
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-3 gap-2">
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] font-bold text-foreground leading-none">45</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">总知识点</span>
            </div>
            <div class="flex flex-col items-center text-center border-l border-r" style="border-color: #ECEFF2;">
              <span class="text-[20px] font-bold text-foreground leading-none">3,200</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">总题量</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <span class="text-[20px] font-bold text-foreground leading-none">12</span>
              <span class="text-[12px] text-muted-foreground mt-1.5">总模块</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 5. Filter tabs -->
      <section class="mt-4">
        <div class="flex gap-2 px-4 overflow-x-auto no-scrollbar pb-1">
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #FF8A3D; color: #FFFFFF;">全部</button>
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #F0F2F5; color: #636E72;">一年级</button>
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #F0F2F5; color: #636E72;">二年级</button>
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #F0F2F5; color: #636E72;">三年级</button>
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #F0F2F5; color: #636E72;">四年级</button>
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #F0F2F5; color: #636E72;">五年级</button>
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap shrink-0" style="background-color: #F0F2F5; color: #636E72;">六年级</button>
        </div>
      </section>

      <!-- 6. Knowledge point list -->
      <section class="px-4 mt-4">

        <!-- Module 1: 二年级上册·100以内加减法 -->
        <div class="mb-5">
          <div class="flex items-center gap-2 mb-2.5">
            <div class="w-1 h-4 rounded-full" style="background-color: #FF8A3D;"></div>
            <h2 class="text-[14px] font-bold text-foreground">二年级上册·100以内加减法</h2>
          </div>
          <div class="bg-white rounded-xl overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
            <div class="flex items-center gap-3 px-4 py-3.5">
              <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="plus-circle" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="flex-1 min-w-0 text-[15px] text-foreground truncate">100以内加法</span>
              <span class="text-[14px] font-bold shrink-0" style="color: #2D3436;">520题</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
            </div>
            <div class="h-px bg-border mx-4"></div>
            <div class="flex items-center gap-3 px-4 py-3.5">
              <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="minus-circle" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="flex-1 min-w-0 text-[15px] text-foreground truncate">100以内减法</span>
              <span class="text-[14px] font-bold shrink-0" style="color: #2D3436;">480题</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
            </div>
          </div>
        </div>

        <!-- Module 2: 二年级下册·乘法口诀 -->
        <div class="mb-5">
          <div class="flex items-center gap-2 mb-2.5">
            <div class="w-1 h-4 rounded-full" style="background-color: #FF8A3D;"></div>
            <h2 class="text-[14px] font-bold text-foreground">二年级下册·乘法口诀</h2>
          </div>
          <div class="bg-white rounded-xl overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
            <div class="flex items-center gap-3 px-4 py-3.5">
              <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="x-circle" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="flex-1 min-w-0 text-[15px] text-foreground truncate">乘法口诀表</span>
              <span class="text-[14px] font-bold shrink-0" style="color: #2D3436;">680题</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
            </div>
            <div class="h-px bg-border mx-4"></div>
            <div class="flex items-center gap-3 px-4 py-3.5">
              <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="divide-circle" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="flex-1 min-w-0 text-[15px] text-foreground truncate">表内除法</span>
              <span class="text-[14px] font-bold shrink-0" style="color: #2D3436;">520题</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
            </div>
          </div>
        </div>

        <!-- Module 3: 三年级上册·混合运算 -->
        <div class="mb-5">
          <div class="flex items-center gap-2 mb-2.5">
            <div class="w-1 h-4 rounded-full" style="background-color: #FF8A3D;"></div>
            <h2 class="text-[14px] font-bold text-foreground">三年级上册·混合运算</h2>
          </div>
          <div class="bg-white rounded-xl overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
            <div class="flex items-center gap-3 px-4 py-3.5">
              <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="sigma" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="flex-1 min-w-0 text-[15px] text-foreground truncate">混合运算</span>
              <span class="text-[14px] font-bold shrink-0" style="color: #2D3436;">400题</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
            </div>
          </div>
        </div>

        <!-- Module 4: 三年级下册·分数初步 -->
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-2.5">
            <div class="w-1 h-4 rounded-full" style="background-color: #FF8A3D;"></div>
            <h2 class="text-[14px] font-bold text-foreground">三年级下册·分数初步</h2>
          </div>
          <div class="bg-white rounded-xl overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
            <div class="flex items-center gap-3 px-4 py-3.5">
              <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="fraction" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="flex-1 min-w-0 text-[15px] text-foreground truncate">分数初步认识</span>
              <span class="text-[14px] font-bold shrink-0" style="color: #2D3436;">600题</span>
              <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: #B2BAC2;"></i>
            </div>
          </div>
        </div>

      </section>
    </main>

    <!-- 7. Bottom navigation -->
    <nav data-mobile-nav="global" class="w-full h-[64px]"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a data-nav-key="home" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a><a data-nav-key="manage" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="building-2" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">管理</span></a><a data-nav-key="review" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="clipboard-check" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">审核</span></a><a data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #F8F9FB;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F2F5;
  --brand-muted-foreground: #636E72;
  --brand-border: #ECEFF2;
  --brand-input: #DFE3E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 6px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECEFF2; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
