<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目详情</title>
    <style id="theme-vars">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top navigation -->
      <header class="px-4 h-[48px] flex items-center justify-between">
        <button class="w-9 h-9 flex items-center justify-center -ml-1.5" aria-label="返回">
          <i data-lucide="arrow-left" class="w-6 h-6" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-semibold text-foreground">题目详情</h1>
        <button class="text-[15px] font-semibold" style="color: #FF8A3D;">保存</button>
      </header>

      <!-- 3. Question info card -->
      <section class="px-4 mt-3">
        <div class="bg-white rounded-xl p-5" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center justify-between mb-4">
            <span class="text-[12px]" style="color: #8E8E93;">Q-2024-0312</span>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full" style="background-color: rgba(74,108,247,0.10); color: #4A6CF7;">口算</span>
          </div>
          <p class="text-[20px] font-bold text-foreground text-center leading-relaxed mb-4">23 + 45 = ?</p>
          <div class="flex items-center justify-center gap-1.5 pt-3" style="border-top: 1px solid #ECEFF2;">
            <span class="text-[13px]" style="color: #636E72;">正确答案</span>
            <span class="text-[20px] font-bold" style="color: #FF8A3D;">68</span>
          </div>
        </div>
      </section>

      <!-- 4. Attribute settings -->
      <section class="px-4 mt-4">
        <div class="bg-white rounded-xl overflow-hidden" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <!-- Knowledge point -->
          <div class="flex items-center justify-between px-4 py-3.5">
            <div class="flex items-center gap-2.5">
              <i data-lucide="book-open" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
              <span class="text-[14px]" style="color: #636E72;">知识点</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-[14px] text-foreground">100以内加法</span>
              <i data-lucide="chevron-right" class="w-4 h-4" style="color: #B2BAC2;"></i>
            </div>
          </div>
          <div class="h-px mx-4" style="background-color: #ECEFF2;"></div>
          <!-- Difficulty -->
          <div class="px-4 py-3.5">
            <div class="flex items-center gap-2.5 mb-2.5">
              <i data-lucide="signal" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
              <span class="text-[14px]" style="color: #636E72;">难度</span>
            </div>
            <div class="flex items-center gap-2 pl-[26px]">
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full" style="background-color: #FF8A3D; color: #FFFFFF;">简单</span>
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full" style="background-color: #F0F2F5; color: #636E72;">中等</span>
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full" style="background-color: #F0F2F5; color: #636E72;">困难</span>
            </div>
          </div>
          <div class="h-px mx-4" style="background-color: #ECEFF2;"></div>
          <!-- Applicable grade -->
          <div class="px-4 py-3.5">
            <div class="flex items-center gap-2.5 mb-2.5">
              <i data-lucide="graduation-cap" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
              <span class="text-[14px]" style="color: #636E72;">适用年级</span>
            </div>
            <div class="flex items-center gap-2 pl-[26px] overflow-x-auto no-scrollbar">
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap" style="background-color: #F0F2F5; color: #636E72;">一年级</span>
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap" style="background-color: #F0F2F5; color: #636E72;">二年级</span>
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap" style="background-color: #FF8A3D; color: #FFFFFF;">三年级</span>
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap" style="background-color: #F0F2F5; color: #636E72;">四年级</span>
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap" style="background-color: #F0F2F5; color: #636E72;">五年级</span>
              <span class="text-[13px] font-medium px-3.5 py-1.5 rounded-full whitespace-nowrap" style="background-color: #F0F2F5; color: #636E72;">六年级</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 5. Analysis area -->
      <section class="px-4 mt-4">
        <h2 class="text-[16px] font-bold text-foreground mb-3">题目解析</h2>
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <p class="text-[14px] text-foreground leading-[1.6]">23+45，先算个位3+5=8，再算十位2+4=6，答案是68。</p>
          <div class="flex justify-end mt-3 pt-3" style="border-top: 1px solid #ECEFF2;">
            <a class="text-[13px] font-medium flex items-center gap-1" style="color: #FF8A3D;">
              <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
              编辑解析
            </a>
          </div>
        </div>
      </section>

      <!-- 6. Usage statistics -->
      <section class="px-4 mt-4">
        <h2 class="text-[16px] font-bold text-foreground mb-3">使用统计</h2>
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-3 gap-2">
            <div class="flex flex-col items-center text-center">
              <div class="w-9 h-9 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="repeat" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">156<span class="text-[12px] font-normal" style="color: #636E72;">次</span></span>
              <span class="text-[11px] mt-1" style="color: #636E72;">被引用</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-9 h-9 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(76,175,80,0.12);">
                <i data-lucide="check-circle" class="w-[18px] h-[18px]" style="color: #4CAF50;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">85<span class="text-[12px] font-normal" style="color: #636E72;">%</span></span>
              <span class="text-[11px] mt-1" style="color: #636E72;">平均正确率</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-9 h-9 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(77,171,247,0.12);">
                <i data-lucide="timer" class="w-[18px] h-[18px]" style="color: #4DABF7;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">12<span class="text-[12px] font-normal" style="color: #636E72;">秒</span></span>
              <span class="text-[11px] mt-1" style="color: #636E72;">平均用时</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 7. Bottom action buttons -->
      <section class="px-4 mt-6 mb-6">
        <div class="flex items-center gap-3">
          <button class="flex-1 h-11 rounded-full text-[15px] font-semibold flex items-center justify-center gap-1.5" style="background-color: #FF8A3D; color: #FFFFFF;">
            <i data-lucide="pencil" class="w-4 h-4"></i>
            编辑题目
          </button>
          <button class="flex-1 h-11 rounded-full text-[15px] font-semibold flex items-center justify-center gap-1.5 bg-white" style="border: 1px solid #FF3B30; color: #FF3B30;">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
            删除题目
          </button>
        </div>
      </section>

      <!-- 8. Bottom safe area -->
      <div style="height: 24px;"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #F8F9FB;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F2F5;
  --brand-muted-foreground: #636E72;
  --brand-border: #ECEFF2;
  --brand-input: #DFE3E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 6px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }
nav[data-mobile-nav] a:not([data-active="true"]) { color: #636E72; }
nav[data-mobile-nav] a:not([data-active="true"]) svg { color: #636E72; stroke: #636E72; }
</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECEFF2; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
