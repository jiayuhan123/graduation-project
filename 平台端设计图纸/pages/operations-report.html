<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营报告</title>
    <style id="theme-vars">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Top header: back + center title + export -->
      <header class="px-4 pt-3 pb-2 flex items-center justify-between">
        <button class="w-9 h-9 flex items-center justify-center shrink-0" aria-label="返回">
          <i data-lucide="arrow-left" class="w-5 h-5" style="color: #2D3436;"></i>
        </button>
        <h1 class="text-[17px] font-bold tracking-tight text-foreground">运营报告</h1>
        <button class="w-9 h-9 flex items-center justify-center shrink-0" aria-label="导出">
          <i data-lucide="download" class="w-5 h-5" style="color: #FF8A3D;"></i>
        </button>
      </header>

      <!-- 3. Time selector capsules -->
      <section class="px-4 mt-2">
        <div class="flex items-center gap-2">
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium shrink-0" style="background-color: #FF8A3D; color: #FFFFFF;">本周</button>
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium shrink-0" style="background-color: #F0F2F5; color: #636E72;">本月</button>
          <button class="px-4 py-1.5 rounded-full text-[13px] font-medium shrink-0" style="background-color: #F0F2F5; color: #636E72;">本学期</button>
        </div>
      </section>

      <!-- 4. Core metrics card -->
      <section class="px-4 mt-4">
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-[16px] font-bold text-foreground">核心指标</h2>
            <span class="text-[13px] text-muted-foreground">本周</span>
          </div>
          <div class="grid grid-cols-4 gap-2">
            <div class="flex flex-col items-center text-center">
              <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="school" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">28</span>
              <span class="text-[11px] text-muted-foreground mt-1">总学校</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(77,171,247,0.12);">
                <i data-lucide="users" class="w-5 h-5" style="color: #4DABF7;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">156</span>
              <span class="text-[11px] text-muted-foreground mt-1">总教师</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(76,175,80,0.12);">
                <i data-lucide="graduation-cap" class="w-5 h-5" style="color: #4CAF50;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">8,520</span>
              <span class="text-[11px] text-muted-foreground mt-1">总学生</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(151,117,250,0.12);">
                <i data-lucide="activity" class="w-5 h-5" style="color: #9775FA;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">3,245</span>
              <span class="text-[11px] text-muted-foreground mt-1">周活跃</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 5. Growth trend (bar chart) -->
      <section class="px-4 mt-6">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="trending-up" class="w-5 h-5" style="color: #FF8A3D;"></i>
          <h2 class="text-[16px] font-bold text-foreground">增长趋势</h2>
        </div>
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-sm" style="background-color: #FF8A3D;"></span>
              <span class="text-[13px] text-foreground">新增学生</span>
            </div>
            <span class="text-[12px] text-muted-foreground">单位：人</span>
          </div>
          <!-- Bar chart -->
          <div class="flex items-end justify-between gap-2" style="height: 140px;">
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <span class="text-[11px] font-medium text-muted-foreground mb-1">50</span>
              <div class="w-full rounded-t-md" style="height: 41.67%; background-color: #FF8A3D; min-height: 4px;"></div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <span class="text-[11px] font-medium text-muted-foreground mb-1">80</span>
              <div class="w-full rounded-t-md" style="height: 66.67%; background-color: #FF8A3D; min-height: 4px;"></div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <span class="text-[11px] font-medium text-muted-foreground mb-1">60</span>
              <div class="w-full rounded-t-md" style="height: 50%; background-color: #FF8A3D; min-height: 4px;"></div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <span class="text-[11px] font-medium text-muted-foreground mb-1">90</span>
              <div class="w-full rounded-t-md" style="height: 75%; background-color: #FF8A3D; min-height: 4px;"></div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <span class="text-[11px] font-medium text-foreground mb-1">120</span>
              <div class="w-full rounded-t-md" style="height: 100%; background-color: #FF8A3D; min-height: 4px;"></div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <span class="text-[11px] font-medium text-muted-foreground mb-1">100</span>
              <div class="w-full rounded-t-md" style="height: 83.33%; background-color: #FF8A3D; min-height: 4px;"></div>
            </div>
            <div class="flex-1 flex flex-col items-center justify-end h-full">
              <span class="text-[11px] font-medium text-muted-foreground mb-1">70</span>
              <div class="w-full rounded-t-md" style="height: 58.33%; background-color: #FF8A3D; min-height: 4px;"></div>
            </div>
          </div>
          <!-- Weekday labels -->
          <div class="flex items-center justify-between gap-2 mt-2">
            <span class="flex-1 text-center text-[11px] text-muted-foreground">周一</span>
            <span class="flex-1 text-center text-[11px] text-muted-foreground">周二</span>
            <span class="flex-1 text-center text-[11px] text-muted-foreground">周三</span>
            <span class="flex-1 text-center text-[11px] text-muted-foreground">周四</span>
            <span class="flex-1 text-center text-[11px] text-muted-foreground">周五</span>
            <span class="flex-1 text-center text-[11px] text-muted-foreground">周六</span>
            <span class="flex-1 text-center text-[11px] text-muted-foreground">周日</span>
          </div>
        </div>
      </section>

      <!-- 6. Usage statistics (progress bars) -->
      <section class="px-4 mt-6">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="bar-chart-2" class="w-5 h-5" style="color: #FF8A3D;"></i>
          <h2 class="text-[16px] font-bold text-foreground">功能使用</h2>
        </div>
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <!-- Row 1: 口算练习 -->
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background-color: rgba(255,138,61,0.12);">
              <i data-lucide="calculator" class="w-[18px] h-[18px]" style="color: #FF8A3D;"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[14px] text-foreground">口算练习</span>
                <span class="text-[12px] text-muted-foreground">3,200次 · 80%</span>
              </div>
              <div class="w-full rounded-full" style="height: 6px; background-color: #F0F2F5;">
                <div class="rounded-full" style="width: 80%; height: 6px; background-color: #FF8A3D;"></div>
              </div>
            </div>
          </div>
          <div class="h-px bg-border my-3.5"></div>
          <!-- Row 2: 拍照批改 -->
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background-color: rgba(77,171,247,0.12);">
              <i data-lucide="camera" class="w-[18px] h-[18px]" style="color: #4DABF7;"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[14px] text-foreground">拍照批改</span>
                <span class="text-[12px] text-muted-foreground">1,850次 · 60%</span>
              </div>
              <div class="w-full rounded-full" style="height: 6px; background-color: #F0F2F5;">
                <div class="rounded-full" style="width: 60%; height: 6px; background-color: #FF8A3D;"></div>
              </div>
            </div>
          </div>
          <div class="h-px bg-border my-3.5"></div>
          <!-- Row 3: 闯关挑战 -->
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background-color: rgba(151,117,250,0.12);">
              <i data-lucide="trophy" class="w-[18px] h-[18px]" style="color: #9775FA;"></i>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[14px] text-foreground">闯关挑战</span>
                <span class="text-[12px] text-muted-foreground">2,400次 · 75%</span>
              </div>
              <div class="w-full rounded-full" style="height: 6px; background-color: #F0F2F5;">
                <div class="rounded-full" style="width: 75%; height: 6px; background-color: #FF8A3D;"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 7. Content quality -->
      <section class="px-4 mt-6">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="badge-check" class="w-5 h-5" style="color: #FF8A3D;"></i>
          <h2 class="text-[16px] font-bold text-foreground">内容质量</h2>
        </div>
        <div class="bg-white rounded-xl p-4" style="box-shadow: 0 1px 4px rgba(45,52,54,0.06);">
          <div class="grid grid-cols-3 gap-2">
            <div class="flex flex-col items-center text-center">
              <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(255,138,61,0.12);">
                <i data-lucide="library" class="w-5 h-5" style="color: #FF8A3D;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">3,200</span>
              <span class="text-[11px] text-muted-foreground mt-1">题库总量</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(76,175,80,0.12);">
                <i data-lucide="check-circle" class="w-5 h-5" style="color: #4CAF50;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">96%</span>
              <span class="text-[11px] text-muted-foreground mt-1">审核通过率</span>
            </div>
            <div class="flex flex-col items-center text-center">
              <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: rgba(151,117,250,0.12);">
                <i data-lucide="gauge" class="w-5 h-5" style="color: #9775FA;"></i>
              </div>
              <span class="text-[18px] font-bold text-foreground leading-none">72%</span>
              <span class="text-[11px] text-muted-foreground mt-1">平均使用率</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 8. Download report button -->
      <section class="px-4 mt-6">
        <button class="w-full flex items-center justify-center gap-2 py-3 rounded-full" style="background-color: #FFFFFF; border: 1.5px solid #FF8A3D; color: #FF8A3D;">
          <i data-lucide="download" class="w-5 h-5"></i>
          <span class="text-[15px] font-semibold">下载报告</span>
        </button>
      </section>

      <!-- 9. Bottom safe area -->
      <div style="height: 32px;"></div>
    </main>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #F8F9FB;
  --brand-foreground: #2D3436;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2D3436;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2D3436;
  --brand-primary: #FF8A3D;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F2F5;
  --brand-muted-foreground: #636E72;
  --brand-border: #ECEFF2;
  --brand-input: #DFE3E8;
  --brand-ring: #FF8A3D;
  --brand-radius-sm: 6px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a[data-active="true"] { color: #FF8A3D; }
nav[data-mobile-nav] a[data-active="true"] svg { color: #FF8A3D; stroke: #FF8A3D; }

</style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #ECEFF2; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
