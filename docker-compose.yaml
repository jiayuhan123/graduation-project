name: ${COMPOSE_PROJECT_NAME:-primary-math-platform}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?请设置 DB_USERNAME}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?请设置 DB_PASSWORD}"
      POSTGRES_DB: ${MONOLITH_DB_NAME:-monolith_db}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    networks:
      - local-net

  redis:
    image: redis:8.0
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    networks:
      - local-net

  rabbitmq:
    image: rabbitmq:4.3.4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?请设置 RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?请设置 RABBITMQ_PASSWORD}"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 320m
    networks:
      - local-net

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    image: primary-math-platform-agent:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AI_AGENT_BRIDGE_TOKEN: "${AI_AGENT_BRIDGE_TOKEN:-}"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-}"
      AI_MODEL_BASE_URL: "${AI_MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      AI_MODEL_API_KEY: "${AI_MODEL_API_KEY:-}"
      AI_MODEL_NAME: "${AI_MODEL_NAME:-qwen3.7-plus}"
      AI_EMBEDDING_MODEL: "${AI_EMBEDDING_MODEL:-qwen3.7-text-embedding}"
      AI_EMBEDDING_DIMENSIONS: "${AI_EMBEDDING_DIMENSIONS:-1024}"
      AI_EMBEDDING_BATCH_SIZE: "${AI_EMBEDDING_BATCH_SIZE:-20}"
      AI_MODEL_TIMEOUT_SECONDS: "${AI_MODEL_TIMEOUT_SECONDS:-60}"
      AI_MAX_TOOL_ROUNDS: "${AI_MAX_TOOL_ROUNDS:-4}"
      AI_DB_HOST: postgres
      AI_DB_PORT: "5432"
      AI_DB_USERNAME: "${DB_USERNAME:?请设置 DB_USERNAME}"
      AI_DB_PASSWORD: "${DB_PASSWORD:?请设置 DB_PASSWORD}"
      AI_DB_NAME: "${MONOLITH_DB_NAME:-monolith_db}"
      AI_DATABASE_POOL_MIN_SIZE: "${AI_DATABASE_POOL_MIN_SIZE:-2}"
      AI_DATABASE_POOL_MAX_SIZE: "${AI_DATABASE_POOL_MAX_SIZE:-10}"
      AI_REDIS_HOST: redis
      AI_REDIS_PORT: "6379"
      AI_REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      AI_REDIS_DATABASE: "${REDIS_DATABASE:-0}"
      AI_CONVERSATION_MEMORY_TTL_SECONDS: "${AI_CONVERSATION_MEMORY_TTL_SECONDS:-604800}"
      AI_CONVERSATION_MAX_MESSAGES: "${AI_CONVERSATION_MAX_MESSAGES:-20}"
      AI_CONTEXT_HISTORY_CHARS: "${AI_CONTEXT_HISTORY_CHARS:-24000}"
      AI_RAG_TOP_K: "${AI_RAG_TOP_K:-6}"
      AI_RAG_CANDIDATE_K: "${AI_RAG_CANDIDATE_K:-24}"
      AI_RAG_MIN_SCORE: "${AI_RAG_MIN_SCORE:-0.5}"
      AI_MEMORY_TOP_K: "${AI_MEMORY_TOP_K:-4}"
      AI_MEMORY_RETENTION_DAYS: "${AI_MEMORY_RETENTION_DAYS:-180}"
      AI_TRACE_RETENTION_DAYS: "${AI_TRACE_RETENTION_DAYS:-90}"
      AI_MAX_REQUESTS_PER_MINUTE: "${AI_MAX_REQUESTS_PER_MINUTE:-20}"
      AI_MAX_CONCURRENT_RUNS: "${AI_MAX_CONCURRENT_RUNS:-32}"
      AI_DOCS_ENABLED: "${AI_DOCS_ENABLED:-false}"
      JAVA_AI_TOOL_BASE_URL: "${JAVA_AI_TOOL_BASE_URL:-http://host.docker.internal:10000}"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${AI_AGENT_PORT:-8100}:8100"
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    networks:
      - local-net

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    extra_hosts:
      # 允许容器内的 Prometheus 抓取在宿主机运行的 Java 服务。
      - host.docker.internal:host-gateway
    mem_limit: 192m
    networks:
      - local-net

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 160m
    networks:
      - local-net

  # CI 控制器与其余服务一起启动。
  # Docker socket 仅允许受信任的 Jenkins Job 使用，详见 deploy/server/README.md。
  jenkins:
    build:
      context: ./deploy/jenkins
      dockerfile: Dockerfile
    image: primary-math-platform-jenkins:lts-jdk21
    restart: unless-stopped
    environment:
      JAVA_OPTS: "${JENKINS_JAVA_OPTS:--Xms128m -Xmx320m -XX:MaxMetaspaceSize=160m -Djava.awt.headless=true} -Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_config/casc.yaml
      JENKINS_ADMIN_USERNAME: "${JENKINS_ADMIN_USERNAME:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?请设置 JENKINS_ADMIN_PASSWORD}"
      TZ: ${TZ:-Asia/Shanghai}
    # 使用 Docker socket 所属组，而非让 Jenkins 主进程以 root 身份运行。
    # 服务器必须将 DOCKER_GID 设为 `stat -c '%g' /var/run/docker.sock` 的输出。
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "127.0.0.1:${JENKINS_WEB_PORT:-8080}:8080"
    volumes:
      - ./data/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/jenkins/casc.yaml:/var/jenkins_config/casc.yaml:ro
    mem_limit: 640m
    networks:
      - local-net

networks:
  local-net:
    driver: bridge
