name: ${COMPOSE_PROJECT_NAME:-primary-math-platform}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?请设置 DB_USERNAME}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?请设置 DB_PASSWORD}"
      POSTGRES_DB: ${MONOLITH_DB_NAME:-monolith_db}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    networks:
      - local-net

  redis:
    image: redis:8.0
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}"
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    networks:
      - local-net

  rabbitmq:
    image: rabbitmq:4.3.4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?请设置 RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?请设置 RABBITMQ_PASSWORD}"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 320m
    networks:
      - local-net

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    extra_hosts:
      # 允许容器内的 Prometheus 抓取在宿主机运行的 Java 服务。
      - host.docker.internal:host-gateway
    mem_limit: 192m
    networks:
      - local-net

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 160m
    networks:
      - local-net

  # CI 控制器与其余服务一起启动。
  # Docker socket 仅允许受信任的 Jenkins Job 使用，详见 deploy/server/README.md。
  jenkins:
    build:
      context: ./deploy/jenkins
      dockerfile: Dockerfile
    image: primary-math-platform-jenkins:lts-jdk21
    restart: unless-stopped
    environment:
      JAVA_OPTS: "${JENKINS_JAVA_OPTS:--Xms128m -Xmx320m -XX:MaxMetaspaceSize=160m -Djava.awt.headless=true} -Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /var/jenkins_config/casc.yaml
      JENKINS_ADMIN_USERNAME: "${JENKINS_ADMIN_USERNAME:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?请设置 JENKINS_ADMIN_PASSWORD}"
      TZ: ${TZ:-Asia/Shanghai}
    # 使用 Docker socket 所属组，而非让 Jenkins 主进程以 root 身份运行。
    # 服务器必须将 DOCKER_GID 设为 `stat -c '%g' /var/run/docker.sock` 的输出。
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "127.0.0.1:${JENKINS_WEB_PORT:-8080}:8080"
    volumes:
      - ./data/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/jenkins/casc.yaml:/var/jenkins_config/casc.yaml:ro
    mem_limit: 640m
    networks:
      - local-net

networks:
  local-net:
    driver: bridge
