services:
  # =========================================================================
  # 1. PostgreSQL (业务数据库) - 升级为最新的 18 系列
  # =========================================================================
  postgres:
    image: postgres:18
    container_name: micro-postgres
    restart: always
    mem_limit: 256m
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "111111"
      POSTGRES_DB: user_db
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
      # 仅在首次初始化空数据目录时创建各微服务独立数据库。
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - micro-net


  # =========================================================================
  # 2. Redis 缓存 - 升级为最新的 8.0 极速版 (或 7.4 稳定版)
  # =========================================================================
  redis:
    image: redis:8.0
    container_name: micro-redis
    restart: always
    mem_limit: 128m
    command: >
      redis-server 
      --requirepass 111111 
      --appendonly yes 
      --maxmemory 96mb 
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - micro-net

  # =========================================================================
  # 3. Nacos 注册 & 配置中心 - 升级为 2026 年最新一代 3.2.2 版本 (支持 AI、命名空间体验优化)
  # =========================================================================
  nacos:
    image: nacos/nacos-server:v3.2.2
    container_name: micro-nacos
    restart: always
    mem_limit: 512m
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
      NACOS_AUTH_IDENTITY_KEY: nacos_identity_project
      NACOS_AUTH_IDENTITY_VALUE: nacos_identity_value_111111
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"  # API 端口
      - "8847:8080"  # 3.x 独立控制台端口
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/data:/home/nacos/data
    networks:
      - micro-net

  # =========================================================================
  # 4. RabbitMQ 队列 - 固定到当前受支持的 4.3.4 管理版
  # =========================================================================
  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: micro-rabbitmq
    restart: always
    mem_limit: 350m
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: "111111"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks:
      - micro-net

  # =========================================================================
  # 5. Jenkins - 自动化构建部署 (极致压缩版)
  # =========================================================================
  jenkins:
    image: jenkins/jenkins:lts
    container_name: micro-jenkins
    restart: always
    # 容器总限制压缩到 800m
    mem_limit: 800m
    user: root 
    environment:
      # 进一步压缩 Jenkins 自身的 JVM 堆内存为 256M
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./data/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # (可选) 如果你以后想把宿主机的 Maven 仓库挂进去，可以加下面这行，加速构建
      # - ./data/maven/repo:/root/.m2/repository
    networks:
      - micro-net

networks:
  micro-net:
    driver: bridge
