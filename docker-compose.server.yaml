# 单机服务器覆盖配置：与 docker-compose.yaml 一起使用。
#
# 目标机器为 4C / 4G：所有服务默认启动，所有管理端口仍仅绑定在宿主机 127.0.0.1。

x-server-logging: &server-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    mem_limit: 256m
    environment:
      POSTGRES_USER: "${DB_USERNAME:?请在服务器 .env 中设置 DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?请在服务器 .env 中设置 DB_PASSWORD}"
    logging: *server-logging

  redis:
    mem_limit: 128m
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?请在服务器 .env 中设置 REDIS_PASSWORD}"
      - --appendonly
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-64mb}"
      - --maxmemory-policy
      - allkeys-lru
    logging: *server-logging

  nacos:
    mem_limit: 512m
    environment:
      # 服务器环境强制开启 Nacos 默认鉴权；令牌必须是大于 32 字符原文的 Base64 编码值。
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: "nacos"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: "${NACOS_AUTH_IDENTITY_KEY:?请在服务器 .env 中设置 NACOS_AUTH_IDENTITY_KEY}"
      NACOS_AUTH_IDENTITY_VALUE: "${NACOS_AUTH_IDENTITY_VALUE:?请在服务器 .env 中设置 NACOS_AUTH_IDENTITY_VALUE}"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?请在服务器 .env 中设置 NACOS_AUTH_TOKEN}"
    logging: *server-logging

  rabbitmq:
    mem_limit: 320m
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:?请在服务器 .env 中设置 RABBITMQ_USERNAME}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?请在服务器 .env 中设置 RABBITMQ_PASSWORD}"
    logging: *server-logging

  # 监控服务与基础设施一起启动。
  prometheus:
    mem_limit: 192m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-7d}
    logging: *server-logging

  grafana:
    mem_limit: 160m
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?请在服务器 .env 中设置 GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?请在服务器 .env 中设置 GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: "${TZ:-Asia/Shanghai}"
    logging: *server-logging

  # Jenkins 控制器默认启动；构建产生的 Docker 子容器不受本条内存限制约束。
  jenkins:
    mem_limit: 640m
    environment:
      JENKINS_ADMIN_USERNAME: "${JENKINS_ADMIN_USERNAME:-admin}"
      JENKINS_ADMIN_PASSWORD: "${JENKINS_ADMIN_PASSWORD:?请在服务器 .env 中设置 JENKINS_ADMIN_PASSWORD}"
    logging: *server-logging
