<div id="er-practice-answering-revised" class="chen-er-root">
  <style>
    #er-practice-answering-revised {
      color: var(--foreground);
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      width: 100%;
    }
    #er-practice-answering-revised h2 {
      margin: 0 0 10px;
      text-align: center;
      font-weight: 500;
    }
    #er-practice-answering-revised .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    #er-practice-answering-revised .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #er-practice-answering-revised .legend svg {
      width: 42px;
      height: 28px;
    }
    #er-practice-answering-revised .diagram {
      display: block;
      width: 100%;
      max-width: 720px;
      height: auto;
      margin: 0 auto;
      overflow: visible;
    }
    #er-practice-answering-revised .entity {
      fill: color-mix(in srgb, var(--viz-series-1) 14%, var(--background));
      stroke: var(--viz-series-1);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    #er-practice-answering-revised .relation {
      fill: color-mix(in srgb, var(--viz-series-2) 16%, var(--background));
      stroke: var(--viz-series-2);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    #er-practice-answering-revised .attribute {
      fill: color-mix(in srgb, var(--muted) 72%, var(--background));
      stroke: var(--border);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }
    #er-practice-answering-revised .link {
      fill: none;
      stroke: var(--foreground);
      stroke-width: 1.35;
      opacity: 0.75;
      vector-effect: non-scaling-stroke;
    }
    #er-practice-answering-revised text {
      fill: var(--foreground);
      font-size: 16px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    #er-practice-answering-revised .node-label { font-weight: 500; }
    #er-practice-answering-revised .cardinality {
      font-size: 14px;
      font-weight: 500;
      paint-order: stroke;
      stroke: var(--background);
      stroke-width: 5px;
      stroke-linejoin: round;
    }
    #er-practice-answering-revised .key-label { text-decoration: underline; }
    #er-practice-answering-revised .reuse { stroke-dasharray: 5 4; }
    #er-practice-answering-revised .panel-note {
      fill: var(--muted-foreground);
      font-size: 14px;
    }
    #er-practice-answering-revised .diagram-mobile { display: none; }
    @media (max-width: 520px) {
      #er-practice-answering-revised .diagram-desktop { display: none; }
      #er-practice-answering-revised .diagram-mobile { display: block; }
    }
  </style>
