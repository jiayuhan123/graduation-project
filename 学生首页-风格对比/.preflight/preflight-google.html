<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight Google</title>
    <style id="theme-vars">
/* Google Material 3 Style Theme - Tonal, colorful, structured */
:root {
  /* Brand primary - Google blue */
  --gg-background: #FEF7FF;
  --gg-foreground: #1D1B20;
  --gg-card: #FFFFFF;
  --gg-card-foreground: #1D1B20;
  --gg-popover: #FFFFFF;
  --gg-popover-foreground: #1D1B20;
  --gg-primary: #6750A4;
  --gg-primary-foreground: #FFFFFF;
  --gg-muted: #E7E0EC;
  --gg-muted-foreground: #625B71;
  --gg-border: #CAC4D0;
  --gg-input: #CAC4D0;
  --gg-ring: #6750A4;

  /* State colors */
  --state-success: #386A20;
  --state-warning: #7D5700;
  --state-error: #B3261E;
  --state-info: #00639B;

  /* Radius scale - Material 3 shapes */
  --gg-radius-sm: 8px;
  --gg-radius-md: 12px;
  --gg-radius-lg: 16px;

  /* Typography */
  --gg-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--gg-background);
    --color-foreground: var(--gg-foreground);
    --color-card: var(--gg-card);
    --color-card-foreground: var(--gg-card-foreground);
    --color-popover: var(--gg-popover);
    --color-popover-foreground: var(--gg-popover-foreground);
    --color-primary: var(--gg-primary);
    --color-primary-foreground: var(--gg-primary-foreground);
    --color-muted: var(--gg-muted);
    --color-muted-foreground: var(--gg-muted-foreground);
    --color-border: var(--gg-border);
    --color-input: var(--gg-input);
    --color-ring: var(--gg-ring);
    --radius-sm: var(--gg-radius-sm);
    --radius-md: var(--gg-radius-md);
    --radius-lg: var(--gg-radius-lg);
  }
  @layer base {
    body { background: var(--gg-background); color: var(--gg-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
