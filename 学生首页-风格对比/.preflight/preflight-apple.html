<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight Apple</title>
    <style id="theme-vars">
/* Apple Style Theme - Clean, minimal, frosted */
:root {
  /* Brand primary - Apple blue */
  --ap-background: #F2F2F7;
  --ap-foreground: #1C1C1E;
  --ap-card: #FFFFFF;
  --ap-card-foreground: #1C1C1E;
  --ap-popover: #F2F2F7;
  --ap-popover-foreground: #1C1C1E;
  --ap-primary: #007AFF;
  --ap-primary-foreground: #FFFFFF;
  --ap-muted: #E5E5EA;
  --ap-muted-foreground: #8E8E93;
  --ap-border: #E5E5EA;
  --ap-input: #C7C7CC;
  --ap-ring: #007AFF;

  /* State colors */
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  /* Radius scale - Apple continuous corners */
  --ap-radius-sm: 8px;
  --ap-radius-md: 12px;
  --ap-radius-lg: 20px;

  /* Typography */
  --ap-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ap-background);
    --color-foreground: var(--ap-foreground);
    --color-card: var(--ap-card);
    --color-card-foreground: var(--ap-card-foreground);
    --color-popover: var(--ap-popover);
    --color-popover-foreground: var(--ap-popover-foreground);
    --color-primary: var(--ap-primary);
    --color-primary-foreground: var(--ap-primary-foreground);
    --color-muted: var(--ap-muted);
    --color-muted-foreground: var(--ap-muted-foreground);
    --color-border: var(--ap-border);
    --color-input: var(--ap-input);
    --color-ring: var(--ap-ring);
    --radius-sm: var(--ap-radius-sm);
    --radius-md: var(--ap-radius-md);
    --radius-lg: var(--ap-radius-lg);
  }
  @layer base {
    body { background: var(--ap-background); color: var(--ap-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
