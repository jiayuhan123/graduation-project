<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生首页-小红书风格</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- 1. Status bar spacer -->
      <div style="height: 44px;"></div>

      <!-- 2. Large title header with search box -->
      <header class="px-4 pt-4 pb-2">
        <div class="flex items-start justify-between mb-3">
          <div>
            <h1 class="text-[24px] font-bold tracking-tight text-foreground">你好，小明</h1>
            <p class="text-[13px] text-muted-foreground mt-0.5">三年级 · 上册</p>
          </div>
          <button class="w-9 h-9 rounded-full bg-muted flex items-center justify-center shrink-0" aria-label="设置">
            <i data-lucide="settings" class="w-[18px] h-[18px] text-foreground"></i>
          </button>
        </div>
        <div class="flex items-center gap-2 h-9 px-3.5 rounded-full bg-muted">
          <i data-lucide="search" class="w-4 h-4 text-muted-foreground shrink-0"></i>
          <span class="text-[13px] text-muted-foreground">搜索课程、题目、闯关</span>
        </div>
      </header>

      <!-- 3. Today's summary card -->
      <section class="px-4 mt-3 mb-4">
        <div class="bg-card rounded-[12px] p-4 shadow-sm">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-[16px] font-semibold text-card-foreground">今日学习</h2>
            <span class="text-[12px] text-muted-foreground">9月3日 周三</span>
          </div>
          <div class="flex items-center justify-between mb-3">
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] font-bold text-foreground leading-none">24</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">答题</span>
            </div>
            <div class="w-px h-7 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] font-bold text-foreground leading-none">85%</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">正确率</span>
            </div>
            <div class="w-px h-7 bg-border"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[20px] font-bold text-foreground leading-none">7天</span>
              <span class="text-[11px] text-muted-foreground mt-1.5">连续</span>
            </div>
          </div>
          <div class="w-full h-1.5 rounded-full bg-muted overflow-hidden">
            <div class="h-full rounded-full" style="width: 60%; background-color: #FE2C55;"></div>
          </div>
        </div>
      </section>

      <!-- 4. Core function entries (gradient color-block cards) -->
      <section class="px-4 mb-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-[12px] p-3.5 flex flex-col justify-between h-[96px] shadow-sm" style="background: linear-gradient(135deg, #FF6A85, #FE2C55);">
            <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">
              <i data-lucide="camera" class="w-5 h-5 text-white"></i>
            </div>
            <div>
              <h3 class="text-[14px] font-bold text-white">拍照批改</h3>
              <p class="text-[11px] text-white/85 mt-0.5">拍下作业·智能批改</p>
            </div>
          </div>
          <div class="rounded-[12px] p-3.5 flex flex-col justify-between h-[96px] shadow-sm" style="background: linear-gradient(135deg, #FFB347, #FF8A5C);">
            <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">
              <i data-lucide="pencil" class="w-5 h-5 text-white"></i>
            </div>
            <div>
              <h3 class="text-[14px] font-bold text-white">口算练习</h3>
              <p class="text-[11px] text-white/85 mt-0.5">个性化·智能推荐</p>
            </div>
          </div>
          <div class="col-span-2 rounded-[12px] p-3.5 flex items-center gap-3 h-[72px] shadow-sm" style="background: linear-gradient(135deg, #FFD86B, #FF9F4D);">
            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center shrink-0">
              <i data-lucide="gamepad-2" class="w-5 h-5 text-white"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-[15px] font-bold text-white">闯关挑战</h3>
              <p class="text-[11px] text-white/85 mt-0.5">单人/团队闯关</p>
            </div>
            <span class="text-[11px] font-medium text-white px-2.5 py-1 rounded-full bg-white/20 shrink-0">去挑战</span>
          </div>
        </div>
      </section>

      <!-- 5. Learning dynamics (waterfall double-column grid) -->
      <section class="px-4 mb-4">
        <h2 class="text-[17px] font-bold text-foreground mb-3">学习动态</h2>
        <div class="grid grid-cols-2 gap-3">
          <!-- card 1 -->
          <div class="bg-card rounded-[12px] shadow-sm overflow-hidden">
            <div class="h-[96px] flex items-center justify-center" style="background: linear-gradient(135deg, #FF6A85, #FE2C55);">
              <i data-lucide="pencil" class="w-8 h-8 text-white/90"></i>
            </div>
            <div class="p-2.5">
              <p class="text-[13px] font-medium text-card-foreground leading-snug">完成 口算练习·两位数加减法</p>
              <p class="text-[11px] text-muted-foreground mt-1">今天 14:30</p>
              <div class="flex items-center justify-between mt-2">
                <div class="w-5 h-5 rounded-full flex items-center justify-center" style="background-color: #FE2C55;">
                  <span class="text-[9px] font-bold text-white">明</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="heart" class="w-3 h-3" style="color: #FE2C55;"></i>
                  <span class="text-[11px] text-muted-foreground">正确 20/24</span>
                </div>
              </div>
            </div>
          </div>
          <!-- card 2 -->
          <div class="bg-card rounded-[12px] shadow-sm overflow-hidden">
            <div class="h-[120px] flex items-center justify-center" style="background: linear-gradient(135deg, #FFD86B, #FF9F4D);">
              <i data-lucide="trophy" class="w-8 h-8 text-white/90"></i>
            </div>
            <div class="p-2.5">
              <p class="text-[13px] font-medium text-card-foreground leading-snug">闯关成功·乘法入门第3关</p>
              <p class="text-[11px] text-muted-foreground mt-1">今天 13:15</p>
              <div class="flex items-center justify-between mt-2">
                <div class="w-5 h-5 rounded-full flex items-center justify-center" style="background-color: #FE2C55;">
                  <span class="text-[9px] font-bold text-white">明</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="heart" class="w-3 h-3" style="color: #FE2C55;"></i>
                  <span class="text-[11px] text-muted-foreground">+50积分</span>
                </div>
              </div>
            </div>
          </div>
          <!-- card 3 (full width, horizontal) -->
          <div class="col-span-2 bg-card rounded-[12px] shadow-sm overflow-hidden flex">
            <div class="w-[120px] shrink-0 flex items-center justify-center" style="background: linear-gradient(135deg, #FF8FA3, #FE2C55);">
              <i data-lucide="camera" class="w-7 h-7 text-white/90"></i>
            </div>
            <div class="flex-1 min-w-0 p-3 flex flex-col justify-center">
              <p class="text-[14px] font-medium text-card-foreground leading-snug">拍照批改·作业本第12页</p>
              <p class="text-[11px] text-muted-foreground mt-1">昨天 19:00</p>
              <div class="flex items-center justify-between mt-2">
                <div class="flex items-center gap-1.5">
                  <div class="w-5 h-5 rounded-full flex items-center justify-center" style="background-color: #FE2C55;">
                    <span class="text-[9px] font-bold text-white">明</span>
                  </div>
                  <span class="text-[11px] text-muted-foreground">小明</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="heart" class="w-3 h-3" style="color: #FE2C55;"></i>
                  <span class="text-[11px] text-muted-foreground">5题已批改</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 6. Achievement cards (colorful gradient blocks) -->
      <section class="px-4 mb-8">
        <div class="grid grid-cols-3 gap-3">
          <div class="rounded-[12px] shadow-sm flex flex-col items-center text-center py-4 px-2" style="background: linear-gradient(135deg, #FF6A85, #FE2C55);">
            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center mb-2">
              <i data-lucide="star" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-[18px] font-bold text-white leading-none">1280</span>
            <span class="text-[11px] text-white/85 mt-1">积分</span>
          </div>
          <div class="rounded-[12px] shadow-sm flex flex-col items-center text-center py-4 px-2" style="background: linear-gradient(135deg, #FFB347, #FF8A5C);">
            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center mb-2">
              <i data-lucide="zap" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-[18px] font-bold text-white leading-none">Lv.5</span>
            <span class="text-[11px] text-white/85 mt-1">等级</span>
          </div>
          <div class="rounded-[12px] shadow-sm flex flex-col items-center text-center py-4 px-2" style="background: linear-gradient(135deg, #D8DCE3, #A8B0BD);">
            <div class="w-10 h-10 rounded-full bg-white/25 flex items-center justify-center mb-2">
              <i data-lucide="medal" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-[18px] font-bold text-white leading-none">白银</span>
            <span class="text-[11px] text-white/85 mt-1">段位</span>
          </div>
        </div>
      </section>
    </main>

    <!-- 7. Bottom navigation -->
    <nav data-mobile-nav="global" class="w-full h-[64px]"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a data-nav-key="home" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a><a data-nav-key="practice" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="pencil" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">练习</span></a><a data-nav-key="games" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="gamepad-2" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">闯关</span></a><a data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>

    <script>lucide.createIcons();</script>
    <style id="style-override">
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #333333;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #333333;
  --brand-primary: #FE2C55;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F6F6F6;
  --brand-muted-foreground: #999999;
  --brand-border: #F0F0F0;
  --brand-input: #E8E8E8;
  --brand-ring: #FE2C55;
  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;
}
body { background: var(--brand-background); color: var(--brand-foreground); }
nav[data-mobile-nav] a { color: #999999; }
nav[data-mobile-nav] [data-active="true"] { color: #FE2C55; }
    </style>
    <style id="critical-layout">
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1 0 auto; }
nav[data-mobile-nav] { flex-shrink: 0; border-top: 1px solid #F0F0F0; background: #FFFFFF; }
img, svg { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; }
</style>
</body>
</html>
