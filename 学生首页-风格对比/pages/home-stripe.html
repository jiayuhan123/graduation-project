<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生首页-Stripe风格</title>
    <style id="theme-vars">
/* Neutral base theme - each page overrides variables per style */
:root {
  --brand-background: #FFFFFF;
  --brand-foreground: #1C1C1E;
  --brand-card: #F7F7FA;
  --brand-card-foreground: #1C1C1E;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #1C1C1E;
  --brand-primary: #4A6CF7;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F0F0F5;
  --brand-muted-foreground: #8E8E93;
  --brand-border: #E5E5EA;
  --brand-input: #D1D1D6;
  --brand-ring: #4A6CF7;

  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #5AC8FA;

  --brand-radius-sm: 8px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-md mx-auto w-full">
      <!-- Gradient header region (Stripe soft violet wash) -->
      <div style="background: linear-gradient(135deg, #F6F5FF 0%, #FFFFFF 100%);">

        <!-- 1. Status bar spacer -->
        <div style="height: 44px;"></div>

        <!-- 2. Large title header -->
        <header class="px-4 pt-6 pb-2 flex items-start justify-between">
          <div>
            <h1 class="text-[28px] font-bold tracking-tight" style="background: linear-gradient(135deg, #635BFF 0%, #7A73FF 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;">你好，小明</h1>
            <p class="text-[15px] mt-0.5" style="color: #697386;">三年级 · 上册</p>
          </div>
          <button class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid #E3E8EE; box-shadow: 0 2px 8px rgba(0,0,0,0.06);" aria-label="设置">
            <i data-lucide="settings" class="w-5 h-5" style="color: #697386;"></i>
          </button>
        </header>
      </div>

      <!-- 3. Today's summary card -->
      <section class="px-4 mt-4 mb-6">
        <div class="rounded-[10px] p-5" style="background: #FFFFFF; border: 1px solid #E3E8EE; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
          <div class="flex items-center justify-between mb-5">
            <h2 class="text-[17px] font-semibold" style="color: #1A1F36;">今日学习</h2>
            <span class="text-[13px]" style="color: #697386; font-variant-numeric: tabular-nums;">9月3日 周三</span>
          </div>
          <div class="flex items-center justify-between mb-4">
            <div class="flex flex-col items-center flex-1">
              <span class="text-[22px] font-semibold leading-none" style="color: #1A1F36; font-variant-numeric: tabular-nums;">24</span>
              <span class="text-[12px] mt-1.5" style="color: #697386;">答题</span>
            </div>
            <div class="w-px h-8" style="background: #E3E8EE;"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[22px] font-semibold leading-none" style="color: #1A1F36; font-variant-numeric: tabular-nums;">85%</span>
              <span class="text-[12px] mt-1.5" style="color: #697386;">正确率</span>
            </div>
            <div class="w-px h-8" style="background: #E3E8EE;"></div>
            <div class="flex flex-col items-center flex-1">
              <span class="text-[22px] font-semibold leading-none" style="color: #1A1F36; font-variant-numeric: tabular-nums;">7天</span>
              <span class="text-[12px] mt-1.5" style="color: #697386;">连续</span>
            </div>
          </div>
          <div class="w-full h-1.5 rounded-full overflow-hidden" style="background: #F6F5FF;">
            <div class="h-full rounded-full" style="width: 60%; background: linear-gradient(90deg, #635BFF, #8B85FF);"></div>
          </div>
        </div>
      </section>

      <!-- 4. Core function entries -->
      <section class="px-4 mb-6 flex flex-col gap-3">
        <div class="rounded-[10px] flex items-center gap-3 h-[72px] px-4" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(227,232,238,0.6); box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
          <div class="w-11 h-11 rounded-[10px] flex items-center justify-center shrink-0" style="background: linear-gradient(135deg, #635BFF, #7A73FF); box-shadow: 0 4px 12px rgba(99,91,255,0.28);">
            <i data-lucide="camera" class="w-5 h-5 text-white"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-[16px] font-semibold" style="color: #1A1F36;">拍照批改</h3>
            <p class="text-[13px]" style="color: #697386;">拍下作业·智能批改</p>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #697386;"></i>
        </div>
        <div class="rounded-[10px] flex items-center gap-3 h-[72px] px-4" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(227,232,238,0.6); box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
          <div class="w-11 h-11 rounded-[10px] flex items-center justify-center shrink-0" style="background: linear-gradient(135deg, #635BFF, #7A73FF); box-shadow: 0 4px 12px rgba(99,91,255,0.28);">
            <i data-lucide="pencil" class="w-5 h-5 text-white"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-[16px] font-semibold" style="color: #1A1F36;">口算练习</h3>
            <p class="text-[13px]" style="color: #697386;">个性化·智能推荐</p>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #697386;"></i>
        </div>
        <div class="rounded-[10px] flex items-center gap-3 h-[72px] px-4" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(227,232,238,0.6); box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
          <div class="w-11 h-11 rounded-[10px] flex items-center justify-center shrink-0" style="background: linear-gradient(135deg, #635BFF, #7A73FF); box-shadow: 0 4px 12px rgba(99,91,255,0.28);">
            <i data-lucide="gamepad-2" class="w-5 h-5 text-white"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h3 class="text-[16px] font-semibold" style="color: #1A1F36;">闯关挑战</h3>
            <p class="text-[13px]" style="color: #697386;">单人/团队闯关</p>
          </div>
          <i data-lucide="chevron-right" class="w-5 h-5 shrink-0" style="color: #697386;"></i>
        </div>
      </section>

      <!-- 5. Learning progress section -->
      <section class="px-4 mb-6">
        <h2 class="text-[20px] font-semibold mb-3" style="color: #1A1F36;">学习动态</h2>
        <div class="rounded-[10px] overflow-hidden" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(227,232,238,0.6); box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: #635BFF;"></div>
            <div class="flex-1 min-w-0">
              <p class="text-[15px] leading-snug" style="color: #1A1F36;">完成 口算练习 · 两位数加减法</p>
              <p class="text-[12px] mt-0.5" style="color: #697386; font-variant-numeric: tabular-nums;">今天 14:30</p>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background: rgba(99,91,255,0.1); color: #635BFF;">正确 20/24</span>
          </div>
          <div class="h-px ml-4" style="background: #E3E8EE;"></div>
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: #16A34A;"></div>
            <div class="flex-1 min-w-0">
              <p class="text-[15px] leading-snug" style="color: #1A1F36;">闯关成功 · 乘法入门 第3关</p>
              <p class="text-[12px] mt-0.5" style="color: #697386; font-variant-numeric: tabular-nums;">今天 13:15</p>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background: rgba(22,163,74,0.1); color: #16A34A;">+50积分</span>
          </div>
          <div class="h-px ml-4" style="background: #E3E8EE;"></div>
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: #635BFF;"></div>
            <div class="flex-1 min-w-0">
              <p class="text-[15px] leading-snug" style="color: #1A1F36;">拍照批改 · 作业本第12页</p>
              <p class="text-[12px] mt-0.5" style="color: #697386; font-variant-numeric: tabular-nums;">昨天 19:00</p>
            </div>
            <span class="text-[12px] font-medium px-2.5 py-1 rounded-full shrink-0" style="background: rgba(99,91,255,0.1); color: #635BFF;">5题已批改</span>
          </div>
        </div>
      </section>

      <!-- 6. Achievement cards -->
      <section class="px-4 mb-8">
        <div class="grid grid-cols-3 gap-3">
          <div class="rounded-[10px] flex flex-col items-center text-center py-4 px-2" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(227,232,238,0.6); box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
            <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background: linear-gradient(135deg, #635BFF, #7A73FF); box-shadow: 0 4px 12px rgba(99,91,255,0.28);">
              <i data-lucide="star" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-[18px] font-bold leading-none" style="color: #1A1F36; font-variant-numeric: tabular-nums;">1280</span>
            <span class="text-[12px] mt-1" style="color: #697386;">积分</span>
          </div>
          <div class="rounded-[10px] flex flex-col items-center text-center py-4 px-2" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(227,232,238,0.6); box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
            <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background: linear-gradient(135deg, #635BFF, #7A73FF); box-shadow: 0 4px 12px rgba(99,91,255,0.28);">
              <i data-lucide="zap" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-[18px] font-bold leading-none" style="color: #1A1F36; font-variant-numeric: tabular-nums;">Lv.5</span>
            <span class="text-[12px] mt-1" style="color: #697386;">等级</span>
          </div>
          <div class="rounded-[10px] flex flex-col items-center text-center py-4 px-2" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(227,232,238,0.6); box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
            <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background: linear-gradient(135deg, #635BFF, #7A73FF); box-shadow: 0 4px 12px rgba(99,91,255,0.28);">
              <i data-lucide="medal" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-[18px] font-bold leading-none" style="color: #1A1F36;">白银</span>
            <span class="text-[12px] mt-1" style="color: #697386;">段位</span>
          </div>
        </div>
      </section>
    </main>

    <!-- 7. Bottom navigation -->
    <nav data-mobile-nav="global" class="w-full h-[64px]"><div class="w-full max-w-md mx-auto grid grid-cols-4 h-full"><a data-nav-key="home" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a><a data-nav-key="practice" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="pencil" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">练习</span></a><a data-nav-key="games" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="gamepad-2" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">闯关</span></a><a data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>

    <script>lucide.createIcons();</script>
    <style id="style-override">

</body>
</html>
