server:
  port: 8002

spring:
  application:
    name: file-service
  
  # 数据库连接配置 (本地测试，暂不配置在 Nacos 中)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://122.51.234.113:3306/file_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 111111
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Nacos 服务发现配置与配置中心关闭 (本地测试，暂不加载 Nacos 配置)
  cloud:
    nacos:
      discovery:
        server-addr: 122.51.234.113:8848
      config:
        enabled: false
        import-check:
          enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名转换
  global-config:
    db-config:
      logic-delete-field: deleted # 逻辑删除字段名
      logic-delete-value: 1       # 逻辑删除值
      logic-not-delete-value: 0   # 逻辑未删除值

# MinIO 自定义配置参数 (本地测试)
minio:
  endpoint: http://122.51.234.113:9000
  access-key: root
  secret-key: admin111111
  bucket-name: file-bucket # 默认桶名称，上传文件时如果不存在会自动创建
